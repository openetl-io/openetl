# The API server. Its replicas share nothing but the database; the first to
# start creates the org and writes an owner key (README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openetl-server
  labels:
    app.kubernetes.io/name: openetl
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openetl
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openetl
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: openetl
          args: [server]
          envFrom:
            - configMapRef:
                name: openetl
            - secretRef:
                name: openetl
          env:
            - name: OPENETL_LISTEN
              value: :8080
          ports:
            - name: api
              containerPort: 8080
            - name: metrics
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/lib/openetl
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openetl-server
  labels:
    app.kubernetes.io/name: openetl
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: openetl
    app.kubernetes.io/component: server
  ports:
    - name: api
      port: 8080
      targetPort: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openetl-server
  labels:
    app.kubernetes.io/name: openetl
    app.kubernetes.io/component: server
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openetl
      app.kubernetes.io/component: server
