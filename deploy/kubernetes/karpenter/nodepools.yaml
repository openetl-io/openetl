# Karpenter's node pools for openetl on AWS, applied on their own (kubectl
# apply -f): attempts' pods on spot or on-demand nodes, and shared runners on
# on-demand ones. The launcher has a stream's pod prefer nodes that aren't
# spot, which Karpenter gives it unless only spot is left, and marks it
# karpenter.sh/do-not-disrupt, so consolidation leaves it be; a sync's pod
# drains to a checkpoint on a spot notice and is placed again. The component
# beside this file sends the pods to them.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: openetl-attempts
spec:
  template:
    metadata:
      labels:
        openetl.io/nodes: attempts
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: [c, m, r]
      taints:
        - key: openetl.io/nodes
          value: attempts
          effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: openetl-runners
spec:
  template:
    metadata:
      labels:
        openetl.io/nodes: runners
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: [c, m]
      taints:
        - key: openetl.io/nodes
          value: runners
          effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  # Runners hold streams; stopping one moves them, so only empty nodes go.
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
