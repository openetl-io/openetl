# openetl on Kubernetes without the operator: the control plane, and the
# default pool's runners and pod launcher. README.md says what to create
# first, and how to scale.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openetl
resources:
  - config.yaml
  - server.yaml
  - orchestrator.yaml
  - runner-default.yaml
  - launcher-default.yaml
# KEDA scales runners on the placer's metrics; Karpenter's node pools take
# attempts' pods and runners (apply karpenter/nodepools.yaml first).
# components:
#   - keda
#   - karpenter
images:
  # openetld's image: edge, built from main, or yours from make image,
  # which kustomize edit set image openetl=REGISTRY/openetl:TAG sets. A
  # kustomization with this one as a resource sets the release's tag; each
  # release's kubernetes.yaml is this, built with it.
  - name: openetl
    newName: ghcr.io/openetl-io/openetl
    newTag: edge
