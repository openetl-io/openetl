# Orchestrators run the workflows, place attempts on runners and pods, and
# export the placer's metrics, which KEDA scales runners on. On DBOS each needs
# an executor ID of its own, its pod's name, and the replicas recover each
# other's workflows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openetl-orchestrator
  labels:
    app.kubernetes.io/name: openetl
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openetl
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openetl
        app.kubernetes.io/component: orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: openetl
          args: [orchestrator]
          envFrom:
            - configMapRef:
                name: openetl
            - secretRef:
                name: openetl
          env:
            - name: OPENETL_EXECUTOR_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: metrics
              containerPort: 9464
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/lib/openetl
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openetl-orchestrator
  labels:
    app.kubernetes.io/name: openetl
    app.kubernetes.io/component: orchestrator
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openetl
      app.kubernetes.io/component: orchestrator
