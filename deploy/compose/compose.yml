# OpenETL on one machine: Postgres, the API server with the console, an
# orchestrator and a runner, all from openetld's image (make image).
# docs/self-host/compose.md is the guide. From this directory:
#
#   docker compose up -d
#
# .env, beside this file, sets POSTGRES_PASSWORD and OPENETL_SECRETS_KEY.
# Every openetld here also reads .env, so any other setting (OPENETL_*,
# OTEL_*) goes there too.

name: openetl

x-openetl: &openetl
  image: ${OPENETL_IMAGE:-openetl:dev}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false

services:
  # OpenETL's own records, and on DBOS, its workflows in openetl_dbos.
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: openetl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: openetl
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openetl"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The API and the console. Its first start writes an owner key to
  # .openetl/admin.key in the volume server.
  server:
    <<: *openetl
    command: [server]
    environment:
      OPENETL_DATABASE_URL: postgres://openetl:${POSTGRES_PASSWORD}@postgres:5432/openetl
      OPENETL_SECRETS_KEY: ${OPENETL_SECRETS_KEY:?set OPENETL_SECRETS_KEY in .env}
      OPENETL_LISTEN: :8080
      OPENETL_WEB: /opt/openetl/web
      OPENETL_PUBLIC_URL: ${OPENETL_PUBLIC_URL:-http://localhost:8080}
    ports: ["${OPENETL_PORT:-127.0.0.1:8080}:8080"]
    volumes: ["server:/var/lib/openetl"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '^ok' <&3"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Runs workflows and places jobs on runners. On DBOS, its executor ID
  # must stay the same across restarts; a second orchestrator needs one of
  # its own.
  orchestrator:
    <<: *openetl
    command: [orchestrator]
    environment:
      OPENETL_DATABASE_URL: postgres://openetl:${POSTGRES_PASSWORD}@postgres:5432/openetl
      OPENETL_EXECUTOR_ID: orchestrator
    depends_on:
      server: { condition: service_healthy }

  # Makes the runners' token on the first start, with the server's owner key.
  runner-token:
    <<: *openetl
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        test -s .openetl/runner.token || {
        mkdir -p .openetl &&
        openetl dataplane token create --api-url http://server:8080
        --api-key-file /server/.openetl/admin.key --out .openetl/runner.token default; }
    volumes: ["runner:/var/lib/openetl", "server:/server:ro"]
    depends_on:
      server: { condition: service_healthy }

  # Runs syncs and streams. Runners share the volume runner, which holds the
  # checkpoints and staging, so docker compose up --scale runner=N adds more.
  # A runner told to stop finishes its jobs at a checkpoint first: up to 2
  # minutes for a sync and 10 for a stream.
  runner:
    <<: *openetl
    command: [runner]
    environment:
      OPENETL_API_URL: http://server:8080
      OPENETL_RUNNER_TOKEN_FILE: .openetl/runner.token
    volumes: ["runner:/var/lib/openetl"]
    depends_on:
      runner-token: { condition: service_completed_successfully }
    stop_grace_period: 11m

volumes:
  postgres:
  server:
  runner:
