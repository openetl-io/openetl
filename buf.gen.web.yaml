version: v2
plugins:
  # The UI's clients. Imports are included for google/api's annotations.
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    include_imports: true
    opt:
      - target=ts
      - import_extension=none
inputs:
  - directory: proto
    paths:
      - proto/openetl/api
