        CreateRunnerTokenResponse:
            type: object
            properties:
                token:
                    $ref: '#/components/schemas/RunnerToken'
                secret:
                    type: string
        DataPlane:
            type: object
            properties:
                name:
                    type: string
                    description: dataPlanes/{data_plane}
                createTime:
                    type: string
                    format: date-time
        DbtProject:
            type: object
            properties:
                name:
                    type: string
                    description: workspaces/{workspace}/dbtProjects/{project}
                digest:
                    type: string
                    description: The current bundle's digest, which new pipeline versions pin.
                etag:
                    type: string
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
                usedBy:
                    type: array
                    items:
                        type: string
                    description: The pipelines whose current versions run it.
        DbtStep:
            type: object
            properties:
                project:
                    type: string
                    description: |-
                        A DbtProject in the same workspace. A sync runs the bundle that was
                         current when it started.
                command:
                    enum:
                        - DBT_COMMAND_UNSPECIFIED
                        - DBT_COMMAND_BUILD
                        - DBT_COMMAND_RUN
                        - DBT_COMMAND_TEST
                    type: string
                    format: enum
                select:
                    type: string
                    description: dbt's --select and --exclude.
                exclude:
                    type: string
                schema:
                    type: string
                    description: 'The target schema. Unset: the schema the pipeline writes to.'
            description: DbtStep runs a dbt project against the pipeline's destination.
