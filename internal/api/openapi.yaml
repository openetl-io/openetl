                                $ref: '#/components/schemas/GetSparkClusterResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        delete:
            tags:
                - SparkClusterService
            description: |-
                Fails with FAILED_PRECONDITION while a pipeline's current version uses
                 it. Older versions keep the settings they pin.
            operationId: SparkClusterService_DeleteSparkCluster
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: sparkCluster
                  in: path
                  description: The sparkCluster id.
                  required: true
                  schema:
                    type: string
                - name: etag
                  in: query
                  description: If set, it must match.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteSparkClusterResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/workspaces/{workspace}/webhooks:
        get:
            tags:
                - WebhookService
            operationId: WebhookService_ListWebhooks
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListWebhooksResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/workspaces/{workspace}/webhooks/{webhook}:
        get:
            tags:
                - WebhookService
            operationId: WebhookService_GetWebhook
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: webhook
                  in: path
                  description: The webhook id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetWebhookResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        delete:
            tags:
                - WebhookService
            description: Deletes its deliveries too.
            operationId: WebhookService_DeleteWebhook
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: webhook
                  in: path
                  description: The webhook id.
                  required: true
                  schema:
                    type: string
                - name: etag
                  in: query
                  description: If set, it must match.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteWebhookResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/workspaces/{workspace}/webhooks/{webhook}/deliveries:
        get:
            tags:
                - WebhookService
            description: Newest first. Deliveries are kept for 7 days.
            operationId: WebhookService_ListWebhookDeliveries
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: webhook
                  in: path
                  description: The webhook id.
                  required: true
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListWebhookDeliveriesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/workspaces/{workspace}/webhooks/{webhook}:disable:
        post:
            tags:
                - WebhookService
            description: |-
                Its pending deliveries fail, and events until it's enabled again aren't
                 delivered to it.
            operationId: WebhookService_DisableWebhook
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: webhook
                  in: path
                  description: The webhook id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DisableWebhookRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DisableWebhookResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/workspaces/{workspace}/webhooks/{webhook}:enable:
        post:
            tags:
                - WebhookService
            description: |-
                Delivers events from now on, to a webhook disabled by a call or by
                 failing.
            operationId: WebhookService_EnableWebhook
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: webhook
                  in: path
                  description: The webhook id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EnableWebhookRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EnableWebhookResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/workspaces/{workspace}/webhooks/{webhook}:test:
        post:
            tags:
                - WebhookService
            description: |-
                Records a webhook.test event for this webhook alone, whatever its
                 filters.
            operationId: WebhookService_TestWebhook
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
                - name: webhook
                  in: path
                  description: The webhook id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TestWebhookRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TestWebhookResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/workspaces/{workspace}:apply:
        post:
            tags:
                - ApplyService
            description: |-
                Stores each definition as an immutable version; unchanged definitions
                 keep theirs. A pipeline's version pins the versions of its source and
                 destination and its dbt projects' bundles. Either every document applies
                 or none does.
            operationId: ApplyService_Apply
            parameters:
                - name: workspace
                  in: path
                  description: The workspace id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApplyRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApplyResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
components:
    schemas:
        AppliedResource:
            type: object
            properties:
                kind:
                    type: string
                name:
                    type: string
                action:
                    enum:
                        - APPLY_ACTION_UNSPECIFIED
                        - APPLY_ACTION_CREATED
                        - APPLY_ACTION_UPDATED
                        - APPLY_ACTION_UNCHANGED
                    type: string
                    format: enum
                version:
                    type: string
                    description: |-
                        Empty for a pipeline in a validate_only apply that also creates its
                         source or destination: the version hashes their IDs, which only the
                         apply assigns.
        ApplyRequest:
            type: object
            properties:
                workspace:
                    type: string
                    description: workspaces/{workspace}, for documents that don't name one.
                documents:
                    type: array
                    items:
                        $ref: '#/components/schemas/Document'
                validateOnly:
                    type: boolean
                client:
                    type: string
                    description: |-
                        What's applying, such as "cli", for connector versions' provenance.
                         Empty: "api".
                transfer:
                    type: array
                    items:
                        type: string
                    description: |-
                        Connector packages, by name, whose versions may come from another
                         repository than their earlier versions.
        ApplyResponse:
            type: object
            properties:
                resources:
                    type: array
                    items:
                        $ref: '#/components/schemas/AppliedResource'
                    description: One per document, in order.
                dependents:
                    type: array
                    items:
                        $ref: '#/components/schemas/AppliedResource'
                    description: |-
                        Pipelines the documents don't define, which have a new version because
                         a source, destination or dbt project they use changed.
                plans:
                    type: array
                    items:
                        $ref: '#/components/schemas/PipelinePlan'
                    description: One per pipeline in resources, then one per dependent.
        AuditEntry:
            type: object
            properties:
                name:
                    type: string
                    description: auditEntries/{id}
                time:
                    type: string
                    description: When the call started.
                    format: date-time
                actor:
                    type: string
                    description: principals/{p} or dataPlanes/{dp}, or openetld for its own changes.
                credential:
                    type: string
                    description: principals/{p}/keys/{k} or dataPlanes/{dp}/tokens/{t}.
                method:
                    type: string
                    description: The RPC's procedure, such as /openetl.api.v1.PipelineService/SyncPipeline.
                resources:
                    type: array
                    items:
                        type: string
                    description: |-
                        The resources the call named or touched, including the secrets whose
                         values it read.
                details:
                    type: object
                    description: |-
                        What the method records, such as each applied document's version.
                         Never a secret's value.
                peer:
                    type: string
                    description: The caller's address.
                userAgent:
                    type: string
                code:
                    type: string
                    description: |-
                        A Connect code, such as ok or permission_denied. Empty if the call
                         hasn't ended, or the server stopped before it did.
                error:
                    type: string
                endTime:
                    type: string
                    format: date-time
        Catalog:
            type: object
            properties:
                streams:
                    type: array
                    items:
                        $ref: '#/components/schemas/CatalogStream'
                version:
                    type: string
                    description: The source version discovered.
                discoverTime:
                    type: string
                    format: date-time
            description: Catalog is what a source's Discover found.
        CatalogColumn:
            type: object
            properties:
                name:
                    type: string
                type:
                    type: string
                    description: |-
                        The Arrow type, such as int64, decimal(10, 2) or
                         timestamp[us, tz=UTC].
                nullable:
                    type: boolean
        CatalogStream:
            type: object
            properties:
                name:
                    type: string
                primaryKey:
                    type: array
                    items:
                        type: string
                cursorField:
                    type: string
                    description: The field whose value orders a record's versions; empty for none.
                replay:
                    enum:
                        - REPLAY_UNSPECIFIED
                        - REPLAY_EXACT
                        - REPLAY_SUPERSET
                    type: string
                    format: enum
                columns:
                    type: array
                    items:
                        $ref: '#/components/schemas/CatalogColumn'
                    description: |-
                        The columns the source declares; empty when the engine infers them from
                         the records.
                syncModes:
                    type: array
                    items:
                        enum:
                            - SYNC_MODE_UNSPECIFIED
                            - SYNC_MODE_FULL_REFRESH
                            - SYNC_MODE_INCREMENTAL
                            - SYNC_MODE_CDC
                            - SYNC_MODE_STREAM
                        type: string
                        format: enum
                    description: |-
                        How the source can read the stream, the way it reads it first; empty if
                         it doesn't say.
        ChangePasswordRequest:
            type: object
            properties:
                currentPassword:
                    type: string
                newPassword:
                    type: string
        ChangePasswordResponse:
            type: object
            properties: {}
        CheckDestinationRequest:
            type: object
            properties:
                name:
                    type: string
                dataPlane:
                    type: string
                    description: 'The data plane whose runner checks it. Unset: the default.'
        CheckDestinationResponse:
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/CheckResult'
        CheckResult:
            type: object
            properties:
                ok:
                    type: boolean
                code:
                    type: string
                    description: 'When not ok: a code of the error taxonomy, such as AUTH_INVALID.'
                message:
                    type: string
                version:
                    type: string
                    description: The source or destination version checked.
            description: |-
                CheckResult is a connector's answer to Check. A connector without a check
                 of its own only validates its config.
        CheckSourceRequest:
            type: object
            properties:
                name:
                    type: string
                dataPlane:
                    type: string
                    description: 'The data plane whose runner checks it. Unset: the default.'
        CheckSourceResponse:
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/CheckResult'
        Checkpoint:
            type: object
            properties:
                generation:
                    type: string
                epoch:
                    type: string
                previousGeneration:
                    type: string
                    description: The record before it in the log; 0 and 0 for the first.
                previousEpoch:
                    type: string
                sync:
                    type: string
                    description: |-
                        The sync that committed it; empty if the control plane has no record
                         of the sync.
                commitTime:
                    type: string
                    description: When the data plane recorded it.
                    format: date-time
                streams:
                    type: array
                    items:
                        $ref: '#/components/schemas/CheckpointStream'
            description: |-
                Checkpoint is a record of the pipeline's checkpoint log: an epoch a sync
                 committed.
        CheckpointStream:
            type: object
            properties:
                name:
                    type: string
                rows:
                    type: string
                    description: Rows the source emitted in the epoch, quarantined ones included.
                quarantinedRows:
                    type: string
                forced:
                    type: boolean
                    description: The barrier was placed without a resume point.
                complete:
                    type: boolean
                    description: The stream's read ended in this epoch.
                schemaVersion:
                    type: integer
                    description: The StreamSchema version it carried; 0 if it had none yet.
                    format: int32
                collapsedRows:
                    type: string
                    description: |-
                        Rows the apply didn't insert because a row with the same _openetl_id
                         was earlier in the epoch or already in the destination.
                heldCells:
                    type: string
                    description: Cells held in the epoch (ADR-0025).
                heldColumns:
                    type: array
                    items:
                        type: string
                    description: |-
                        The columns it held at the checkpoint, whole or some of their cells;
                         discarded ones are left out.
        ColumnGroup:
            type: object
            properties:
                columns:
                    type: array
                    items:
                        type: string
        Commit:
            type: object
            properties:
                interval:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                maxBytes:
                    type: string
                scope:
                    enum:
                        - COMMIT_SCOPE_UNSPECIFIED
                        - COMMIT_SCOPE_PIPELINE
                        - COMMIT_SCOPE_STREAM
                    type: string
                    format: enum
        ConnectorConfig:
            type: object
            properties:
                connector:
                    type: string
                    description: '"postgres", "postgres@1.2.0" or "postgres@sha256:…".'
                config:
                    type: object
                    description: Secret fields hold secret references, never values.
            description: ConnectorConfig is the spec of a Source or Destination document.
        ConnectorVersion:
            type: object
            properties:
                name:
                    type: string
                    description: connectors/{owner}/{name}/versions/{version}
                version:
                    type: string
                digest:
                    type: string
                    description: sha256:{hex}
                author:
                    type: string
                logo:
                    type: string
                    description: An https URL of an image.
                releaseTag:
                    type: string
                    description: The git tag the version was released from.
                releaseUrl:
                    type: string
                    description: An https URL, such as the release's page.
                description:
                    type: string
                license:
                    type: string
                    description: An SPDX expression.
                repository:
                    type: string
                    description: An https URL of the package's source repository.
                docs:
                    type: string
                    description: An https URL.
                tags:
                    type: array
                    items:
                        type: string
            description: |-
                ConnectorVersion is an applied connector version, with what its metadata
                 says about it.
        CreateKeyRequest:
            type: object
            properties:
                parent:
                    type: string
                    description: principals/{principal}
                expireTime:
                    type: string
                    description: 'Unset: the key doesn''t expire.'
                    format: date-time
        CreateKeyResponse:
            type: object
            properties:
                key:
                    $ref: '#/components/schemas/Key'
                secret:
                    type: string
        CreatePasswordLinkRequest:
            type: object
            properties:
                name:
                    type: string
                    description: principals/{principal}
                expireTime:
                    type: string
                    description: 'Unset: in 24 hours. At most 7 days ahead.'
                    format: date-time
        CreatePasswordLinkResponse:
            type: object
            properties:
                url:
                    type: string
                    description: '{public URL}/set-password#{token}. The API never returns it again.'
                expireTime:
                    type: string
                    format: date-time
        CreatePrincipalResponse:
            type: object
            properties:
                principal:
                    $ref: '#/components/schemas/Principal'
        CreateRunnerTokenRequest:
            type: object
            properties:
                parent:
                    type: string
                    description: dataPlanes/{data_plane}
        CreateRunnerTokenResponse:
            type: object
            properties:
                token:
                    $ref: '#/components/schemas/RunnerToken'
                secret:
                    type: string
        DataPlane:
            type: object
            properties:
                name:
                    type: string
                    description: dataPlanes/{data_plane}
                createTime:
                    type: string
                    format: date-time
        DbtProject:
            type: object
            properties:
                name:
                    type: string
                    description: workspaces/{workspace}/dbtProjects/{project}
                digest:
                    type: string
                    description: The current bundle's digest, which new pipeline versions pin.
                etag:
                    type: string
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
                usedBy:
                    type: array
                    items:
                        type: string
                    description: The pipelines whose current versions run it.
        DbtStep:
            type: object
            properties:
                project:
                    type: string
                    description: |-
                        A DbtProject in the same workspace. A sync runs the bundle that was
                         current when it started.
                command:
                    enum:
                        - DBT_COMMAND_UNSPECIFIED
                        - DBT_COMMAND_BUILD
                        - DBT_COMMAND_RUN
                        - DBT_COMMAND_TEST
                    type: string
                    format: enum
                select:
                    type: string
                    description: dbt's --select and --exclude.
                exclude:
                    type: string
                schema:
                    type: string
                    description: 'The target schema. Unset: the schema the pipeline writes to.'
            description: DbtStep runs a dbt project against the pipeline's destination.
        DeleteDbtProjectResponse:
            type: object
            properties: {}
        DeleteDestinationResponse:
            type: object
            properties: {}
        DeleteFlinkClusterResponse:
            type: object
            properties: {}
        DeleteKeyResponse:
            type: object
            properties: {}
        DeletePipelineResponse:
            type: object
            properties: {}
        DeletePrincipalResponse:
            type: object
            properties: {}
        DeleteRunnerTokenResponse:
            type: object
            properties: {}
        DeleteSecretResponse:
            type: object
            properties: {}
        DeleteSourceResponse:
            type: object
            properties: {}
        DeleteSparkClusterResponse:
            type: object
            properties: {}
        DeleteWebhookResponse:
            type: object
            properties: {}
        Delivery:
            type: object
            properties:
                require:
                    enum:
                        - DELIVERY_LEVEL_UNSPECIFIED
                        - DELIVERY_LEVEL_AT_LEAST_ONCE
                        - DELIVERY_LEVEL_EFFECTIVELY_ONCE
                        - DELIVERY_LEVEL_EXACTLY_ONCE
                    type: string
                    description: 'The plan fails if any stream''s guarantee is lower. Unset: exactly once.'
                    format: enum
                commit:
                    $ref: '#/components/schemas/Commit'
                resumePointTimeout:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 'Unset: the default. Zero: wait forever.'
        Destination:
            type: object
            properties:
                name:
                    type: string
                    description: workspaces/{workspace}/destinations/{destination}
                spec:
                    $ref: '#/components/schemas/ConnectorConfig'
                version:
                    type: string
                etag:
                    type: string
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
                connector:
                    allOf:
                        - $ref: '#/components/schemas/ConnectorVersion'
                    description: |-
                        The applied connector version it runs. Unset for built-in connectors
                         and ones from a runner's connectors directory.
        DisablePrincipalRequest:
            type: object
            properties:
                name:
                    type: string
        DisablePrincipalResponse:
            type: object
            properties:
                principal:
                    $ref: '#/components/schemas/Principal'
        DisableWebhookRequest:
            type: object
            properties:
                name:
                    type: string
        DisableWebhookResponse:
            type: object
            properties:
                webhook:
                    $ref: '#/components/schemas/Webhook'
        DiscardHoldRequest:
            type: object
            properties:
                parent:
                    type: string
                    description: workspaces/{workspace}/pipelines/{pipeline}
                stream:
                    type: string
                column:
                    type: string
        DiscardHoldResponse:
            type: object
            properties:
                hold:
                    $ref: '#/components/schemas/Hold'
        DiscoverSourceRequest:
            type: object
            properties:
                name:
                    type: string
                dataPlane:
                    type: string
                    description: 'The data plane whose runner discovers it. Unset: the default.'
        DiscoverSourceResponse:
            type: object
            properties:
                catalog:
                    $ref: '#/components/schemas/Catalog'
        Document:
            type: object
            properties:
                origin:
                    type: string
                    description: Such as a file name, for error messages.
                content:
                    type: string
                    format: bytes
            description: |-
                Document is a YAML or JSON definition with apiVersion, kind, metadata and
                 spec.
        EnablePrincipalRequest:
            type: object
            properties:
                name:
                    type: string
        EnablePrincipalResponse:
            type: object
            properties:
                principal:
                    $ref: '#/components/schemas/Principal'
        EnableWebhookRequest:
            type: object
            properties:
                name:
                    type: string
        EnableWebhookResponse:
            type: object
            properties:
                webhook:
                    $ref: '#/components/schemas/Webhook'
        FlinkAccess:
            type: object
            properties:
                emrRole:
                    type: string
                    description: 'On EMR: the runtime role each step runs as (ExecutionRoleArn).'
                keys:
                    type: object
                    description: |-
                        Elsewhere: S3 keys for the data plane's bucket alone, for Flink's
                         Hadoop S3 filesystem: accessKeyId, a value or a secret reference,
                         {"secret": NAME}, and secretAccessKey, a secret reference. A session
                         cluster reads its filesystems' settings at start, so it can't take them.
            description: |-
                FlinkAccess is how the pipeline's Flink job reaches its _flink/ prefix of
                 the data plane's store, where its code, checkpoints and savepoints are.
                 Unset: with the cluster's own identity.
        FlinkCluster:
            type: object
            properties:
                name:
                    type: string
                    description: workspaces/{workspace}/flinkClusters/{cluster}
                spec:
                    $ref: '#/components/schemas/FlinkClusterSpec'
                version:
                    type: string
                    description: The settings' version, which new pipeline versions pin.
                etag:
                    type: string
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
                usedBy:
                    type: array
                    items:
                        type: string
                    description: The pipelines whose current versions use it.
            description: |-
                FlinkCluster is where a continuous pipeline's Flink job runs. Runners
                 deploy, stop and watch it. Flink 1.20 only.
        FlinkClusterSpec:
            type: object
            properties:
                kubernetes:
                    $ref: '#/components/schemas/FlinkKubernetes'
                rest:
                    $ref: '#/components/schemas/FlinkRest'
                emr:
                    $ref: '#/components/schemas/FlinkEmr'
                conf:
                    type: object
                    description: |-
                        Flink configuration for every job. A value can be a secret reference,
                         {"secret": NAME}. Options the runner sets can't be set here.
        FlinkCode:
            type: object
            properties:
                jar:
                    type: string
                    description: An s3:// or https:// URI the runner can read.
                sha256:
                    type: string
                    description: The file's SHA-256, in hex.
                mainClass:
                    type: string
                    description: 'The job''s main class. Unset: the jar''s manifest names it.'
            description: |-
                FlinkCode is a jar, pinned by its digest. The runner checks it and gives
                 the cluster its own copy.
        FlinkEmr:
            type: object
            properties:
                clusterId:
                    type: string
                    description: |-
                        One of cluster_id and cluster_name. A name finds the one active cluster
                         of that name at each deployment, for clusters that are replaced.
                clusterName:
                    type: string
                region:
                    type: string
            description: FlinkEmr runs each job on YARN, as a step of a cluster of EMR on EC2.
        FlinkKubernetes:
            type: object
            properties:
                namespace:
                    type: string
                image:
                    type: string
                    description: |-
                        A Flink 1.20 image with an S3 filesystem plugin, which reads the job's
                         jar and writes its checkpoints. Unset: flink:1.20.
                serviceAccount:
                    type: string
                    description: |-
                        The service account Flink's pods run as, which HA needs to edit
                         ConfigMaps. Unset: flink.
                kubeconfig:
                    allOf:
                        - $ref: '#/components/schemas/GoogleProtobufValue'
                    description: |-
                        A secret reference, {"secret": NAME}, holding a kubeconfig. Unset: the
                         runner's own service account, in the cluster it runs in.
                jobManager:
                    $ref: '#/components/schemas/FlinkResources'
                taskManager:
                    $ref: '#/components/schemas/FlinkResources'
            description: |-
                FlinkKubernetes runs each job as a FlinkDeployment of the Flink Kubernetes
                 Operator, in application mode, with Kubernetes HA.
        FlinkResources:
            type: object
            properties:
                cpu:
                    type: number
                    description: 'CPUs, such as 0.5 or 2. Unset: 1.'
                    format: double
                memory:
                    type: string
                    description: 'Kubernetes quantity, such as 2048m or 2g. Unset: 2048m.'
        FlinkRest:
            type: object
            properties:
                url:
                    type: string
                    description: The REST API's base URL, such as http://flink:8081.
                auth:
                    allOf:
                        - $ref: '#/components/schemas/GoogleProtobufValue'
                    description: |-
                        A secret reference, {"secret": NAME}, holding a bearer token for a proxy
                         in front of the API. Unset: no token.
            description: |-
                FlinkRest runs each job on a standalone session cluster, through its REST
                 API.
        FlinkTransform:
            type: object
            properties:
                cluster:
                    type: string
                    description: A FlinkCluster in the same workspace.
                code:
                    $ref: '#/components/schemas/FlinkCode'
                parallelism:
                    type: integer
                    description: 'The job''s parallelism. Unset: the cluster''s default.'
                    format: int32
                conf:
                    type: object
                    additionalProperties:
                        type: string
                    description: Flink configuration for the job, over the cluster's.
                outputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/TransformOutput'
                    description: 'Unset: each input stream, under its name and with its settings.'
            description: |-
                FlinkTransform runs the user's Flink job, built with openetl-flink, between
                 a continuous pipeline's source and destination, on a Flink cluster. Its
                 checkpoints are the pipeline's.
        GetCallerResponse:
            type: object
            properties:
                principal:
                    $ref: '#/components/schemas/Principal'
                credential:
                    type: string
                    description: |-
                        principals/{principal}/keys/{key} or principals/{principal}/sessions/{session}.
                         Empty when sign-in is off and the call had no credential.
                expireTime:
                    type: string
                    description: |-
                        When the credential stops working unless it's used, for a session;
                         unset for a key that doesn't expire.
                    format: date-time
                permissions:
                    type: array
                    items:
                        type: string
                    description: |-
                        What the caller may do in the workspace, or on the org: permissions
                         such as pipelines.sync.
                authless:
                    type: boolean
                    description: |-
                        Sign-in is off (openetld --auth none), so calls without a credential
                         act as principals/local, an owner.
        GetDbtProjectResponse:
            type: object
            properties:
                dbtProject:
                    $ref: '#/components/schemas/DbtProject'
        GetDestinationResponse:
            type: object
            properties:
                destination:
                    $ref: '#/components/schemas/Destination'
        GetFlinkClusterResponse:
            type: object
            properties:
                flinkCluster:
                    $ref: '#/components/schemas/FlinkCluster'
        GetIncidentResponse:
            type: object
            properties:
                incident:
                    $ref: '#/components/schemas/Incident'
        GetPipelinePlanResponse:
            type: object
            properties:
                plan:
                    $ref: '#/components/schemas/PipelinePlan'
        GetPipelineResponse:
            type: object
            properties:
                pipeline:
                    $ref: '#/components/schemas/Pipeline'
        GetPipelineVersionResponse:
            type: object
            properties:
                pipelineVersion:
                    $ref: '#/components/schemas/PipelineVersion'
        GetPrincipalResponse:
            type: object
            properties:
                principal:
                    $ref: '#/components/schemas/Principal'
        GetSecretResponse:
            type: object
            properties:
                secret:
                    $ref: '#/components/schemas/Secret'
        GetSourceResponse:
            type: object
            properties:
                source:
                    $ref: '#/components/schemas/Source'
        GetSparkClusterResponse:
            type: object
            properties:
                sparkCluster:
                    $ref: '#/components/schemas/SparkCluster'
        GetSyncResponse:
            type: object
            properties:
                sync:
                    $ref: '#/components/schemas/Sync'
        GetWebhookResponse:
            type: object
            properties:
                webhook:
                    $ref: '#/components/schemas/Webhook'
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        GoogleProtobufValue:
            description: Represents a dynamically typed value which can be either null, a number, a string, a boolean, a recursive struct value, or a list of values.
        GrantRoleRequest:
            type: object
            properties:
                name:
                    type: string
                    description: The principal's name.
                binding:
                    $ref: '#/components/schemas/RoleBinding'
        GrantRoleResponse:
            type: object
            properties:
                principal:
                    $ref: '#/components/schemas/Principal'
        Heal:
            type: object
            properties:
                mode:
                    enum:
                        - HEAL_MODE_UNSPECIFIED
                        - HEAL_MODE_OFF
                        - HEAL_MODE_SUGGEST
                        - HEAL_MODE_AUTO_SAFE
                        - HEAL_MODE_AUTO
                    type: string
                    format: enum
            description: What heal's playbooks may do about the pipeline's incidents.
        HealAction:
            type: object
            properties:
                kind:
                    enum:
                        - HEAL_ACTION_KIND_UNSPECIFIED
                        - HEAL_ACTION_KIND_PAUSE
                    type: string
                    format: enum
                state:
                    enum:
                        - HEAL_ACTION_STATE_UNSPECIFIED
                        - HEAL_ACTION_STATE_APPLIED
                        - HEAL_ACTION_STATE_PROPOSED
                    type: string
                    format: enum
                description:
                    type: string
                time:
                    type: string
                    format: date-time
            description: HealAction is what a playbook did about an incident, or proposes.
        Held:
            type: object
            properties:
                mode:
                    enum:
                        - HELD_MODE_UNSPECIFIED
                        - HELD_MODE_NULL
                        - HELD_MODE_VALUE
                        - HELD_MODE_LAST
                    type: string
                    format: enum
                value:
                    type: string
                    description: |-
                        For value, and for last's rows the destination doesn't have: a value
                         of the column's delivered type, as JSON. Empty: null.
        Hold:
            type: object
            properties:
                stream:
                    type: string
                column:
                    type: string
                whole:
                    type: boolean
                    description: The column is held whole; otherwise some of its cells are.
                reason:
                    type: string
                sinceGeneration:
                    type: string
                    description: The epoch the hold started in.
                sinceEpoch:
                    type: string
                startTime:
                    type: string
                    format: date-time
                cells:
                    type: string
                    description: A cell hold's held cells.
                discarded:
                    type: boolean
                    description: Its values are dropped, and the column stays as the destination has it.
                releasing:
                    type: boolean
                    description: Released, and being patched in.
                pending:
                    type: boolean
                    description: Released or discarded, and waiting for the pipeline's next run.
            description: |-
                Hold is a column, or some of a column's cells, held back while the rest
                 of each row is delivered.
        Incident:
            type: object
            properties:
                name:
                    type: string
                    description: workspaces/{workspace}/pipelines/{pipeline}/incidents/{incident}
                class:
                    enum:
                        - INCIDENT_CLASS_UNSPECIFIED
                        - INCIDENT_CLASS_SYNC_FAILED
                        - INCIDENT_CLASS_AUTH
                        - INCIDENT_CLASS_SCHEMA_BLOCKED
                        - INCIDENT_CLASS_RATE_LIMITED
                        - INCIDENT_CLASS_POSITION_LOST
                        - INCIDENT_CLASS_CRASH_LOOP
                        - INCIDENT_CLASS_LAGGING
                        - INCIDENT_CLASS_RETENTION_AT_RISK
                        - INCIDENT_CLASS_QUARANTINE
                        - INCIDENT_CLASS_HELD
                    type: string
                    format: enum
                code:
                    type: string
                    description: The taxonomy code of the error it came from, such as AUTH_INVALID.
                stream:
                    type: string
                    description: 'Empty: the whole pipeline.'
                state:
                    enum:
                        - INCIDENT_STATE_UNSPECIFIED
                        - INCIDENT_STATE_OPEN
                        - INCIDENT_STATE_RESOLVED
                    type: string
                    format: enum
                severity:
                    enum:
                        - INCIDENT_SEVERITY_UNSPECIFIED
                        - INCIDENT_SEVERITY_WARNING
                        - INCIDENT_SEVERITY_CRITICAL
                    type: string
                    format: enum
                summary:
                    type: string
                message:
                    type: string
                    description: The latest error, or what was measured.
                nextSteps:
                    type: string
                fingerprint:
                    type: string
                    description: |-
                        A digest of the class, the code, the error without its specifics, and
                         the connector versions; the same on every pipeline the same fault hits.
                occurrences:
                    type: integer
                    description: |-
                        The syncs or runs it happened in, or the times a condition was seen
                         again.
                    format: int32
                actions:
                    type: array
                    items:
                        $ref: '#/components/schemas/HealAction'
                details:
                    type: object
                    additionalProperties:
                        type: string
                    description: What it was seen with last, such as lag_seconds.
                sync:
                    type: string
                    description: The sync or run it was seen in last.
                firstSeenTime:
                    type: string
                    format: date-time
                lastSeenTime:
                    type: string
                    format: date-time
                resolveTime:
                    type: string
                    format: date-time
                resolution:
                    type: string
                    description: 'How it was resolved: by progress, or by whom.'
        Key:
            type: object
            properties:
                name:
                    type: string
                    description: principals/{principal}/keys/{key}
                prefix:
                    type: string
                    description: The key's first characters, to tell keys apart.
                expireTime:
                    type: string
                    description: Unset if it doesn't expire.
                    format: date-time
                createTime:
                    type: string
                    format: date-time
                lastUsedTime:
                    type: string
                    description: Updated at most once a minute.
                    format: date-time
            description: 'An API key. Calls send it as Authorization: Bearer KEY.'
        ListAuditEntriesResponse:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/AuditEntry'
                nextPageToken:
                    type: string
        ListCheckpointsResponse:
            type: object
            properties:
                checkpoints:
                    type: array
                    items:
                        $ref: '#/components/schemas/Checkpoint'
                nextPageToken:
                    type: string
        ListDataPlanesResponse:
            type: object
            properties:
                dataPlanes:
                    type: array
                    items:
                        $ref: '#/components/schemas/DataPlane'
        ListDbtProjectsResponse:
            type: object
            properties:
                dbtProjects:
                    type: array
                    items:
                        $ref: '#/components/schemas/DbtProject'
                nextPageToken:
                    type: string
        ListDestinationsResponse:
            type: object
