                secrets:
                    type: array
                    items:
                        $ref: '#/components/schemas/Secret'
                nextPageToken:
                    type: string
        ListSourcesResponse:
            type: object
            properties:
                sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/Source'
                nextPageToken:
                    type: string
        ListSparkClustersResponse:
            type: object
            properties:
                sparkClusters:
                    type: array
                    items:
                        $ref: '#/components/schemas/SparkCluster'
                nextPageToken:
                    type: string
        ListStreamSchemasResponse:
            type: object
            properties:
                streamSchemas:
                    type: array
                    items:
                        $ref: '#/components/schemas/StreamSchema'
                nextPageToken:
                    type: string
        ListSyncsResponse:
            type: object
            properties:
                syncs:
                    type: array
                    items:
                        $ref: '#/components/schemas/Sync'
                nextPageToken:
                    type: string
        ListWebhookDeliveriesResponse:
            type: object
            properties:
                deliveries:
                    type: array
                    items:
                        $ref: '#/components/schemas/WebhookDelivery'
                nextPageToken:
                    type: string
        ListWebhooksResponse:
            type: object
            properties:
                webhooks:
                    type: array
                    items:
                        $ref: '#/components/schemas/Webhook'
                nextPageToken:
                    type: string
        LogEntry:
            type: object
            properties:
                time:
                    type: string
                    format: date-time
                level:
                    type: string
                    description: DEBUG, INFO, WARN or ERROR.
                message:
                    type: string
                attempt:
                    type: integer
                    description: |-
                        The attempt that logged it, from 1: the sync's, or its post-sync
                         step's.
                    format: int32
                postSyncStep:
                    type: integer
                    description: The post-sync step that logged it, from 1; 0 for the sync's attempts.
                    format: int32
                attrs:
                    type: object
                    description: 'The line''s other fields, such as component: connector, engine or dbt.'
            description: |-
                A line of a sync's log, from the runner, the engine, the connectors or
                 dbt.
        PausePipelineRequest:
            type: object
            properties:
                name:
                    type: string
        PausePipelineResponse:
            type: object
            properties:
                pipeline:
                    $ref: '#/components/schemas/Pipeline'
        PinnedConfig:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        workspaces/{workspace}/sources/{source} or …/destinations/{destination};
                         empty if it has been deleted since.
                version:
                    type: string
                    description: The source's or destination's version.
                spec:
                    allOf:
                        - $ref: '#/components/schemas/ConnectorConfig'
                    description: Unset if it has been deleted since.
                connector:
                    type: string
                    description: |-
                        The connector version's digest; empty for a built-in connector, or if
                         it has been deleted since.
            description: PinnedConfig is a version of a source's or destination's config.
        Pipeline:
            type: object
            properties:
                name:
                    type: string
                    description: workspaces/{workspace}/pipelines/{pipeline}
                spec:
                    $ref: '#/components/schemas/PipelineSpec'
                version:
                    type: string
                etag:
                    type: string
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
                paused:
                    type: boolean
                    description: Set by PausePipeline and ResumePipeline, not by the spec.
                status:
                    $ref: '#/components/schemas/PipelineStatus'
        PipelineColumn:
            type: object
            properties:
                op:
                    enum:
                        - COLUMN_OP_KIND_UNSPECIFIED
                        - COLUMN_OP_KIND_HASH
                        - COLUMN_OP_KIND_BLOCK
                    type: string
                    format: enum
                type:
                    enum:
                        - COLUMN_TYPE_UNSPECIFIED
                        - COLUMN_TYPE_STRING
                        - COLUMN_TYPE_FLOAT64
                    type: string
                    description: Only for columns the source declares as decimals.
                    format: enum
                held:
                    allOf:
                        - $ref: '#/components/schemas/Held'
                    description: 'What the column''s held cells show; unset: the stream''s held.'
        PipelineDestination:
            type: object
            properties:
                ref:
                    type: string
                    description: A Destination ID in the same workspace.
                write:
                    enum:
                        - WRITE_MODE_UNSPECIFIED
                        - WRITE_MODE_APPEND
                        - WRITE_MODE_OVERWRITE
                        - WRITE_MODE_MERGE
                    type: string
                    format: enum
                namespace:
                    type: string
                    description: A schema or dataset.
                naming:
                    enum:
                        - NAMING_UNSPECIFIED
                        - NAMING_NORMALIZED
                        - NAMING_SOURCE
                    type: string
                    format: enum
                deletes:
                    enum:
                        - DELETE_MODE_UNSPECIFIED
                        - DELETE_MODE_SOFT
                        - DELETE_MODE_HARD
                    type: string
                    description: 'How merge applies deletes. Unset: soft.'
                    format: enum
        PipelinePlan:
            type: object
            properties:
                pipeline:
                    type: string
                    description: workspaces/{workspace}/pipelines/{pipeline}
                version:
                    type: string
                    description: Empty when only the apply can know it, as AppliedResource.version says.
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlanChange'
                    description: |-
                        What differs from the version that was current; empty for a new
                         pipeline.
                streams:
                    type: array
                    items:
                        $ref: '#/components/schemas/StreamPlan'
                problems:
                    type: array
                    items:
                        type: string
                    description: |-
                        What a sync would fail on. Apply refuses to create or change a pipeline
                         whose plan has any.
                notes:
                    type: array
                    items:
                        type: string
                    description: What the plan couldn't check, and why.
                warnings:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlanWarning'
                    description: What a sync will do that may not be wanted, such as collapsing rows.
            description: |-
                PipelinePlan is how a pipeline version would sync, as far as the control
                 plane can tell from the source's latest catalog and the destination's
                 capabilities.
        PipelineSource:
            type: object
            properties:
                ref:
                    type: string
                    description: A Source ID in the same workspace.
                streams:
                    type: array
                    items:
                        $ref: '#/components/schemas/PipelineStream'
        PipelineSpec:
            type: object
            properties:
                mode:
                    enum:
                        - PIPELINE_MODE_UNSPECIFIED
                        - PIPELINE_MODE_SCHEDULED
                        - PIPELINE_MODE_CONTINUOUS
                    type: string
                    format: enum
                schedule:
                    $ref: '#/components/schemas/Schedule'
                dataPlane:
                    type: string
                source:
                    $ref: '#/components/schemas/PipelineSource'
                destination:
                    $ref: '#/components/schemas/PipelineDestination'
                schemaPolicy:
                    enum:
                        - SCHEMA_POLICY_UNSPECIFIED
                        - SCHEMA_POLICY_ALLOW_ALL
                        - SCHEMA_POLICY_ALLOW_COLUMNS
                        - SCHEMA_POLICY_BLOCK
                        - SCHEMA_POLICY_IGNORE_NEW
                    type: string
                    format: enum
                delivery:
                    $ref: '#/components/schemas/Delivery'
                types:
                    $ref: '#/components/schemas/Types'
                postSync:
                    type: array
                    items:
                        $ref: '#/components/schemas/PostSyncStep'
                    description: |-
                        Run in order after a sync's data is committed. A step that fails fails
                         the sync, and the steps after it don't run.
                heal:
                    $ref: '#/components/schemas/Heal'
                transform:
                    allOf:
                        - $ref: '#/components/schemas/Transform'
                    description: |-
                        The user's code between the source and the destination: Spark in a
                         scheduled pipeline, Flink in a continuous one.
                sparkAccess:
                    $ref: '#/components/schemas/SparkAccess'
                flinkAccess:
                    $ref: '#/components/schemas/FlinkAccess'
            description: |-
                PipelineSpec is the spec of a Pipeline document. Unset fields take their
                 defaults.
        PipelineStatus:
            type: object
            properties:
                lastSync:
                    allOf:
                        - $ref: '#/components/schemas/Sync'
                    description: The latest sync; unset if none has run.
                lastSuccessTime:
                    type: string
                    description: When the latest sync that succeeded ended; unset if none has.
                    format: date-time
                openIncidents:
                    type: integer
                    description: Incidents open on it.
                    format: int32
            description: PipelineStatus is what the pipeline's syncs did.
        PipelineStream:
            type: object
            properties:
                name:
                    type: string
                sync:
                    enum:
                        - SYNC_MODE_UNSPECIFIED
                        - SYNC_MODE_FULL_REFRESH
                        - SYNC_MODE_INCREMENTAL
                        - SYNC_MODE_CDC
                        - SYNC_MODE_STREAM
                    type: string
                    format: enum
                cursor:
                    type: string
                columns:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/PipelineColumn'
                    description: By source column name.
                timestamps:
                    enum:
                        - TIMESTAMP_UNIT_UNSPECIFIED
                        - TIMESTAMP_UNIT_MICROSECOND
                        - TIMESTAMP_UNIT_NANOSECOND
                    type: string
                    format: enum
                require:
                    enum:
                        - DELIVERY_LEVEL_UNSPECIFIED
                        - DELIVERY_LEVEL_AT_LEAST_ONCE
                        - DELIVERY_LEVEL_EFFECTIVELY_ONCE
                        - DELIVERY_LEVEL_EXACTLY_ONCE
                    type: string
                    description: Overrides delivery.require for this stream.
                    format: enum
                collapse:
                    type: boolean
                    description: |-
                        Rows with the same content become one row. Only for streams without a
                         primary key. Unset: true for a superset stream whose require is above
                         at least once, otherwise false.
                quarantine:
                    enum:
                        - QUARANTINE_SCOPE_UNSPECIFIED
                        - QUARANTINE_SCOPE_ROW
                        - QUARANTINE_SCOPE_CELL
                    type: string
                    description: |-
                        What a value that doesn't fit its type holds back (ADR-0025): its row,
                         the default, or only its cell, for a keyed stream into a destination
                         that patches.
                    format: enum
                held:
                    allOf:
                        - $ref: '#/components/schemas/Held'
                    description: What a held cell shows, for columns the columns map doesn't say.
                groups:
                    type: array
                    items:
                        $ref: '#/components/schemas/ColumnGroup'
                    description: 'Columns held together, by source name: holding one holds the rest.'
        PipelineVersion:
            type: object
            properties:
                name:
                    type: string
                    description: workspaces/{workspace}/pipelines/{pipeline}/versions/{version}
                spec:
                    $ref: '#/components/schemas/PipelineSpec'
                source:
                    $ref: '#/components/schemas/PinnedConfig'
                destination:
                    $ref: '#/components/schemas/PinnedConfig'
                dbt:
                    type: object
                    additionalProperties:
                        type: string
                    description: Each dbt project's bundle digest, by project name.
                sparkClusters:
                    type: object
                    additionalProperties:
                        type: string
                    description: Each Spark cluster's version, by cluster name.
                flinkClusters:
                    type: object
                    additionalProperties:
                        type: string
                    description: Each Flink cluster's version, by cluster name.
                dataPlane:
                    type: string
                provenance:
                    type: string
                    description: Where it came from, such as cli:shop.yaml#3.
                createTime:
                    type: string
                    description: When it was first made.
                    format: date-time
                current:
                    type: boolean
                    description: It's the pipeline's current version.
            description: |-
                PipelineVersion is a pipeline's spec with what it pins. Syncs run exactly
                 that. Versions are content-addressed, so going back to an earlier spec
                 makes its version current again.
        PlanChange:
            type: object
            properties:
                field:
                    type: string
                    description: |-
                        A spec field, such as delivery.require or source.streams[orders].cursor,
                         or what the version pins: source.version, destination.version,
                         source.connector, destination.connector or dbt.{project}.
                before:
                    type: string
                    description: As JSON; empty where the field is unset.
                after:
                    type: string
        PlanWarning:
            type: object
            properties:
                stream:
                    type: string
                    description: Empty if it's about the whole pipeline.
                message:
                    type: string
        PostSyncStep:
            type: object
            properties:
                dbt:
                    $ref: '#/components/schemas/DbtStep'
                spark:
                    $ref: '#/components/schemas/SparkStep'
        Principal:
            type: object
            properties:
                name:
                    type: string
                    description: principals/{principal}
                type:
                    enum:
                        - PRINCIPAL_TYPE_UNSPECIFIED
                        - PRINCIPAL_TYPE_USER
                        - PRINCIPAL_TYPE_SERVICE_ACCOUNT
                    type: string
                    format: enum
                displayName:
                    type: string
                email:
                    type: string
                    description: Users only.
                disabled:
                    type: boolean
                    description: 'Output only: DisablePrincipal and EnablePrincipal set it.'
                roleBindings:
                    type: array
                    items:
                        $ref: '#/components/schemas/RoleBinding'
                    description: 'Output only: GrantRole and RevokeRole change them.'
                createTime:
                    type: string
                    format: date-time
            description: A user or a service account, which calls the API with its keys.
        ReadProgress:
            type: object
            properties:
                stream:
                    type: string
                    description: 'Empty: the whole read, such as a replication slot''s.'
                lagBytes:
                    type: string
                    description: What the source holds that the read hasn't acknowledged.
                lagRecords:
                    type: string
                lag:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: How far behind in time; zero once the read has caught up.
                retentionLeftBytes:
                    type: string
                    description: |-
                        How much more the source can take, or how long it waits, before it
                         discards what the read hasn't acknowledged.
                retentionLeft:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                time:
                    type: string
                    description: When the checkpoint that carried it was recorded.
                    format: date-time
            description: |-
                ReadProgress is what a source reported of how far behind it a read is.
                 Unset fields are unknown.
        ReadSyncLogResponse:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/LogEntry'
                nextPageToken:
                    type: string
                    description: |-
                        Where the next page starts. Unset once the sync has ended and every
                         entry is read; while it runs, more may follow, so read again with it.
        ReleaseHoldRequest:
            type: object
            properties:
                parent:
                    type: string
                    description: workspaces/{workspace}/pipelines/{pipeline}
                stream:
                    type: string
                column:
                    type: string
                newVersion:
                    type: boolean
                    description: |-
                        The column held whole sends its values, from the hold's start and from
                         now on, to a new version of it, col__v2, as allow_all does after an
                         incompatible change. The column keeps the type the destination has, so
                         the destination needn't change it.
        ReleaseHoldResponse:
            type: object
            properties:
                hold:
                    $ref: '#/components/schemas/Hold'
        ResolveIncidentRequest:
            type: object
            properties:
                name:
                    type: string
                comment:
                    type: string
                    description: Recorded in the resolution.
        ResolveIncidentResponse:
            type: object
            properties:
                incident:
                    $ref: '#/components/schemas/Incident'
        ResumePipelineRequest:
            type: object
            properties:
                name:
                    type: string
        ResumePipelineResponse:
            type: object
            properties:
                pipeline:
                    $ref: '#/components/schemas/Pipeline'
        RevokeRoleRequest:
            type: object
            properties:
                name:
                    type: string
                    description: The principal's name.
                binding:
                    $ref: '#/components/schemas/RoleBinding'
        RevokeRoleResponse:
            type: object
            properties:
                principal:
                    $ref: '#/components/schemas/Principal'
        RevokeSessionsRequest:
            type: object
            properties:
                name:
                    type: string
                    description: principals/{principal}
        RevokeSessionsResponse:
            type: object
            properties: {}
        RoleBinding:
            type: object
            properties:
                role:
                    enum:
                        - ROLE_UNSPECIFIED
                        - ROLE_VIEWER
                        - ROLE_OPERATOR
                        - ROLE_EDITOR
                        - ROLE_ADMIN
                        - ROLE_OWNER
                    type: string
                    format: enum
                workspace:
                    type: string
                    description: |-
                        workspaces/{workspace}, or empty for the org, which covers every
                         workspace.
        RunnerToken:
            type: object
            properties:
                name:
                    type: string
                    description: dataPlanes/{data_plane}/tokens/{token}
                prefix:
                    type: string
                    description: The token's first characters, to tell tokens apart.
                createTime:
                    type: string
                    format: date-time
                lastUsedTime:
                    type: string
                    description: Updated at most once a minute.
                    format: date-time
            description: |-
                A data plane's runners call DataPlaneService with it, as
                 Authorization: Bearer TOKEN. It serves only that data plane's work.
        Schedule:
            type: object
            properties:
                every:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                cron:
                    type: string
                jitter:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: A random start delay of up to this much.
        SchemaColumn:
            type: object
            properties:
                name:
                    type: string
                type:
                    type: string
                    description: An Arrow type, such as int64, utf8 or timestamp[us, tz=UTC].
                nullable:
                    type: boolean
                source:
                    type: string
                    description: The source's name for it, where the destination's differs.
        Secret:
            type: object
            properties:
                name:
                    type: string
                    description: workspaces/{workspace}/secrets/{secret}
                value:
                    type: string
                    description: 'Input only: at most 64 KiB of UTF-8. Set this or ref.'
                etag:
                    type: string
                    description: On input, if set, it must match.
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
                usedBy:
                    type: array
                    items:
                        type: string
                    description: 'Output only: the sources and destinations whose configs name it.'
                ref:
                    type: string
                    description: |-
                        Where runners read the value, instead of a value stored here:
                           aws-sm://{name or ARN}[?region=…][&version=…][&stage=…][&field=…]
                           gcp-sm://projects/{p}/[locations/{l}/]secrets/{s}[/versions/{v}][?field=…]
                           azure-kv://{vault}/{name}[?version=…][&field=…]
                         field picks a top-level field of a JSON object value. Runners read it
                         for each attempt, check and discover.
        Source:
            type: object
            properties:
                name:
                    type: string
                    description: workspaces/{workspace}/sources/{source}
                spec:
                    $ref: '#/components/schemas/ConnectorConfig'
                version:
                    type: string
                etag:
                    type: string
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
                connector:
                    allOf:
                        - $ref: '#/components/schemas/ConnectorVersion'
                    description: |-
                        The applied connector version it runs. Unset for built-in connectors
                         and ones from a runner's connectors directory.
        SparkAccess:
            type: object
            properties:
                emrRole:
                    type: string
                    description: |-
                        On EMR: the runtime role each step runs as (ExecutionRoleArn, EMR 6.7
                         and later). It's all the step's AWS access, the user's own data's too.
                keys:
                    type: object
                    description: |-
                        Elsewhere: S3A keys for the data plane's bucket alone: accessKeyId, a
                         value or a secret reference, {"secret": NAME}, and secretAccessKey, a
                         secret reference.
            description: |-
                SparkAccess is how the pipeline's Spark applications reach its _spark/
                 prefix of the data plane's store. Unset: with the cluster's own identity,
                 which reaches every pipeline's.
        SparkCluster:
            type: object
            properties:
                name:
                    type: string
                    description: workspaces/{workspace}/sparkClusters/{cluster}
                spec:
                    $ref: '#/components/schemas/SparkClusterSpec'
                version:
                    type: string
                    description: The settings' version, which new pipeline versions pin.
                etag:
                    type: string
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
                usedBy:
                    type: array
                    items:
                        type: string
                    description: The pipelines whose current versions use it.
            description: |-
                SparkCluster is where a pipeline's Spark applications run. Runners submit
                 them; drivers run on the cluster.
        SparkClusterSpec:
            type: object
            properties:
                submit:
                    $ref: '#/components/schemas/SparkSubmit'
                emr:
                    $ref: '#/components/schemas/SparkEmr'
        SparkCode:
            type: object
            properties:
                jar:
                    type: string
                python:
                    type: string
                sha256:
                    type: string
                    description: The file's SHA-256, in hex.
                mainClass:
                    type: string
                    description: 'A jar''s main class. Unset: the jar''s manifest names it.'
            description: |-
                SparkCode is a jar or a Python file, pinned by its digest. The runner checks
                 it and gives the cluster its own copy.
        SparkEmr:
            type: object
            properties:
                clusterId:
                    type: string
                    description: |-
                        One of cluster_id and cluster_name. A name finds the one active cluster
                         of that name at each submission, for clusters that are replaced.
                clusterName:
                    type: string
                region:
                    type: string
            description: SparkEmr adds steps to a cluster of EMR on EC2.
        SparkStep:
            type: object
            properties:
                cluster:
                    type: string
                    description: |-
                        A SparkCluster in the same workspace. A sync runs the settings that were
                         current when it started.
                code:
                    $ref: '#/components/schemas/SparkCode'
                args:
                    type: array
                    items:
                        type: string
                    description: The application's arguments.
                conf:
                    type: object
                    additionalProperties:
                        type: string
                    description: Spark properties for this application, over the cluster's.
            description: SparkStep runs the user's own Spark application on a Spark cluster.
        SparkSubmit:
            type: object
            properties:
                master:
                    type: string
                    description: spark://host:port, yarn, or k8s://https://host:port.
                conf:
                    type: object
                    description: |-
                        Spark properties for every application. A value can be a secret
                         reference, {"secret": NAME}.
                ui:
                    type: string
                    description: |-
                        A standalone master's web UI, through which the runner watches and kills
                         drivers: spark-submit's --status and --kill need the master's REST
                         server, which is off by default. Unset: port 8080 on the master's host.
            description: SparkSubmit submits with spark-submit, in cluster deploy mode.
        SparkTransform:
            type: object
            properties:
                cluster:
                    type: string
                    description: A SparkCluster in the same workspace.
                code:
                    allOf:
                        - $ref: '#/components/schemas/SparkCode'
                    description: A jar's class is the Transform's; a Python file calls openetl_spark.run.
                conf:
                    type: object
                    additionalProperties:
                        type: string
                    description: Spark properties for the application, over the cluster's.
                outputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/TransformOutput'
                    description: 'Unset: each input stream, under its name and with its settings.'
            description: |-
                SparkTransform runs the user's openetl-spark Transform on each epoch of a
                 sync, on a Spark cluster. Its outputs are the destination's streams.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        StreamPlan:
            type: object
            properties:
                name:
                    type: string
                level:
                    enum:
                        - DELIVERY_LEVEL_UNSPECIFIED
                        - DELIVERY_LEVEL_AT_LEAST_ONCE
                        - DELIVERY_LEVEL_EFFECTIVELY_ONCE
                        - DELIVERY_LEVEL_EXACTLY_ONCE
                    type: string
                    format: enum
                dedupe:
                    type: boolean
                    description: Deduped on _openetl_id at apply.
                reason:
                    type: string
                    description: What sets the level.
                collapse:
                    type: boolean
                    description: |-
                        Rows with the same content become one row: within each epoch, and
                         against the target too when the level is exactly once.
                write:
                    enum:
                        - WRITE_MODE_UNSPECIFIED
                        - WRITE_MODE_APPEND
                        - WRITE_MODE_OVERWRITE
                        - WRITE_MODE_MERGE
                    type: string
                    description: |-
                        destination.write, or with none, overwrite for a full refresh into a
                         destination that has it, and append otherwise.
                    format: enum
        StreamSchema:
            type: object
            properties:
                stream:
                    type: string
                version:
                    type: integer
                    description: 1, 2, ... per stream.
                    format: int32
                table:
                    type: string
                    description: The destination table.
                columns:
                    type: array
                    items:
                        $ref: '#/components/schemas/SchemaColumn'
                digest:
                    type: string
                    description: Of the table and columns.
                generation:
                    type: string
                    description: The first checkpoint that carried it.
                epoch:
                    type: string
                createTime:
                    type: string
                    format: date-time
                output:
                    type: boolean
                    description: |-
                        One of a transform's outputs, which are the destination's tables. The
                         rest are the source's streams as the transform reads them.
            description: StreamSchema is a version of a stream's schema, as the destination has it.
        Sync:
            type: object
            properties:
                name:
                    type: string
                    description: workspaces/{workspace}/pipelines/{pipeline}/syncs/{sync}
                version:
                    type: string
                    description: The pipeline version it ran.
                state:
                    enum:
                        - SYNC_STATE_UNSPECIFIED
                        - SYNC_STATE_RUNNING
                        - SYNC_STATE_SUCCEEDED
                        - SYNC_STATE_FAILED
                        - SYNC_STATE_STOPPED
                    type: string
                    format: enum
                error:
                    type: string
                    description: Why it failed.
                startTime:
                    type: string
                    format: date-time
                endTime:
                    type: string
                    description: Unset while it runs.
                    format: date-time
                dataPlane:
                    type: string
                    description: The data plane it ran on, which holds its log.
                streams:
                    type: array
                    items:
                        $ref: '#/components/schemas/SyncStream'
                    description: |-
                        What its committed epochs carried, by stream, from the checkpoints the
                         control plane keeps (30 days).
                continuous:
                    type: boolean
                    description: A continuous pipeline's run.
                lastCommitTime:
                    type: string
                    description: |-
                        When its latest epoch was committed; unset if none was, or the
                         control plane no longer keeps it.
                    format: date-time
                progress:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReadProgress'
                    description: |-
                        How far behind its source the read was at its latest commit, for
                         sources that report it (CDC, Kafka, Kinesis).
                failedAttempts:
                    type: integer
                    description: |-
                        Its attempts that failed, as runners reported them, and the latest
                         one's error. A sync still running may be retrying.
                    format: int32
                lastAttemptError:
                    type: string
                lastAttemptTime:
                    type: string
                    format: date-time
        SyncPipelineRequest:
            type: object
            properties:
                name:
                    type: string
        SyncPipelineResponse:
            type: object
            properties: {}
        SyncStream:
            type: object
            properties:
                name:
                    type: string
                rows:
                    type: string
                    description: Quarantined rows included.
                quarantinedRows:
                    type: string
                collapsedRows:
                    type: string
                    description: |-
                        Rows the destination didn't insert because a row with the same
                         _openetl_id was earlier in the epoch or already there.
                heldCells:
                    type: string
                    description: Cells held in its committed epochs (ADR-0025).
                heldColumns:
                    type: array
                    items:
                        type: string
                    description: |-
                        The columns it held at its latest commit, whole or some of their
                         cells; discarded ones are left out.
        TestWebhookRequest:
            type: object
            properties:
                name:
                    type: string
        TestWebhookResponse:
            type: object
            properties:
                delivery:
                    type: string
                    description: The test event's delivery, pending.
        Transform:
            type: object
            properties:
                spark:
                    $ref: '#/components/schemas/SparkTransform'
                flink:
                    $ref: '#/components/schemas/FlinkTransform'
        TransformOutput:
            type: object
            properties:
                name:
                    type: string
                primaryKey:
                    type: array
                    items:
                        type: string
                write:
                    enum:
                        - WRITE_MODE_UNSPECIFIED
                        - WRITE_MODE_APPEND
                        - WRITE_MODE_OVERWRITE
                        - WRITE_MODE_MERGE
                    type: string
                    format: enum
                require:
                    enum:
                        - DELIVERY_LEVEL_UNSPECIFIED
                        - DELIVERY_LEVEL_AT_LEAST_ONCE
                        - DELIVERY_LEVEL_EFFECTIVELY_ONCE
                        - DELIVERY_LEVEL_EXACTLY_ONCE
                    type: string
                    format: enum
            description: |-
                TransformOutput is one of a transform's outputs. Unset settings take those
                 of the input stream with its name, if there is one.
        Types:
            type: object
            properties:
                infinity:
                    enum:
                        - INFINITY_UNSPECIFIED
                        - INFINITY_CLAMP
                        - INFINITY_QUARANTINE
                    type: string
                    format: enum
            description: How values map to logical types where a pipeline has a choice.
        UpdateSecretResponse:
            type: object
            properties:
                secret:
                    $ref: '#/components/schemas/Secret'
                created:
                    type: boolean
                    description: The secret didn't exist.
        Webhook:
            type: object
            properties:
                name:
                    type: string
                    description: workspaces/{workspace}/webhooks/{webhook}
                spec:
                    $ref: '#/components/schemas/WebhookSpec'
                version:
                    type: string
                    description: A digest of the spec.
                etag:
                    type: string
                state:
                    enum:
                        - WEBHOOK_STATE_UNSPECIFIED
                        - WEBHOOK_STATE_ENABLED
                        - WEBHOOK_STATE_DISABLED
                    type: string
                    format: enum
                disabledReason:
                    type: string
                    description: |-
                        Why it's disabled: a call, an endpoint that answered 410 Gone, or one
                         that failed for too long.
                failingSince:
                    type: string
                    description: When its endpoint started failing; unset once a delivery succeeds.
                    format: date-time
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
        WebhookDelivery:
            type: object
            properties:
                name:
                    type: string
                    description: workspaces/{workspace}/webhooks/{webhook}/deliveries/{delivery}
                eventId:
                    type: string
                    description: The event's ID, sent as webhook-id, and its type.
                eventType:
                    type: string
                state:
                    enum:
                        - DELIVERY_STATE_UNSPECIFIED
                        - DELIVERY_STATE_PENDING
                        - DELIVERY_STATE_SUCCEEDED
                        - DELIVERY_STATE_FAILED
                    type: string
                    format: enum
                attempts:
                    type: integer
                    format: int32
                nextAttemptTime:
                    type: string
                    description: When it's tried next, while pending.
                    format: date-time
                lastAttemptTime:
                    type: string
                    format: date-time
                responseStatus:
                    type: integer
                    description: The latest attempt's HTTP status; zero if it got no response.
                    format: int32
                responseBody:
                    type: string
                    description: The start of the latest response's body.
                error:
                    type: string
                    description: Why the latest attempt failed.
                latency:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                createTime:
                    type: string
                    format: date-time
            description: |-
                WebhookDelivery is one event's delivery to one webhook, and how its
                 latest attempt went.
        WebhookSpec:
            type: object
            properties:
                url:
                    type: string
                    description: An http or https URL.
                events:
                    type: array
                    items:
                        type: string
                    description: Event types, or globs such as sync.* or *.
                pipelines:
                    type: array
                    items:
                        type: string
                    description: |-
                        Only these pipelines' events, by name; empty: every pipeline's, and the
                         workspace's own.
                secrets:
                    type: array
                    items:
                        type: string
                    description: |-
                        The secrets that sign each delivery, by name in the workspace, each
                         holding a Standard Webhooks key (whsec_ and base64). Each signs it, so a
                         new key can be added before the old one is removed.
            description: |-
                WebhookSpec is a Webhook document's spec: where the workspace's platform
                 events go, and which.
tags:
    - name: AccessService
      description: |-
        AccessService manages who may call the API: principals, their keys and
         roles. It also makes data planes' runner tokens, which only
         DataPlaneService takes.
    - name: ApplyService
    - name: AuditService
      description: |-
        AuditService reads the audit log: every call that changes something or
         reads secrets' values, who made it, and how it ended.
    - name: DbtProjectService
      description: |-
        DbtProjectService reads and deletes dbt projects. ApplyService creates and
         changes them.
    - name: DestinationService
      description: |-
        DestinationService reads and deletes destinations. ApplyService creates and
         changes them.
    - name: FlinkClusterService
      description: |-
        FlinkClusterService reads and deletes Flink clusters. ApplyService creates
         and changes them.
    - name: IncidentService
      description: |-
        IncidentService reads incidents and resolves them by hand. The control
         plane opens them, and resolves most once their pipeline makes progress
         again.
    - name: PipelineService
      description: |-
        PipelineService reads and deletes pipelines. ApplyService creates and
         changes them.
    - name: SecretService
      description: |-
        SecretService stores the secrets that sources' and destinations' configs
         name, as {"secret": "NAME"}, in their workspace. A secret holds a value,
         encrypted at rest, or a reference to a cloud secret store, which runners
         read with their own cloud identity. The API never returns values.
    - name: SourceService
      description: |-
        SourceService reads and deletes sources. ApplyService creates and changes
         them.
    - name: SparkClusterService
      description: |-
        SparkClusterService reads and deletes Spark clusters. ApplyService creates
         and changes them.
    - name: SyncService
      description: |-
        SyncService reads pipelines' syncs and their logs. A continuous
         pipeline's syncs are its runs: each runs one version until it is stopped
         or fails.
    - name: WebhookService
      description: |-
        WebhookService reads, deletes, disables and enables webhooks, sends them
         test events and lists their deliveries. ApplyService creates and changes
         them.
