                notes:
                    type: array
                    items:
                        type: string
                    description: What the plan couldn't check, and why.
                warnings:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlanWarning'
                    description: What a sync will do that may not be wanted, such as collapsing rows.
