name: e2e
description: >-
  Every end-to-end test, one at a time, against the compose stack, with the
  official connectors built from openetl-connectors' main and openetl-spark
  and openetl-flink built here. The job checks this repository out first.

inputs:
  orchestrator:
    description: dbos or temporal
    default: dbos
  engine:
    description: A Linux openetl-engine
    required: true

runs:
  using: composite
  steps:
    # The whole stack's images and the connectors' builds don't fit beside
    # the runner's preinstalled SDKs, none of which the job uses. Deleting
    # them takes a minute and a half, so it runs while the job sets up.
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &
        echo $! > "$RUNNER_TEMP/free-disk.pid"
    # A nested module, so ./... skips it.
    - uses: actions/checkout@v5
      with:
        repository: openetl-io/openetl-connectors
        ref: main
        path: openetl-connectors
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: false
    - id: go-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-e2e-${{ hashFiles('go.sum', 'openetl-connectors/go.sum') }}
        restore-keys: go-e2e-
    - id: maven-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.m2
        key: maven-e2e-${{ hashFiles('libs/**/pom.xml') }}
        restore-keys: maven-e2e-
    # dbt Core: dbt v2 has no Postgres adapter.
    - name: dbt for post-sync steps
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/dbt"
        "$RUNNER_TEMP/dbt/bin/pip" install --quiet dbt-core==1.12.6 dbt-postgres==1.11.0
        echo "OPENETL_DBT=$RUNNER_TEMP/dbt/bin/dbt" >> "$GITHUB_ENV"
    # The images pull and the services start while the rest builds.
    - name: Start Postgres, S3, Kafka, Kinesis, Spark and Flink, and Temporal if it's what's tested
      shell: bash
      env:
        TEMPORAL: ${{ inputs.orchestrator == 'temporal' && '1' || '' }}
      run: |
        tail --pid="$(cat "$RUNNER_TEMP/free-disk.pid")" -f /dev/null
        df -h /
        (set +e; make deps-up; echo $? > "$RUNNER_TEMP/deps.status") > "$RUNNER_TEMP/deps.log" 2>&1 &
    # The jars' tests run in ci's spark-lib and flink-lib.
    - name: Build the connectors, openetl-spark, openetl-flink and the tests
      shell: bash
      run: |
        make connectors CONNECTORS_SRC=openetl-connectors
        make spark-lib MAVEN_FLAGS=-DskipTests
        make flink-lib MAVEN_FLAGS=-DskipTests
        go test -tags e2e -c -o "$RUNNER_TEMP/e2e.test" ./test/e2e
    - name: Wait for the services
      shell: bash
      run: |
        for _ in $(seq 600); do [ -f "$RUNNER_TEMP/deps.status" ] && break; sleep 1; done
        cat "$RUNNER_TEMP/deps.log"
        exit "$(cat "$RUNNER_TEMP/deps.status")"
    - name: Scheduled syncs through the whole stack, with engine and runner kills
      shell: bash
      env:
        OPENETL_TEST_ORCHESTRATOR: ${{ inputs.orchestrator }}
        ENGINE: ${{ inputs.engine }}
      run: make e2e CONNECTORS_SRC=openetl-connectors SUITE_ENGINE="$ENGINE" E2E_FLAGS=-v
    # A driver's launch failures are in the worker's log.
    - name: The Spark and Flink containers' logs
      if: failure()
      shell: bash
      run: docker compose -f deploy/compose/dev.yml logs --tail 200 spark-master spark-worker flink-jobmanager flink-taskmanager
    - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.go-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ steps.go-cache.outputs.cache-primary-key }}
    - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.maven-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.m2
        key: ${{ steps.maven-cache.outputs.cache-primary-key }}
