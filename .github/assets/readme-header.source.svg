<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title description">
  <title id="title">OpenETL — Move more data. Use less compute.</title>
  <desc id="description">Open-source data movement. Batch and streaming on your infrastructure. The OpenETL ring sends three orange streams of data toward their destinations.</desc>
