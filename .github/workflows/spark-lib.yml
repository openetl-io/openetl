name: spark-lib

on:
  push:
    branches: ["**"]
    paths:
      - "libs/openetl-spark/**"
      - ".github/workflows/spark-lib.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-spark-lib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spark-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v6
        with:
          path: ~/.m2
          key: maven-${{ github.job }}-${{ hashFiles('libs/**/pom.xml') }}
          restore-keys: maven-${{ github.job }}-
      - run: make spark-lib
