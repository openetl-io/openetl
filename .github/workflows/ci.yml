name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdk/go/go.sum
            tools/go.sum
      - run: make tools
      - name: Generated code is up to date
        run: |
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::make generate changed files; run it and commit the result"
            exit 1
          fi
      - name: Lint
        run: |
          export PATH="$PWD/bin:$PATH"
          buf lint
          buf format --diff --exit-code
          for m in . sdk/go; do (cd "$m" && golangci-lint run ./...); done
      # Informational until v0.1.0-alpha.
      - name: Breaking proto changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          # buf doesn't resolve FETCH_HEAD.
          if git cat-file -e FETCH_HEAD:buf.yaml 2>/dev/null; then
            bin/buf breaking --against ".git#ref=$(git rev-parse FETCH_HEAD)"
          else
            echo "The base branch has no protos yet."
          fi
      - name: Unit tests
        run: go test -race ./... ./sdk/go/...
      - name: SDK builds without the workspace
        working-directory: sdk/go
        run: GOWORK=off go build ./...
      - name: Commit-protocol simulation (fixed seeds)
        run: make sim SEEDS=200

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Start Postgres, Temporal and S3
        run: make deps-up
      - name: Integration tests
        run: make test-integration

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Runner/engine contract tests
        run: |
          cargo build -p openetl-engine
          OPENETL_ENGINE="$PWD/target/debug/openetl-engine" go test -race -count=1 ./internal/engineclient/...
