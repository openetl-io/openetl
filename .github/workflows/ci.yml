name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdk/go/go.sum
            tools/go.sum
      # protoc-gen-es, for the UI's clients.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make tools
      - name: Generated code is up to date
        run: |
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::make generate changed files; run it and commit the result"
            exit 1
          fi
      - name: Lint
        run: |
          export PATH="$PWD/bin:$PATH"
          buf lint
          buf format --diff --exit-code
          for m in . sdk/go; do (cd "$m" && golangci-lint run ./...); done
          workflowcheck ./internal/orchestration/...
      # Informational until v0.1.0-alpha.
      - name: Breaking proto changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          # buf doesn't resolve FETCH_HEAD.
          if git cat-file -e FETCH_HEAD:buf.yaml 2>/dev/null; then
            bin/buf breaking --against ".git#ref=$(git rev-parse FETCH_HEAD)"
          else
            echo "The base branch has no protos yet."
          fi
      - name: Unit tests
        run: go test -race ./... ./sdk/go/...
      - name: SDK builds without the workspace
        working-directory: sdk/go
        run: GOWORK=off go build ./...
      - name: Commit-protocol simulation (fixed seeds)
        run: make sim SEEDS=200

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Start Postgres, Temporal and S3
        run: make deps-up
      - name: Integration tests
        run: make test-integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      # The whole stack's images and the connectors' builds don't fit beside
      # the runner's preinstalled SDKs, none of which the job uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v5
      # The official connectors; a nested module, so ./... skips it.
      - uses: actions/checkout@v5
        with:
          repository: unsuitable001/openetl-connectors
          ref: move-postgres
          path: openetl-connectors
          ssh-key: ${{ secrets.CONNECTORS_DEPLOY_KEY }}
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            openetl-connectors/go.sum
      # dbt Core: dbt v2 has no Postgres adapter.
      - name: dbt for post-sync steps
        run: |
          python3 -m venv "$RUNNER_TEMP/dbt"
          "$RUNNER_TEMP/dbt/bin/pip" install --quiet dbt-core==1.12.6 dbt-postgres==1.11.0
          echo "OPENETL_DBT=$RUNNER_TEMP/dbt/bin/dbt" >> "$GITHUB_ENV"
      - name: Start Postgres, Temporal, S3, Kafka and Kinesis
        run: make deps-up
      - name: Scheduled syncs through the whole stack, with engine and runner kills
        run: make e2e CONNECTORS_SRC=openetl-connectors

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check --hide-inclusion-graph
      - run: cargo test --workspace
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Runner/engine contract tests
        run: |
          cargo build -p openetl-engine
          OPENETL_ENGINE="$PWD/target/debug/openetl-engine" go test -race -count=1 ./internal/engineclient/...
