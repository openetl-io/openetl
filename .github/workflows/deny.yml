name: deny

# Rust dependencies: advisories, licenses, bans and sources. New advisories
# appear without a change here, so full runs it nightly too.
on:
  push:
    branches: ["**"]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/deny.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-deny-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check --hide-inclusion-graph
