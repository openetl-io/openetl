name: chaos

# On demand: gh workflow run chaos.yml --ref <branch> -f runs=100 -f shards=4.
# Each shard runs its share of the runs, from a seed of its own, against a
# compose stack of its own.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per shard
        default: "50"
      shards:
        description: Shards, as a JSON array of their seeds
        default: "[1, 2]"
      parallel:
        description: Runs at a time in each shard
        default: "3"
      flags:
        description: More of the suite's flags, such as -chaos.only=cdc
        default: ""
      orchestrator:
        description: What runs workflows
        type: choice
        options: [dbos, temporal]
        default: dbos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(inputs.shards) }}
    steps:
      # As in e2e: Spark's and Flink's images don't fit beside the runner's
      # preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/free-disk.pid"
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: openetl-io/openetl-connectors
          ref: main
          path: openetl-connectors
          ssh-key: ${{ secrets.CONNECTORS_DEPLOY_KEY }}
      # openetl-connectors' branch of this one's name, when it has one, so a
      # change across both repositories is checked whole.
      - name: Connectors of the same branch
        working-directory: openetl-connectors
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git fetch --depth=1 origin "refs/heads/$BRANCH"; then
            git checkout --detach FETCH_HEAD
          else
            echo "openetl-connectors has no branch $BRANCH, so main"
          fi
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ github.job }}-
      - uses: actions/cache@v6
        with:
          path: ~/.m2
          key: maven-${{ github.job }}-${{ hashFiles('libs/**/pom.xml') }}
          restore-keys: maven-${{ github.job }}-
      - name: Start Postgres, S3, Kafka, Iceberg's catalog, Spark and Flink, and Temporal if it's what's tested
        env:
          TEMPORAL: ${{ inputs.orchestrator == 'temporal' && '1' || '' }}
        run: |
          tail --pid="$(cat "$RUNNER_TEMP/free-disk.pid")" -f /dev/null
          (set +e; make deps-up DEPS="postgres s3 kafka iceberg spark-master spark-worker flink-jobmanager flink-taskmanager"; echo $? > "$RUNNER_TEMP/deps.status") > "$RUNNER_TEMP/deps.log" 2>&1 &
      - name: Build the engine, the connectors, openetl-spark and openetl-flink
        run: |
          make connectors CONNECTORS_SRC=openetl-connectors
          make spark-lib MAVEN_FLAGS=-DskipTests
          make flink-lib MAVEN_FLAGS=-DskipTests
          cargo build -p openetl-engine
      - name: Wait for the services
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/deps.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/deps.log"
          exit "$(cat "$RUNNER_TEMP/deps.status")"
      - name: Randomized pipelines under faults
        env:
          OPENETL_CHAOS_REPORT: ${{ runner.temp }}/chaos-report.txt
          OPENETL_TEST_ORCHESTRATOR: ${{ inputs.orchestrator }}
        run: |
          mkdir -p "$RUNNER_TEMP/chaos-logs"
          make chaos CONNECTORS_SRC=openetl-connectors CHAOS_TIMEOUT=290m \
            CHAOS_FLAGS="-chaos.runs=${{ inputs.runs }} -chaos.parallel=${{ inputs.parallel }} -chaos.seed=${{ matrix.seed }} -chaos.logs=$RUNNER_TEMP/chaos-logs ${{ inputs.flags }}"
      - name: Report
        if: always()
        run: cat "$RUNNER_TEMP/chaos-report.txt" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Runners' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs-${{ matrix.seed }}
          path: ${{ runner.temp }}/chaos-logs
          retention-days: 7
