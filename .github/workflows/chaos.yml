name: chaos

# On demand, for a release candidate on its way to a stable release:
#
#   gh workflow run chaos.yml --ref <branch or tag> -f runs=100 -f shards="[1, 2, 3, 4]"
#
# Each shard runs its share of the runs, from a seed of its own, against a
# compose stack of its own. nightly.yml calls it for a short run.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per shard
        default: "50"
      shards:
        description: Shards, as a JSON array of their seeds
        default: "[1, 2]"
      parallel:
        description: Runs at a time in each shard
        default: "3"
      flags:
        description: More of the suite's flags, such as -chaos.only=cdc
        default: ""
      orchestrator:
        description: What runs workflows
        type: choice
        options: [dbos, temporal]
        default: dbos
      timeout:
        description: How long each shard's runs may take, as a Go duration
        default: 290m
  workflow_call:
    inputs:
      runs:
        type: string
        default: "50"
      shards:
        type: string
        default: "[1, 2]"
      parallel:
        type: string
        default: "3"
      flags:
        type: string
        default: ""
      orchestrator:
        type: string
        default: dbos
      timeout:
        type: string
        default: 290m

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(inputs.shards) }}
    steps:
      # As in e2e: Spark's and Flink's images don't fit beside the runner's
      # preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/free-disk.pid"
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: openetl-io/openetl-connectors
          ref: main
          path: openetl-connectors
      - name: Start Postgres, S3, Kafka, Iceberg's catalog, Spark and Flink, and Temporal if it's what's tested
        env:
          TEMPORAL: ${{ inputs.orchestrator == 'temporal' && '1' || '' }}
        run: |
          tail --pid="$(cat "$RUNNER_TEMP/free-disk.pid")" -f /dev/null
          (set +e; make deps-up DEPS="postgres s3 kafka iceberg spark-master spark-worker flink-jobmanager flink-taskmanager"; echo $? > "$RUNNER_TEMP/deps.status") > "$RUNNER_TEMP/deps.log" 2>&1 &
      - id: engine
        uses: ./.github/actions/engine
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # e2e's caches: the same connectors and tests.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-e2e-${{ hashFiles('go.sum', 'openetl-connectors/go.sum') }}
          restore-keys: go-e2e-
      - uses: actions/cache/restore@v6
        with:
          path: ~/.m2
          key: maven-e2e-${{ hashFiles('libs/**/pom.xml') }}
          restore-keys: maven-e2e-
      - name: Build the connectors, openetl-spark and openetl-flink
        run: |
          make connectors CONNECTORS_SRC=openetl-connectors
          make spark-lib MAVEN_FLAGS=-DskipTests
          make flink-lib MAVEN_FLAGS=-DskipTests
      - name: Wait for the services
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/deps.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/deps.log"
          exit "$(cat "$RUNNER_TEMP/deps.status")"
      - name: Randomized pipelines under faults
        env:
          OPENETL_CHAOS_REPORT: ${{ runner.temp }}/chaos-report.txt
          OPENETL_TEST_ORCHESTRATOR: ${{ inputs.orchestrator }}
          ENGINE: ${{ steps.engine.outputs.path }}
          TIMEOUT: ${{ inputs.timeout }}
          FLAGS: -chaos.runs=${{ inputs.runs }} -chaos.parallel=${{ inputs.parallel }} -chaos.seed=${{ matrix.seed }} ${{ inputs.flags }}
        run: |
          mkdir -p "$RUNNER_TEMP/chaos-logs"
          make chaos CONNECTORS_SRC=openetl-connectors SUITE_ENGINE="$ENGINE" CHAOS_TIMEOUT="$TIMEOUT" \
            CHAOS_FLAGS="$FLAGS -chaos.logs=$RUNNER_TEMP/chaos-logs"
      - name: Report
        if: always()
        run: cat "$RUNNER_TEMP/chaos-report.txt" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Runners' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs-${{ matrix.seed }}
          path: ${{ runner.temp }}/chaos-logs
          retention-days: 7
