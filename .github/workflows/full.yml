name: full

# Every check, without path filters: nightly when the default branch has
# moved, and for release tags. Only here, so a branch's pushes don't run each
# check twice; integration and e2e also run on demand from their own
# workflows. The full job passes only when all the others did, so a merge can
# require it.
on:
  schedule:
    - cron: "17 23 * * *"
  push:
    tags: ["v*", "sdk/*/v*"]

permissions:
  contents: read

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A nightly run skips a commit that has passed already.
  changed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.passed.outputs.run }}
    steps:
      - id: passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w full.yml -c "$GITHUB_SHA" -s success --json databaseId -q length)
          fi
          echo "run=$([ "$n" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  go:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/go.yml

  rust:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/rust.yml

  deny:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/deny.yml

  web:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/web.yml

  spark-lib:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/spark-lib.yml

  flink-lib:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/flink-lib.yml

  integration:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/integration.yml

  e2e:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  # DBOS is the default, so Temporal runs here, nightly, and not on demand.
  e2e-temporal:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
    with:
      orchestrator: temporal

  kind:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/kind.yml
    secrets: inherit

  full:
    needs: [changed, go, rust, deny, web, spark-lib, flink-lib, integration, e2e, e2e-temporal, kind]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RUN: ${{ needs.changed.outputs.run }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # A nightly run of a commit that passed already skipped the rest.
          if [ "$RUN" = false ]; then exit 0; fi
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
