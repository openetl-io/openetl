name: release-candidate-test

# Temporary, and removed before this branch merges: dispatching a workflow
# needs it on main, so this runs the new ones from their branch, on a throwaway
# version, when the head commit's message has run-test-candidate, and discards
# it when the message has discard-test-candidate.
on:
  push:
    branches: [release-candidate-flow]

permissions: {}

jobs:
  candidate:
    if: ${{ contains(github.event.head_commit.message, 'run-test-candidate') }}
    uses: ./.github/workflows/release-candidate.yml
    permissions:
      actions: write
      contents: write
      packages: write
    with:
      version: 0.0.1-alpha.2
      replace: true

  private:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - name: An anonymous pull is refused
        run: |
          r=candidates/0.0.1-alpha.2/openetl
          t=$(curl -s "https://ghcr.io/token?scope=repository:openetl-io/$r:pull&service=ghcr.io" | jq -r '.token // ""')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $t" -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/openetl-io/$r/manifests/0.0.1-alpha.2")
          echo "$r: $code"
          [ "$code" != 200 ]

  discard:
    if: ${{ contains(github.event.head_commit.message, 'discard-test-candidate') }}
    uses: ./.github/workflows/release-discard.yml
    permissions:
      contents: write
      packages: write
    with:
      version: 0.0.1-alpha.1

  # The first trials' connector packages, from before they moved.
  leftovers:
    if: ${{ contains(github.event.head_commit.message, 'discard-test-candidate') }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for p in postgres kafka kinesis iceberg s3 index; do
            gh api -X DELETE "/orgs/openetl-io/packages/container/candidates%2F0.0.1-alpha.1%2Fconnectors%2F$p" && echo "deleted $p"
          done
