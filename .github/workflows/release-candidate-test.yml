name: release-candidate-test

# Temporary, and removed before this branch merges: dispatching a workflow
# needs it on main, so this runs the new ones from their branch, on a throwaway
# version, when the head commit's message has run-test-candidate, and discards
# it when the message has discard-test-candidate.
on:
  push:
    branches: [release-candidate-flow]

permissions: {}

jobs:
  candidate:
    if: ${{ contains(github.event.head_commit.message, 'run-test-candidate') }}
    uses: ./.github/workflows/release-candidate.yml
    permissions:
      actions: write
      contents: write
      packages: write
    with:
      version: 0.0.1-alpha.4
      replace: true

  private:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - name: An anonymous pull is refused
        run: |
          r=candidates/0.0.1-alpha.4/openetl
          t=$(curl -s "https://ghcr.io/token?scope=repository:openetl-io/$r:pull&service=ghcr.io" | jq -r '.token // ""')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $t" -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/openetl-io/$r/manifests/0.0.1-alpha.4")
          echo "$r: $code"
          [ "$code" != 200 ]

  discard:
    if: ${{ contains(github.event.head_commit.message, 'discard-test-candidate') }}
    strategy:
      matrix:
        version: [0.0.1-alpha.2, 0.0.1-alpha.3]
    uses: ./.github/workflows/release-discard.yml
    permissions:
      contents: write
      packages: write
    with:
      version: ${{ matrix.version }}
