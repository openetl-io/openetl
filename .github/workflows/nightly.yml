name: nightly
run-name: nightly (${{ github.event_name == 'workflow_dispatch' && inputs.suites || github.event.schedule == '41 4 * * 0' && 'cleanup' || 'all' }})

# The heavy suites: integration, every end-to-end test on DBOS and on
# Temporal, kind, a short chaos run, and cargo-deny's advisories.
#
# Each night on main's head, every suite, titled "nightly (all)"; a commit
# that has passed already runs deny alone. A red run opens an issue, or
# comments on the open one, and a green one closes it. release.yml releases
# only a commit with a passing "nightly (all)" run.
#
# Dispatched on any branch or tag, it runs the suites in `suites`, such as
#
#   gh workflow run nightly.yml --ref BRANCH -f suites="e2e-dbos kind"
#
# and opens no issue. suites=all runs every suite, as a release needs.
#
# Each Sunday, a second schedule deletes the image's untagged versions that
# are older than 14 days and that no tagged image holds.
on:
  schedule:
    - cron: "17 23 * * *"
    - cron: "41 4 * * 0"
  workflow_dispatch:
    inputs:
      suites:
        description: "Suites, separated by spaces: integration, e2e-dbos, e2e-temporal, kind, chaos and deny; or all"
        type: string
        default: integration e2e-dbos e2e-temporal kind

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}-${{ github.event.schedule || inputs.suites }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.event.schedule != '41 4 * * 0'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      integration: ${{ steps.suites.outputs.integration }}
      e2e-dbos: ${{ steps.suites.outputs.e2e-dbos }}
      e2e-temporal: ${{ steps.suites.outputs.e2e-temporal }}
      kind: ${{ steps.suites.outputs.kind }}
      chaos: ${{ steps.suites.outputs.chaos }}
      deny: ${{ steps.suites.outputs.deny }}
      engine: ${{ steps.suites.outputs.engine }}
    steps:
      - id: suites
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SUITES: ${{ inputs.suites }}
        run: |
          known="integration e2e-dbos e2e-temporal kind chaos deny"
          if [ "$EVENT" = schedule ]; then
            passed=$(gh run list -R "$GITHUB_REPOSITORY" -w nightly.yml -c "$GITHUB_SHA" -s success -L 100 \
              --json displayTitle -q '[.[] | select(.displayTitle == "nightly (all)")] | length')
            if [ "$passed" = 0 ]; then
              SUITES=all
            else
              echo "Every suite passed on $GITHUB_SHA already, so deny runs alone." >> "$GITHUB_STEP_SUMMARY"
              SUITES=deny
            fi
          fi
          [ "$SUITES" != all ] || SUITES=$known
          read -ra asked <<<"$SUITES"
          for s in "${asked[@]}"; do
            [[ " $known " == *" $s "* ]] || { echo "::error::$s isn't a suite: $known, or all"; exit 1; }
          done
          SUITES="${asked[*]}"
          engine=false
          for s in $known; do
            if [[ " $SUITES " == *" $s "* ]]; then
              echo "$s=true" >> "$GITHUB_OUTPUT"
              [ "$s" = deny ] || engine=true
            else
              echo "$s=false" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "Suites: $SUITES" >> "$GITHUB_STEP_SUMMARY"

  # The amd64 engine, for the suites that run one.
  engine:
    needs: plan
    if: needs.plan.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: engine
        uses: ./.github/actions/engine
      - uses: actions/upload-artifact@v4
        with:
          name: engine-linux_amd64
          path: ${{ steps.engine.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  integration:
    needs: [plan, engine]
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-go-test-${{ hashFiles('**/go.sum') }}
          restore-keys: go-go-test-
      - uses: actions/download-artifact@v4
        with:
          name: engine-linux_amd64
          path: ${{ runner.temp }}/engine
      - name: Start Postgres, Temporal, S3, GCS, Azure, Flink and a registry
        run: make deps-up DEPS="postgres temporal s3 gcs azure flink-jobmanager flink-taskmanager oci-registry"
      - name: Integration tests
        run: make test-integration
      # They stage in S3, which ci's run of them has no store for.
      - name: Runner/engine tests against the S3 store
        run: |
          chmod 755 "$RUNNER_TEMP/engine/openetl-engine"
          OPENETL_ENGINE="$RUNNER_TEMP/engine/openetl-engine" go test -tags integration -count=1 ./internal/engineclient/...

  # Every end-to-end test, one at a time: on DBOS, and on Temporal in a job of
  # its own.
  e2e-dbos:
    needs: [plan, engine]
    if: needs.plan.outputs.e2e-dbos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: engine-linux_amd64
          path: ${{ runner.temp }}/engine
      - run: chmod 755 "$RUNNER_TEMP/engine/openetl-engine"
      - uses: ./.github/actions/e2e
        with:
          orchestrator: dbos
          engine: ${{ runner.temp }}/engine/openetl-engine

  e2e-temporal:
    needs: [plan, engine]
    if: needs.plan.outputs.e2e-temporal == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: engine-linux_amd64
          path: ${{ runner.temp }}/engine
      - run: chmod 755 "$RUNNER_TEMP/engine/openetl-engine"
      - uses: ./.github/actions/e2e
        with:
          orchestrator: temporal
          engine: ${{ runner.temp }}/engine/openetl-engine

  # Flink on the Kubernetes operator, PySpark on Spark on Kubernetes, and
  # attempts in pods, in kind.
  kind:
    needs: [plan, engine]
    if: needs.plan.outputs.kind == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/free-disk.pid"
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: openetl-io/openetl-connectors
          ref: main
          path: openetl-connectors
      - uses: actions/download-artifact@v4
        with:
          name: engine-linux_amd64
          path: ${{ runner.temp }}/engine
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # The console, which make image builds into the image.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # e2e's caches, restored: kind builds the same connectors and tests.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-e2e-${{ hashFiles('go.sum', 'openetl-connectors/go.sum') }}
          restore-keys: go-e2e-
      - uses: actions/cache/restore@v6
        with:
          path: ~/.m2
          key: maven-e2e-${{ hashFiles('libs/**/pom.xml') }}
          restore-keys: maven-e2e-
      - name: Start Postgres, S3 and kind
        run: |
          tail --pid="$(cat "$RUNNER_TEMP/free-disk.pid")" -f /dev/null
          curl -fsSLo "$RUNNER_TEMP/kind" https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          sudo install "$RUNNER_TEMP/kind" /usr/local/bin/kind
          (set +e; make deps-up DEPS="postgres s3" && make kind-up; echo $? > "$RUNNER_TEMP/deps.status") > "$RUNNER_TEMP/deps.log" 2>&1 &
      - name: Build the connectors, openetl-flink and openetld's image
        run: |
          chmod 755 "$RUNNER_TEMP/engine/openetl-engine"
          make connectors CONNECTORS_SRC=openetl-connectors
          make flink-lib MAVEN_FLAGS=-DskipTests
          make image CONNECTORS_SRC=openetl-connectors IMAGE=openetl:e2e ENGINE="$RUNNER_TEMP/engine/openetl-engine"
      - name: Wait for the services
        timeout-minutes: 15
        run: |
          until [ -f "$RUNNER_TEMP/deps.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/deps.log"
          exit "$(cat "$RUNNER_TEMP/deps.status")"
      - name: Load openetld's image into kind
        run: make kind-load IMAGE=openetl:e2e
      # Pods reach the host at the kind network's gateway.
      - name: Flink on the operator, with JobManager and runner kills; PySpark after and inside a sync; attempts in pods
        run: |
          host=$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Gateway}} {{end}}' | tr ' ' '\n' | grep -m1 '\.')
          make e2e-kube CONNECTORS_SRC=openetl-connectors SUITE_ENGINE="$RUNNER_TEMP/engine/openetl-engine" KIND_HOST="$host" KIND_IMAGE=openetl:e2e
      - name: The operator's and Flink's logs
        if: failure()
        run: |
          k() { kubectl --kubeconfig .openetl/kind/kubeconfig "$@"; }
          k -n flink-operator logs deploy/flink-kubernetes-operator --tail 300
          k -n openetl get flinkdeployments,pods -o wide --show-labels
          k -n openetl get events --sort-by=.lastTimestamp | tail -50
          for p in $(k -n openetl get pods -o name); do k -n openetl logs "$p" --tail 100; done

  # A short run of the chaos suite, from a seed of the night's own. After
  # engine, whose cache it restores.
  chaos:
    needs: [plan, engine]
    if: needs.plan.outputs.chaos == 'true'
    uses: ./.github/workflows/chaos.yml
    with:
      runs: "8"
      shards: "[${{ github.run_number }}]"
      parallel: "3"
      timeout: 120m

  # Rust dependencies' advisories, which appear without a change here.
  deny:
    needs: plan
    if: needs.plan.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check --hide-inclusion-graph

  # A scheduled run's result, in the issue labeled nightly: a red run opens
  # it, or comments on it, and a green run closes it.
  report:
    needs: [plan, engine, integration, e2e-dbos, e2e-temporal, kind, chaos, deny]
    if: always() && github.event_name == 'schedule' && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) (\(.value.result))"' <<<"$NEEDS" | paste -sd, - | sed 's/,/, /g')
          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --label nightly --state open --json number -q '.[0].number')
          if [ -n "$failed" ]; then
            body="nightly failed on $GITHUB_SHA: $failed. $RUN"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" -R "$GITHUB_REPOSITORY" --body "$body"
            else
              gh label create nightly -R "$GITHUB_REPOSITORY" --color d73a4a --description "nightly.yml's scheduled runs" --force
              gh issue create -R "$GITHUB_REPOSITORY" --label nightly --title "nightly is red" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" -R "$GITHUB_REPOSITORY" --comment "nightly passed on $GITHUB_SHA. $RUN"
          fi

  # Untagged versions of ghcr.io/OWNER/openetl older than 14 days: what edge
  # left behind. A tagged image's own platform images are untagged too, so
  # those are kept.
  cleanup:
    if: github.event.schedule == '41 4 * * 0'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE: /orgs/${{ github.repository_owner }}/packages/container/openetl
      IMAGE: ghcr.io/${{ github.repository_owner }}/openetl
    steps:
      - name: Delete untagged versions older than 14 days
        run: |
          gh api --paginate "$PACKAGE/versions?per_page=100" \
            --jq '.[] | {id, name, updated_at, tags: .metadata.container.tags}' | jq -s . > versions.json
          held=$(jq -r '.[] | select(.tags | length > 0) | .name' versions.json | while read -r digest; do
            docker buildx imagetools inspect --raw "$IMAGE@$digest" | jq -r '.manifests[]?.digest'
          done | sort -u)
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          deleted=0
          while read -r id digest; do
            [ -n "$id" ] || continue
            ! grep -qx "$digest" <<<"$held" || continue
            gh api -X DELETE "$PACKAGE/versions/$id" --silent
            deleted=$((deleted + 1))
          done < <(jq -r --arg cutoff "$cutoff" '.[] | select((.tags | length) == 0 and .updated_at < $cutoff) | "\(.id) \(.name)"' versions.json)
          echo "Deleted $deleted untagged versions of $IMAGE." >> "$GITHUB_STEP_SUMMARY"
