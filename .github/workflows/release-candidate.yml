name: release-candidate

# Builds a chosen commit once, with its final version in it, into a draft
# GitHub release and the private GHCR namespace candidates/VERSION. A draft
# makes no tag until it's published. Nothing is signed here: keyless signatures
# go to a public log, so signing waits for publishing. The test suites run on
# these files (gh workflow run e2e.yml -f candidate=VERSION, and chaos.yml).
# The connectors aren't here: they're released from openetl-connectors, and
# this image holds none, only the default that points at their registry.
# release-discard removes a candidate. Actions are pinned by commit.
on:
  workflow_dispatch:
    inputs: &inputs
      version:
        description: The version, without the v, such as 0.1.0-alpha
        required: true
        type: string
      commit:
        description: The commit to build; empty builds the head of the branch this runs on
        type: string
        default: ""
      replace:
        description: Discard this version's existing candidate first
        type: boolean
        default: false
  workflow_call:
    inputs: *inputs

permissions: {}

concurrency:
  group: release-candidate-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Only a token that can write sees a draft.
    permissions:
      contents: write
    outputs:
      version: ${{ inputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.commit || github.sha }}
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPLACE: ${{ inputs.replace }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$VERSION isn't a version such as 0.1.0-alpha"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error::v$VERSION is already tagged"; exit 1
          fi
          draft=$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ]; then
            echo "::error::v$VERSION is already published"; exit 1
          fi
          if [ "$draft" = true ] && [ "$REPLACE" != true ]; then
            echo "::error::v$VERSION has a candidate; discard it with release-discard, or set replace"; exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  engine:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { platform: linux_amd64, target: x86_64-unknown-linux-gnu }
          - { platform: linux_arm64, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet cargo-zigbuild==0.24.1 ziglang==0.17.1
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      # Linked against glibc 2.28, so the engine runs on older Linux too.
      - env:
          OPENETL_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: cargo zigbuild --locked --release -p openetl-engine --target "$TARGET.2.28"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/openetl-engine
          if-no-files-found: error
          retention-days: 1

  libs:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: maven-libs-${{ hashFiles('libs/**/pom.xml') }}
          restore-keys: maven-libs-
      - name: The jars and the wheel
        run: |
          for lib in spark flink; do
            mkdir -p "libs/openetl-$lib/java/src/main/resources/META-INF"
            cp LICENSE NOTICE "libs/openetl-$lib/java/src/main/resources/META-INF/"
          done
          make spark-lib MAVEN_FLAGS="-DskipTests -Drevision=$VERSION"
          make flink-lib MAVEN_FLAGS="-DskipTests -Prelease -Drevision=$VERSION"
          mkdir -p out
          cp "libs/openetl-spark/java/target/openetl-spark-$VERSION.jar" "libs/openetl-flink/java/target/openetl-flink-$VERSION.jar" out/
          sed -i "s/^version = .*/version = \"$VERSION\"/" libs/openetl-spark/python/pyproject.toml
          cp LICENSE NOTICE libs/openetl-spark/python/
          python3 -m pip wheel --no-deps -w out libs/openetl-spark/python
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libs
          path: out/*
          if-no-files-found: error
          retention-days: 1

  # The one job that writes anywhere, after everything has built.
  assemble:
    needs: [prepare, engine, libs]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write # to delete this run's intermediate builds
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/candidates/${{ needs.prepare.outputs.version }}/openetl
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-release-${{ github.job }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-release-${{ github.job }}-
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: engine-*
          path: build/engine
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libs
          path: build/candidate/assets
      - name: The console and the notices
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          for d in build/engine/engine-*; do
            mv "$d" "build/engine/${d##*/engine-}"
          done
          chmod 755 build/engine/*/openetl-engine
          rustup show active-toolchain || rustup toolchain install
          cargo fetch --locked
          mkdir -p build/candidate/notices
          go run ./internal/notices -out build/candidate/notices/THIRD-PARTY-NOTICES.txt
      # The committed files run edge; these run the release.
      - name: The Compose file and the Kubernetes manifest, with the release's image
        run: |
          image=ghcr.io/openetl-io/openetl
          sed "s|$image:edge}|$image:$VERSION}|" deploy/compose/compose.yml > build/candidate/assets/compose.yml
          grep -q "$image:$VERSION}" build/candidate/assets/compose.yml
          kube=$(mktemp -d)
          cp -R deploy/kubernetes/. "$kube/"
          sed -i "s|^    newTag: edge\$|    newTag: $VERSION|" "$kube/kustomization.yaml"
          kubectl kustomize "$kube" > build/candidate/assets/kubernetes.yaml
          grep -q "image: $image:$VERSION\$" build/candidate/assets/kubernetes.yaml
          ! grep -n ':edge' build/candidate/assets/compose.yml build/candidate/assets/kubernetes.yaml
      - name: The binaries, archives, checksums and SBOMs
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean --skip=publish,announce,validate
        env:
          GORELEASER_CURRENT_TAG: v${{ needs.prepare.outputs.version }}
      - name: Each binary says its version, and each archive has the whole console
        run: |
          want=$(find web/dist -type f | wc -l)
          for archive in dist/openetl_*.tar.gz; do
            listing=$(tar -tzf "$archive")
            got=$(grep -c '/web/.*[^/]$' <<<"$listing")
            [ "$got" = "$want" ] || { echo "::error::$archive has $got of the console's $want files"; exit 1; }
            grep -q '/web/index.html$' <<<"$listing"
            grep -q '/web/assets/' <<<"$listing"
            modes=$(tar -tvzf "$archive")
            grep -q '^-rw-r--r-- .*/THIRD-PARTY-NOTICES.txt$' <<<"$modes" || { echo "::error::$archive's notices aren't readable by everyone"; exit 1; }
          done
          binary() { jq -r --arg id "$1" '.[] | select(.type == "Binary" and .extra.ID == $id and .goos == "linux" and .goarch == "amd64") | .path' dist/artifacts.json; }
          test "$("$(binary openetld)" version)" = "$VERSION"
          test "$("$(binary openetl)" version)" = "$VERSION"
          test "$(build/engine/linux_amd64/openetl-engine --version)" = "openetl-engine $VERSION"
      - name: Discard the version's previous candidate
        if: inputs.replace
        run: deploy/release/candidate.sh discard "$VERSION"
      - name: The image, by digest in the private namespace
        run: |
          binary() { jq -r --arg id "$1" --arg arch "$2" '.[] | select(.type == "Binary" and .extra.ID == $id and .goos == "linux" and .goarch == $arch) | .path' dist/artifacts.json; }
          digests=()
          for arch in amd64 arm64; do
            context=build/image/$arch
            mkdir -p "$context/connectors"
            cp "$(binary openetld "$arch")" "$(binary openetl "$arch")" "build/engine/linux_$arch/openetl-engine" LICENSE NOTICE build/candidate/notices/THIRD-PARTY-NOTICES.txt "$context/"
            cp -R web/dist "$context/web"
            docker buildx build --platform "linux/$arch" --provenance=false -f deploy/image/Dockerfile \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$VERSION" --label "org.opencontainers.image.revision=$COMMIT" \
              --metadata-file "build/image-$arch.json" \
              --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" "$context"
            digests+=("$IMAGE@$(jq -r '."containerimage.digest"' "build/image-$arch.json")")
          done
          docker buildx imagetools create -t "$IMAGE:$VERSION" "${digests[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          for arch in amd64 arm64; do
            syft "registry:$IMAGE:$VERSION" --platform "linux/$arch" -o "spdx-json=build/candidate/assets/openetl-image_${VERSION}_linux_${arch}.sbom.json"
          done
      - name: The draft release
        run: |
          jq -n --arg version "$VERSION" --arg commit "$COMMIT" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg image "$IMAGE@$IMAGE_DIGEST" \
            '{version: $version, commit: $commit, run: $run, image: $image}' > build/candidate.json
          cat build/candidate.json
          prerelease=()
          [[ "$VERSION" != *-* ]] || prerelease=(--prerelease)
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --draft "${prerelease[@]}" --target "$COMMIT" \
            --title "v$VERSION (candidate)" \
            --notes "Release candidate of v$VERSION: commit $COMMIT. Not published, and no tag exists yet." \
            dist/*.tar.gz dist/*.sbom.json dist/checksums.txt build/candidate/assets/* build/candidate.json
      # A public repository's artifacts can be downloaded by anyone signed in.
      - name: Delete this run's intermediate builds
        if: always()
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
