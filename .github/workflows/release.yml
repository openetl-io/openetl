name: release

# A release is a pushed tag: vX.Y.Z, or vX.Y.Z-alpha.N, -beta.N or -rc.N,
# which is a prerelease. The tag's commit must be in main, or in its line's
# branch release-X.Y for a patch, and nightly must have run every suite on it
# and passed: a run titled "nightly (all)", which a scheduled run is and
# `gh workflow run nightly.yml --ref TAG -f suites=all` makes. Then this
# builds the commit with the version in it, pushes the image to
# ghcr.io/OWNER/openetl:VERSION, puts the files on a draft release with
# generated notes, and, in the job that alone may sign, signs the image and
# checksums.txt with keyless cosign and publishes the release.
#
# Dispatched, on any branch or tag, it's a dry run: it builds and checks
# everything for the ref's head, reports the release's checks without failing
# on them, and pushes and publishes nothing. A tag's dry run has the tag's
# version; any other ref's has 0.0.0-dev.
#
# A failed run is run again with "Re-run failed jobs": it replaces the tag's
# draft, and refuses a tag that's released. Actions are pinned by commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read # nightly's runs
      contents: write # only a token that can write sees a draft
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      publish: ${{ steps.resolve.outputs.publish }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: The tag, its commit and the release's checks
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
        run: |
          release='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'
          publish=false
          version=0.0.0-dev
          if [ "$EVENT" = push ]; then
            publish=true
            tag=$GITHUB_REF_NAME
            [[ "$tag" =~ $release ]] || { echo "::error::$tag isn't a release's tag: vX.Y.Z, or vX.Y.Z-alpha.N, -beta.N or -rc.N"; exit 1; }
            version=${tag#v}
          elif [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" =~ $release ]]; then
            tag=$GITHUB_REF_NAME
            version=${tag#v}
          fi
          prerelease=false
          [[ "$version" != *-* ]] || prerelease=true
          { echo "version=$version"; echo "commit=$COMMIT"; echo "publish=$publish"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"
          echo "Version $version, from $COMMIT; prerelease: $prerelease; publish: $publish." >> "$GITHUB_STEP_SUMMARY"

          # A dry run reports what would stop a release, and goes on.
          failed=0
          refuse() {
            if [ "$publish" = true ]; then
              echo "::error::$1"
              failed=1
            else
              echo "::warning::A release of this commit would stop here: $1"
            fi
          }
          # Whether the commit is in branch $1; a branch that doesn't exist has none.
          has() {
            case $(gh api "repos/$GITHUB_REPOSITORY/compare/$1...$COMMIT" --jq .status 2>/dev/null || true) in
              identical | behind) return 0 ;;
              *) return 1 ;;
            esac
          }
          line=release-$(cut -d. -f1-2 <<< "$version")
          has main || has "$line" || refuse "$COMMIT isn't a commit in main or $line"
          passed=$(gh run list -R "$GITHUB_REPOSITORY" -w nightly.yml -c "$COMMIT" -s success -L 100 \
            --json displayTitle -q '[.[] | select(.displayTitle == "nightly (all)")] | length' 2>/dev/null || echo 0)
          [ "$passed" != 0 ] || refuse "nightly hasn't run every suite on $COMMIT and passed. Run it with gh workflow run nightly.yml --ref ${tag:-REF} -f suites=all, and once it passes, re-run this run's failed jobs"
          if [ -n "${tag:-}" ]; then
            draft=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
            [ "$draft" != false ] || refuse "$tag is already released"
          fi
          exit "$failed"

  engine:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { platform: linux_amd64, target: x86_64-unknown-linux-gnu }
          - { platform: linux_arm64, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet cargo-zigbuild==0.24.1 ziglang==0.17.1
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      # Linked against glibc 2.28, so the engine runs on older Linux too.
      - env:
          OPENETL_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: cargo zigbuild --locked --release -p openetl-engine --target "$TARGET.2.28"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/openetl-engine
          if-no-files-found: error
          retention-days: 1

  libs:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2
          key: maven-libs-${{ hashFiles('libs/**/pom.xml') }}
          restore-keys: maven-libs-
      - name: The jars and the wheel
        run: |
          for lib in spark flink; do
            mkdir -p "libs/openetl-$lib/java/src/main/resources/META-INF"
            cp LICENSE NOTICE "libs/openetl-$lib/java/src/main/resources/META-INF/"
          done
          make spark-lib MAVEN_FLAGS="-DskipTests -Drevision=$VERSION"
          make flink-lib MAVEN_FLAGS="-DskipTests -Prelease -Drevision=$VERSION"
          mkdir -p out
          cp "libs/openetl-spark/java/target/openetl-spark-$VERSION.jar" "libs/openetl-flink/java/target/openetl-flink-$VERSION.jar" out/
          sed -i "s/^version = .*/version = \"$VERSION\"/" libs/openetl-spark/python/pyproject.toml
          cp LICENSE NOTICE libs/openetl-spark/python/
          python3 -m pip wheel --no-deps -w out libs/openetl-spark/python
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libs
          path: out/*
          if-no-files-found: error
          retention-days: 1

  # Builds and checks everything, and for a pushed tag pushes the image and
  # puts the files on a draft. It can't sign.
  assemble:
    needs: [prepare, engine, libs]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write # to delete this run's intermediate builds
      contents: write
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    env:
      TAG: ${{ github.ref_name }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          # The tags, for the previous stable release.
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-release-${{ github.job }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-release-${{ github.job }}-
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: engine-*
          path: build/engine
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libs
          path: build/release/assets
      - name: The console and the notices
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          for d in build/engine/engine-*; do
            mv "$d" "build/engine/${d##*/engine-}"
          done
          chmod 755 build/engine/*/openetl-engine
          rustup show active-toolchain || rustup toolchain install
          cargo fetch --locked
          mkdir -p build/release/notices
          go run ./internal/notices -out build/release/notices/THIRD-PARTY-NOTICES.txt
      # The committed files run edge; these run the release.
      - name: The Compose file and the Kubernetes manifest, with the release's image
        run: |
          image=ghcr.io/openetl-io/openetl
          sed "s|$image:edge}|$image:$VERSION}|" deploy/compose/compose.yml > build/release/assets/compose.yml
          grep -q "$image:$VERSION}" build/release/assets/compose.yml
          kube=$(mktemp -d)
          cp -R deploy/kubernetes/. "$kube/"
          sed -i "s|^    newTag: edge\$|    newTag: $VERSION|" "$kube/kustomization.yaml"
          kubectl kustomize "$kube" > build/release/assets/kubernetes.yaml
          grep -q "image: $image:$VERSION\$" build/release/assets/kubernetes.yaml
          ! grep -n ':edge' build/release/assets/compose.yml build/release/assets/kubernetes.yaml
      - name: The binaries, archives, checksums and SBOMs
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean --skip=publish,announce,validate
        env:
          GORELEASER_CURRENT_TAG: v${{ needs.prepare.outputs.version }}
      - name: Each binary says its version, and each archive has what it should
        run: |
          want=$(find web/dist -type f | wc -l)
          for archive in dist/openetl_*.tar.gz; do
            listing=$(tar -tzf "$archive")
            got=$(grep -c '/web/.*[^/]$' <<<"$listing")
            [ "$got" = "$want" ] || { echo "::error::$archive has $got of the console's $want files"; exit 1; }
            grep -q '/web/index.html$' <<<"$listing"
            grep -q '/web/assets/' <<<"$listing"
            modes=$(tar -tvzf "$archive")
            grep -q '^-rw-r--r-- .*/THIRD-PARTY-NOTICES.txt$' <<<"$modes" || { echo "::error::$archive's notices aren't readable by everyone"; exit 1; }
          done
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            archive=dist/openetl-cli_${VERSION}_$platform.tar.gz
            listing=$(tar -tzf "$archive")
            for f in openetl LICENSE NOTICE THIRD-PARTY-NOTICES.txt; do
              grep -q "/$f\$" <<<"$listing" || { echo "::error::$archive has no $f"; exit 1; }
            done
            ! grep -q '/openetld$' <<<"$listing" || { echo "::error::$archive has openetld"; exit 1; }
          done
          binary() { jq -r --arg id "$1" '.[] | select(.type == "Binary" and .extra.ID == $id and .goos == "linux" and .goarch == "amd64") | .path' dist/artifacts.json; }
          test "$("$(binary openetld)" version)" = "$VERSION"
          test "$("$(binary openetl)" version)" = "$VERSION"
          test "$("$(binary openetl-cli)" version)" = "$VERSION"
          test "$(build/engine/linux_amd64/openetl-engine --version)" = "openetl-engine $VERSION"
      - name: The image
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image=ghcr.io/$OWNER/openetl
          binary() { jq -r --arg id "$1" --arg arch "$2" '.[] | select(.type == "Binary" and .extra.ID == $id and .goos == "linux" and .goarch == $arch) | .path' dist/artifacts.json; }
          digests=()
          for arch in amd64 arm64; do
            context=build/image/$arch
            mkdir -p "$context/connectors"
            cp "$(binary openetld "$arch")" "$(binary openetl "$arch")" "build/engine/linux_$arch/openetl-engine" LICENSE NOTICE build/release/notices/THIRD-PARTY-NOTICES.txt "$context/"
            cp -R web/dist "$context/web"
            output=type=cacheonly
            [ "$PUBLISH" != true ] || output="type=image,name=$image,push-by-digest=true,name-canonical=true,push=true"
            docker buildx build --platform "linux/$arch" --provenance=false -f deploy/image/Dockerfile \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$VERSION" --label "org.opencontainers.image.revision=$COMMIT" \
              --label "org.opencontainers.image.licenses=Apache-2.0" \
              --label "org.opencontainers.image.description=OpenETL: openetld, the openetl CLI, the engine and the console" \
              --metadata-file "build/image-$arch.json" --output "$output" "$context"
            [ "$PUBLISH" != true ] || digests+=("$image@$(jq -r '."containerimage.digest"' "build/image-$arch.json")")
          done
          if [ "$PUBLISH" != true ]; then
            echo "Built the image for amd64 and arm64; pushed nothing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create -t "$image:$VERSION" "${digests[@]}"
          digest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          for arch in amd64 arm64; do
            syft "registry:$image:$VERSION" --platform "linux/$arch" -o "spdx-json=build/release/assets/openetl-image_${VERSION}_linux_${arch}.sbom.json"
          done
          { echo "image=$image"; echo "digest=$digest"; } >> "$GITHUB_OUTPUT"
          echo "Image: \`$image:$VERSION@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      # The files first, then the changes since the last release, which
      # GitHub generates; for a stable release, since the last stable one.
      - name: The draft release
        if: needs.prepare.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)" = true ]; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
          fi
          cat > build/notes.md <<EOF
          OpenETL $VERSION, from commit $COMMIT.

          - **Image:** \`$IMAGE:$VERSION\` (\`$IMAGE@$DIGEST\`), for linux/amd64 and linux/arm64. It holds no connectors; it installs them from \`oci://ghcr.io/$GITHUB_REPOSITORY_OWNER/openetl-connectors\`.
          - **openetl_${VERSION}_linux_\*.tar.gz:** \`openetld\`, the \`openetl\` CLI, \`openetl-engine\` and the console, for Linux.
          - **openetl-cli_${VERSION}_\*.tar.gz:** the \`openetl\` CLI alone, for Linux and macOS.
          - **compose.yml** and **kubernetes.yaml:** \`deploy/compose/compose.yml\` and \`deploy/kubernetes\`'s manifests, with this release's image.
          - **openetl-spark and openetl-flink:** the jars for Spark and Flink transforms, and \`openetl_spark\`'s wheel for Python ones.

          \`checksums.txt\` lists every file's SHA-256. It and the image are signed with keyless cosign by this repository's release workflow.
          EOF
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          else
            previous=$({ git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "$TAG"; } | sort -uV | grep -B1 -x "$TAG" | head -1)
            [ "$previous" = "$TAG" ] || flags+=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag "${flags[@]}" \
            --title "$TAG" --notes-file build/notes.md --generate-notes \
            dist/*.tar.gz dist/*.sbom.json dist/checksums.txt build/release/assets/*
          echo "Draft: $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
      # A public repository's artifacts can be downloaded by anyone signed in.
      - name: Delete this run's intermediate builds
        if: always()
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done

  # The only job that can sign, in the release environment.
  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      IMAGE: ${{ needs.assemble.outputs.image }}
      DIGEST: ${{ needs.assemble.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Sign the image and checksums.txt
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          mkdir -p sig
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -D sig
          cosign sign-blob --yes --bundle sig/checksums.txt.sigstore.json sig/checksums.txt
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber sig/checksums.txt.sigstore.json
      - name: Publish the release
        run: |
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
          echo "Released: $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
      - name: Anyone can pull the image
        env:
          REPOSITORY: ${{ github.repository_owner }}/openetl
        run: |
          t=$(curl -s "https://ghcr.io/token?scope=repository:$REPOSITORY:pull&service=ghcr.io" | jq -r '.token // ""')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $t" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/$REPOSITORY/manifests/$VERSION")
          if [ "$code" != 200 ]; then
            echo "::warning::$IMAGE is private: make it public in https://github.com/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/openetl/settings"
            echo "**$IMAGE is private:** make it public in [its settings](https://github.com/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/openetl/settings)." >> "$GITHUB_STEP_SUMMARY"
          fi
