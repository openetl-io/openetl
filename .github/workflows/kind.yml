name: kind

# Flink on the Kubernetes operator, PySpark on Spark on Kubernetes, and
# attempts in pods, in kind: on demand (gh workflow run kind.yml --ref
# <branch>), and nightly from full.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/free-disk.pid"
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: openetl-io/openetl-connectors
          ref: main
          path: openetl-connectors
          ssh-key: ${{ secrets.CONNECTORS_DEPLOY_KEY }}
      # openetl-connectors' branch of this one's name, when it has one, so a
      # change across both repositories is checked whole.
      - name: Connectors of the same branch
        working-directory: openetl-connectors
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git fetch --depth=1 origin "refs/heads/$BRANCH"; then
            git checkout --detach FETCH_HEAD
          else
            echo "openetl-connectors has no branch $BRANCH, so main"
          fi
      - run: rustup show active-toolchain || rustup toolchain install
      # e2e's caches, restored but not saved: it builds the same engine,
      # connectors and test binary, and a third set per branch would push
      # the others out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
          save-if: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-e2e-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-e2e-
            go-go-
      - uses: actions/cache/restore@v6
        with:
          path: ~/.m2
          key: maven-e2e-${{ hashFiles('libs/**/pom.xml') }}
          restore-keys: maven-e2e-
      - name: Start Postgres, S3 and kind
        run: |
          tail --pid="$(cat "$RUNNER_TEMP/free-disk.pid")" -f /dev/null
          curl -fsSLo "$RUNNER_TEMP/kind" https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          sudo install "$RUNNER_TEMP/kind" /usr/local/bin/kind
          (set +e; make deps-up DEPS="postgres s3" && make kind-up; echo $? > "$RUNNER_TEMP/deps.status") > "$RUNNER_TEMP/deps.log" 2>&1 &
      - name: Build the engine, the connectors, openetl-flink and openetld's image
        run: |
          make connectors CONNECTORS_SRC=openetl-connectors
          make flink-lib MAVEN_FLAGS=-DskipTests
          cargo build -p openetl-engine
          make image CONNECTORS_SRC=openetl-connectors IMAGE=openetl:e2e
      - name: Wait for the services
        timeout-minutes: 15
        run: |
          until [ -f "$RUNNER_TEMP/deps.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/deps.log"
          exit "$(cat "$RUNNER_TEMP/deps.status")"
      - name: Load openetld's image into kind
        run: make kind-load IMAGE=openetl:e2e
      # Pods reach the host at the kind network's gateway.
      - name: Flink on the operator, with JobManager and runner kills; PySpark after and inside a sync; attempts in pods
        run: |
          host=$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Gateway}} {{end}}' | tr ' ' '\n' | grep -m1 '\.')
          make e2e-kube CONNECTORS_SRC=openetl-connectors KIND_HOST="$host" KIND_IMAGE=openetl:e2e
      - name: The operator's and Flink's logs
        if: failure()
        run: |
          k() { kubectl --kubeconfig .openetl/kind/kubeconfig "$@"; }
          k -n flink-operator logs deploy/flink-kubernetes-operator --tail 300
          k -n openetl get flinkdeployments,pods -o wide --show-labels
          k -n openetl get events --sort-by=.lastTimestamp | tail -50
          for p in $(k -n openetl get pods -o name); do k -n openetl logs "$p" --tail 100; done
