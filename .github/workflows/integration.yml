name: integration

# On demand (gh workflow run integration.yml --ref <branch>), and from full.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ github.job }}-
      - name: Start Postgres, S3, GCS, Azure, Flink and a registry
        run: make deps-up DEPS="postgres temporal s3 gcs azure flink-jobmanager flink-taskmanager oci-registry"
      - name: Integration tests
        run: make test-integration
