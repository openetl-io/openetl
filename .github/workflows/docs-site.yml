name: docs-site

# Has the docs site, OWNER/docs-web, build again when what it reads from this
# repository changes where it reads it: docs/, the OpenAPI document and the
# JSON Schemas, on main and on a release line's branch, release-X.Y. The
# release workflow calls it once a release is published, for the site to show
# it.
#
# It sends docs-web a repository_dispatch of type docs, which needs the secret
# DOCS_SITE_TOKEN: a fine-grained token with Contents: write on docs-web.
# Without it, this does nothing, and the site's nightly build picks the change
# up.
on:
  push:
    branches: [main, "release-[0-9]+.[0-9]+"]
    paths:
      - "docs/**"
      - "internal/api/openapi.yaml"
      - "internal/spec/connector.schema.json"
      - "internal/connectorpkg/openetl-connector.schema.json"
      - "internal/declarative/manifest.schema.json"
      - "internal/events/event.schema.json"
      - ".github/workflows/docs-site.yml"
  workflow_call:
    secrets:
      DOCS_SITE_TOKEN:
        required: false

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Have docs-web build the site
        env:
          GH_TOKEN: ${{ secrets.DOCS_SITE_TOKEN }}
          SITE: ${{ github.repository_owner }}/docs-web
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No DOCS_SITE_TOKEN: the docs site picks this up in its nightly build"
            exit 0
          fi
          gh api "repos/$SITE/dispatches" -f event_type=docs
