# The connector and engine protocols: Go messages and gRPC stubs. The
# connector protocol lands in sdk/go/protocol/v1 (its go_package), so the SDK
# carries it. The engine's Rust code is generated by crates/proto at build time.
version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/unsuitable001/openetl
  - local: protoc-gen-go-grpc
    out: .
    opt: module=github.com/unsuitable001/openetl
inputs:
  - directory: proto
    paths:
      - proto/openetl/connector
      - proto/openetl/engine
