version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/unsuitable001/openetl
  - local: protoc-gen-go-grpc
    out: .
    opt: module=github.com/unsuitable001/openetl
inputs:
  - directory: proto
    paths:
      - proto/openetl/connector
      - proto/openetl/engine
      - proto/openetl/bridge
