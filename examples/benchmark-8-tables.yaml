# The documents of the benchmark in docs/self-host/benchmarks.md that copies
# 8 tables derived from TPC-H at scale factors 10 and 50 from Postgres into
# Iceberg tables in AWS Glue, as its first run at each scale factor applied
# them. Replace BUCKET with the name of your bucket, and store the source's URL
# as the secret tpch-dsn.
#
# The page's steps apply each pipeline twice: first with the seed source
# (tpch-sf10-seed or tpch-sf50-seed), which creates the tables, then as it is
# here, which the timed sync reads.
apiVersion: openetl.io/v1alpha1
kind: Source
metadata:
  name: tpch-sf10
spec:
  connector: postgres@0.2.0-alpha
  config:
    dsn: { secret: tpch-dsn }
    schema: tpch_sf10
    maxConnections: 8
---
apiVersion: openetl.io/v1alpha1
kind: Source
metadata:
  name: tpch-sf10-seed
spec:
  connector: postgres@0.2.0-alpha
  config:
    dsn: { secret: tpch-dsn }
    schema: tpch_sf10_seed
    maxConnections: 8
---
apiVersion: openetl.io/v1alpha1
kind: Source
metadata:
  name: tpch-sf50
spec:
  connector: postgres@0.2.0-alpha
  config:
    dsn: { secret: tpch-dsn }
    schema: tpch_sf50
    maxConnections: 8
---
apiVersion: openetl.io/v1alpha1
kind: Source
metadata:
  name: tpch-sf50-seed
spec:
  connector: postgres@0.2.0-alpha
  config:
    dsn: { secret: tpch-dsn }
    schema: tpch_sf50_seed
    maxConnections: 8
---
apiVersion: openetl.io/v1alpha1
kind: Destination
metadata:
  name: glue-lake
spec:
  connector: iceberg@0.2.0-alpha
  config:
    catalog: glue
    region: ap-southeast-2
    warehouse: s3://BUCKET/iceberg
    namespace: oetl_tpc_h_cal1
---
apiVersion: openetl.io/v1alpha1
kind: Pipeline
metadata:
  name: tpch-r1
spec:
  schedule: { cron: "0 0 1 1 *" }
  resources:
    size: { cpu: 2, memory: 2560Mi }
  delivery:
    commit: { scope: stream }
  source:
    ref: tpch-sf10
  destination:
    ref: glue-lake
    namespace: oetl_tpc_h_r1
---
apiVersion: openetl.io/v1alpha1
kind: Pipeline
metadata:
  name: tpch-sf50
spec:
  schedule: { cron: "0 0 1 1 *" }
  resources:
    size: { cpu: 2, memory: 2560Mi }
  delivery:
    commit: { scope: stream }
  source:
    ref: tpch-sf50
  destination:
    ref: glue-lake
    namespace: oetl_tpc_h_sf50
