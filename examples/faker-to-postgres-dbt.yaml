# faker-to-postgres, with a dbt project that runs after every sync. With
# `make deps-up`, and `make dev` running on a machine with dbt-core and
# dbt-postgres (or with --dbt pointing at them), and the local-postgres-dsn
# secret set as faker-to-postgres.yaml shows:
#
#   go run ./cmd/openetl apply -f examples/faker-to-postgres-dbt.yaml
#
# The table lands in faker_marts.spend_per_user.
apiVersion: openetl.dev/v1alpha1
kind: DbtProject
metadata:
  name: faker-dbt
spec:
  # openetl apply sends this directory's files.
  path: dbt
---
apiVersion: openetl.dev/v1alpha1
kind: Source
metadata:
  name: faker
spec:
  connector: faker
  config:
    seed: 42
    count: 1000
    batchSize: 100
---
apiVersion: openetl.dev/v1alpha1
kind: Destination
metadata:
  name: local-postgres
spec:
  connector: postgres
  config:
    dsn: { secret: local-postgres-dsn }
---
apiVersion: openetl.dev/v1alpha1
kind: Pipeline
metadata:
  name: faker-to-postgres-dbt
spec:
  schedule: { every: 1h }
  source: { ref: faker }
  destination:
    ref: local-postgres
    namespace: faker
  postSync:
    - dbt: { project: faker-dbt, schema: faker_marts }
