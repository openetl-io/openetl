# Generated rows into the compose Postgres, every hour. With `make deps-up`
# and `make dev` running:
#
#   go run ./cmd/openetl apply -f examples/faker-to-postgres.yaml
apiVersion: openetl.dev/v1alpha1
kind: Source
metadata:
  name: faker
spec:
  connector: faker
  config:
    seed: 42
    count: 1000
    batchSize: 100
---
apiVersion: openetl.dev/v1alpha1
kind: Destination
metadata:
  name: local-postgres
spec:
  connector: postgres
  config:
    dsn: postgres://openetl:openetl@localhost:5432/openetl
---
apiVersion: openetl.dev/v1alpha1
kind: Pipeline
metadata:
  name: faker-to-postgres
spec:
  schedule: { every: 1h }
  source: { ref: faker }
  destination:
    ref: local-postgres
    namespace: faker
