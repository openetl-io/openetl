# cargo deny check, for the engine's dependencies.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
# Each of these says a crate is unmaintained, with no release to move to.
# Arrow, DataFusion, Parquet and object_store need them, so they stay until
# those crates move off them.
ignore = [
  { id = "RUSTSEC-2026-0542", reason = "humantime: object_store depends on it" },
  { id = "RUSTSEC-2026-0543", reason = "chrono: Arrow and DataFusion keep times with it" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz: Arrow reads time zones with it" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
