syntax = "proto3";

package openetl.api.v1;

import "google/api/annotations.proto";
import "openetl/api/v1/pipeline.proto";

option go_package = "github.com/unsuitable001/openetl/gen/openetl/api/v1;apiv1";

service ApplyService {
  // Stores each definition as an immutable version; unchanged definitions
  // keep theirs. A pipeline's version pins the versions of its source and
  // destination and its dbt projects' bundles. Either every document applies
  // or none does.
  rpc Apply(ApplyRequest) returns (ApplyResponse) {
    option (google.api.http) = {
      post: "/v1/{workspace=workspaces/*}:apply"
      body: "*"
    };
  }
}

message ApplyRequest {
  // workspaces/{workspace}, for documents that don't name one.
  string workspace = 1;
  repeated Document documents = 2;
  bool validate_only = 3;
  // What's applying, such as "cli", for connector versions' provenance.
  // Empty: "api".
  string client = 4;
}

// Document is a YAML or JSON definition with apiVersion, kind, metadata and
// spec.
message Document {
  // Such as a file name, for error messages.
  string origin = 1;
  bytes content = 2;
}

message ApplyResponse {
  // One per document, in order.
  repeated AppliedResource resources = 1;
  // Pipelines the documents don't define, which have a new version because
  // a source, destination or dbt project they use changed.
  repeated AppliedResource dependents = 2;
  // One per pipeline in resources, then one per dependent.
  repeated PipelinePlan plans = 3;
}

// PipelinePlan is how a pipeline version would sync, as far as the control
// plane can tell from the source's latest catalog and the destination's
// capabilities.
message PipelinePlan {
  // workspaces/{workspace}/pipelines/{pipeline}
  string pipeline = 1;
  string version = 2;
  // What differs from the version that was current; empty for a new
  // pipeline.
  repeated PlanChange changes = 3;
  repeated StreamPlan streams = 4;
  // What a sync would fail on. Apply refuses to create or change a pipeline
  // whose plan has any.
  repeated string problems = 5;
  // What the plan couldn't check, and why.
  repeated string notes = 6;
}

message PlanChange {
  // A spec field, such as delivery.require or source.streams[orders].cursor,
  // or what the version pins: source.version, destination.version,
  // source.connector, destination.connector or dbt.{project}.
  string field = 1;
  // As JSON; empty where the field is unset.
  string before = 2;
  string after = 3;
}

message StreamPlan {
  string name = 1;
  DeliveryLevel level = 2;
  // Deduped on _openetl_id at apply.
  bool dedupe = 3;
  // What sets the level.
  string reason = 4;
}

message AppliedResource {
  string kind = 1;
  string name = 2;
  ApplyAction action = 3;
  string version = 4;
}

enum ApplyAction {
  APPLY_ACTION_UNSPECIFIED = 0;
  APPLY_ACTION_CREATED = 1;
  APPLY_ACTION_UPDATED = 2;
  APPLY_ACTION_UNCHANGED = 3;
}
