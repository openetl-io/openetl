syntax = "proto3";

package openetl.api.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/unsuitable001/openetl/gen/openetl/api/v1;apiv1";

// SecretService stores the secrets that sources' and destinations' configs
// name, as {"secret": "NAME"}, in their workspace. A secret holds a value,
// encrypted at rest, or a reference to a cloud secret store, which runners
// read with their own cloud identity. The API never returns values.
service SecretService {
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/secrets/*}"};
  }
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/secrets"};
  }
  // Sets a secret's value or reference. The next sync, check or discover
  // that uses it gets the new value.
  rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse) {
    option (google.api.http) = {
      patch: "/v1/{secret.name=workspaces/*/secrets/*}"
      body: "secret"
    };
  }
  // Fails with FAILED_PRECONDITION while a source or destination names it.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (google.api.http) = {delete: "/v1/{name=workspaces/*/secrets/*}"};
  }
}

message Secret {
  // workspaces/{workspace}/secrets/{secret}
  string name = 1;
  // Input only: at most 64 KiB of UTF-8. Set this or ref.
  string value = 2;
  // On input, if set, it must match.
  string etag = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp update_time = 5;
  // Output only: the sources and destinations whose configs name it.
  repeated string used_by = 6;
  // Where runners read the value, instead of a value stored here:
  //   aws-sm://{name or ARN}[?region=…][&version=…][&stage=…][&field=…]
  //   gcp-sm://projects/{p}/[locations/{l}/]secrets/{s}[/versions/{v}][?field=…]
  //   azure-kv://{vault}/{name}[?version=…][&field=…]
  // field picks a top-level field of a JSON object value. Runners read it
  // for each attempt, check and discover.
  string ref = 7;
}

message GetSecretRequest {
  string name = 1;
}

message GetSecretResponse {
  Secret secret = 1;
}

message ListSecretsRequest {
  // workspaces/{workspace}
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSecretsResponse {
  repeated Secret secrets = 1;
  string next_page_token = 2;
}

message UpdateSecretRequest {
  Secret secret = 1;
  // Create the secret if it doesn't exist.
  bool allow_missing = 2;
}

message UpdateSecretResponse {
  Secret secret = 1;
  // The secret didn't exist.
  bool created = 2;
}

message DeleteSecretRequest {
  string name = 1;
  // If set, it must match.
  string etag = 2;
}

message DeleteSecretResponse {}
