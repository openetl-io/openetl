syntax = "proto3";

package openetl.api.v1;

import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "openetl/api/v1/connection.proto";
import "openetl/api/v1/sync.proto";

option go_package = "github.com/openetl-io/openetl/gen/openetl/api/v1;apiv1";

// PipelineService reads and deletes pipelines. ApplyService creates and
// changes them.
service PipelineService {
  rpc GetPipeline(GetPipelineRequest) returns (GetPipelineResponse) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/pipelines/*}"};
  }
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/pipelines"};
  }
  rpc DeletePipeline(DeletePipelineRequest) returns (DeletePipelineResponse) {
    option (google.api.http) = {delete: "/v1/{name=workspaces/*/pipelines/*}"};
  }
  // Stops scheduled syncs. A sync that is running carries on. With a
  // stream, only that stream stops: syncs skip it and keep its state for
  // when it's resumed, and a continuous pipeline's run restarts at a
  // checkpoint without it. Fails with FAILED_PRECONDITION for a stream that
  // can't stop on its own: one read with cdc, which shares the source's
  // change log with the pipeline's other cdc streams; a transform's input;
  // or the last stream that isn't paused.
  rpc PausePipeline(PausePipelineRequest) returns (PausePipelineResponse) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*/pipelines/*}:pause"
      body: "*"
    };
  }
  rpc ResumePipeline(ResumePipelineRequest) returns (ResumePipelineResponse) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*/pipelines/*}:resume"
      body: "*"
    };
  }
  // Removes one of heal's overrides, which gives the spec back its say in
  // that field.
  rpc RemovePipelineOverride(RemovePipelineOverrideRequest) returns (RemovePipelineOverrideResponse) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*/pipelines/*}:removeOverride"
      body: "*"
    };
  }
  // Sets the size of the pipeline's jobs until its next version, or gives
  // the spec back its say. A running job stops at a checkpoint and starts
  // again at the new size.
  rpc RescalePipeline(RescalePipelineRequest) returns (RescalePipelineResponse) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*/pipelines/*}:rescale"
      body: "*"
    };
  }
  // Reads streams again from the start: the next sync, or a continuous
  // pipeline's next run, drops their positions and reads them as it would a
  // new stream's, such as a new replication slot and a snapshot. What
  // reaches the destination already stays: merge updates rows in place, and
  // append adds them again. A continuous pipeline's run restarts at a
  // checkpoint to take it. Fails with FAILED_PRECONDITION for a pipeline
  // with a Flink transform, whose state Flink keeps.
  rpc ResetPipeline(ResetPipelineRequest) returns (ResetPipelineResponse) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*/pipelines/*}:reset"
      body: "*"
    };
  }
  // Lets the next sync or run restart from the checkpoint before the latest
  // one if the latest can't be read. Its epoch was delivered, so it's
  // delivered again: streams the destination neither merges nor dedupes get
  // its rows twice. Without this, a restart happens by itself only where it
  // can't lower a stream's guarantee, under heal mode auto or auto_safe.
  rpc RewindPipeline(RewindPipelineRequest) returns (RewindPipelineResponse) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*/pipelines/*}:rewind"
      body: "*"
    };
  }
  // Starts a sync now. Fails with FAILED_PRECONDITION if the pipeline is
  // paused or a sync is running.
  rpc SyncPipeline(SyncPipelineRequest) returns (SyncPipelineResponse) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*/pipelines/*}:sync"
      body: "*"
    };
  }
  // Newest first.
  rpc ListPipelineVersions(ListPipelineVersionsRequest) returns (ListPipelineVersionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*/pipelines/*}/versions"};
  }
  rpc GetPipelineVersion(GetPipelineVersionRequest) returns (GetPipelineVersionResponse) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/pipelines/*/versions/*}"};
  }
  // How the current version syncs, from the source's latest catalog: each
  // stream's delivery level and what sets it. The plan has no changes.
  rpc GetPipelinePlan(GetPipelinePlanRequest) returns (GetPipelinePlanResponse) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/pipelines/*}/plan"};
  }
  // Each stream's schema history, by stream, then version.
  rpc ListStreamSchemas(ListStreamSchemasRequest) returns (ListStreamSchemasResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*/pipelines/*}/streamSchemas"};
  }
  // The checkpoints the pipeline's syncs committed, newest first. The
  // control plane keeps 30 days of them.
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*/pipelines/*}/checkpoints"};
  }
  // The columns and cells the pipeline holds back, as its last
  // checkpoint left them.
  rpc ListHolds(ListHoldsRequest) returns (ListHoldsResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*/pipelines/*}/holds"};
  }
  // Releases a hold: its held values are patched in, and a column held
  // whole is delivered again from the next run. A continuous pipeline's run
  // restarts at a checkpoint to take it.
  rpc ReleaseHold(ReleaseHoldRequest) returns (ReleaseHoldResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*/pipelines/*}/holds:release"
      body: "*"
    };
  }
  // Discards a hold: its held values are dropped, and a column held whole
  // stays as the destination has it.
  rpc DiscardHold(DiscardHoldRequest) returns (DiscardHoldResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=workspaces/*/pipelines/*}/holds:discard"
      body: "*"
    };
  }
}

// PipelineVersion is a pipeline's spec with what it pins. Syncs run exactly
// that. Versions are content-addressed, so going back to an earlier spec
// makes its version current again.
message PipelineVersion {
  // workspaces/{workspace}/pipelines/{pipeline}/versions/{version}
  string name = 1;
  PipelineSpec spec = 2;
  PinnedConfig source = 3;
  PinnedConfig destination = 4;
  // Each dbt project's bundle digest, by project name.
  map<string, string> dbt = 5;
  // Each Spark cluster's version, by cluster name.
  map<string, string> spark_clusters = 10;
  // Each Flink cluster's version, by cluster name.
  map<string, string> flink_clusters = 11;
  string data_plane = 6;
  // Where it came from, such as cli:shop.yaml#3.
  string provenance = 7;
  // When it was first made.
  google.protobuf.Timestamp create_time = 8;
  // It's the pipeline's current version.
  bool current = 9;
  // What planning its transform.sql gave when it was made; unset without
  // transform.sql, or if it couldn't be planned then.
  SqlPlan sql_plan = 12;
}

// SqlPlan is what a pipeline version keeps of planning its transform.sql.
// Every attempt plans the statements again, and checks what it gets against
// this.
message SqlPlan {
  // Each statement's output, in the order of the statements.
  repeated SqlOutput outputs = 1;
  // The stateful operators' IDs, in the order of their statements.
  repeated string operators = 2;
}

message SqlOutput {
  string name = 1;
  repeated SchemaColumn columns = 2;
  // Empty: it has none, and can only be appended.
  repeated string primary_key = 3;
  // An Arrow IPC stream holding only the schema: the statement's columns,
  // with logical types.
  bytes arrow_schema = 4;
}

// PinnedConfig is a version of a source's or destination's config.
message PinnedConfig {
  // workspaces/{workspace}/sources/{source} or …/destinations/{destination};
  // empty if it has been deleted since.
  string name = 1;
  // The source's or destination's version.
  string version = 2;
  // Unset if it has been deleted since.
  ConnectorConfig spec = 3;
  // The connector version's digest; empty for a built-in connector, or if
  // it has been deleted since.
  string connector = 4;
}

message Pipeline {
  // workspaces/{workspace}/pipelines/{pipeline}
  string name = 1;
  PipelineSpec spec = 2;
  string version = 3;
  string etag = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp update_time = 6;
  // Set by PausePipeline and ResumePipeline, not by the spec.
  bool paused = 7;
  PipelineStatus status = 8;
  // Streams paused on their own, by PausePipeline or by heal. Syncs skip
  // them, and keep their state for when they're resumed.
  repeated PausedStream paused_streams = 9;
  // What heal changed in how the pipeline runs, over its spec.
  repeated PipelineOverride overrides = 10;
}

message PausedStream {
  string stream = 1;
  // Why it was paused.
  string reason = 2;
  // The incident whose playbook paused it; empty if a person did.
  string incident = 3;
  google.protobuf.Timestamp create_time = 4;
}

// PipelineOverride is a value heal set for a field of the pipeline's spec,
// which syncs use in place of the spec's. It lasts until
// RemovePipelineOverride removes it, or a version changes what it
// overrides.
message PipelineOverride {
  // schedule.every: how often syncs start, which heal widens when a
  // source keeps limiting a pipeline's requests. source.rate_limit_scale:
  // what a declarative source's declared rate limits are multiplied by.
  string field = 1;
  // As JSON, as PlanChange's are.
  string value = 2;
  // What the spec has, as JSON; empty where it's unset.
  string spec_value = 3;
  // Why heal set it.
  string reason = 4;
  // The incident whose playbook set it.
  string incident = 5;
  // When it last changed.
  google.protobuf.Timestamp update_time = 6;
}

// PipelineStatus is what the pipeline's syncs did.
message PipelineStatus {
  // The latest sync; unset if none has run.
  Sync last_sync = 1;
  // When the latest sync that succeeded ended; unset if none has.
  google.protobuf.Timestamp last_success_time = 2;
  // Incidents open on it.
  int32 open_incidents = 3;
  // How the control plane scales its jobs; unset if nothing has.
  JobScaling scaling = 4;
}

// JobScaling is what rescaled a pipeline's jobs, besides its spec.
message JobScaling {
  // Set by RescalePipeline for the current version.
  JobSize size = 1;
  // The job loop's lanes for a continuous pipeline; 0 if it hasn't chosen.
  uint32 lanes = 2;
  // When either last changed.
  google.protobuf.Timestamp rescale_time = 3;
  // Why the job loop isn't rescaling it: destination_bound when its lanes
  // mostly wait for the destination, which more lanes won't help.
  string note = 4;
}

// PipelineSpec is the spec of a Pipeline document. Unset fields take their
// defaults.
message PipelineSpec {
  // Unset: scheduled.
  PipelineMode mode = 1;
  // When a scheduled pipeline's syncs start. A continuous one has none.
  Schedule schedule = 2;
  // The data plane whose runners run its jobs. Unset: the server's.
  string data_plane = 3;
  PipelineSource source = 4;
  PipelineDestination destination = 5;
  // What a change to a stream's schema does once the destination has the
  // stream. Unset: allow_all.
  SchemaPolicy schema_policy = 6;
  Delivery delivery = 7;
  Types types = 8;
  // Run in order after a sync's data is committed. A step that fails fails
  // the sync, and the steps after it don't run.
  repeated PostSyncStep post_sync = 9;
  Heal heal = 10;
  // The user's code between the source and the destination: Spark in a
  // scheduled pipeline, Flink in a continuous one.
  Transform transform = 11;
  SparkAccess spark_access = 12;
  FlinkAccess flink_access = 13;
  // Unset: sized automatically, in the default pool.
  JobResources resources = 14;
}

// JobResources sizes the pipeline's jobs.
message JobResources {
  // Unset: auto, from the connectors' hints and then the job's measured peaks.
  JobSize size = 1;
  // What auto stays at or above.
  JobSize min = 2;
  // What a job may grow to: auto's choice, and a retry after running out of
  // memory. Unset: xl for auto, and size itself otherwise.
  JobSize max = 3;
  // Scheduled only, with an automatic size: as many lanes as the last
  // sync's bytes need, at each lane's measured rate, to finish within it.
  google.protobuf.Duration finish_within = 4;
  // The runners that run its jobs. Unset: default.
  string pool = 5;
  // How many pods each attempt runs on, as workers that a coordinator in a
  // pod of its own leads, each of the job's size; 0 or 1: one pod. A pool's
  // pod launcher starts them, all or none. A job that can't run on workers
  // runs on one pod, and the plan says why.
  uint32 workers = 6;
}

// SparkAccess is how the pipeline's Spark applications reach its _spark/
// prefix of the data plane's store. Unset: with the cluster's own identity,
// which reaches every pipeline's.
message SparkAccess {
  // On EMR: the runtime role each step runs as (ExecutionRoleArn, EMR 6.7
  // and later). It's all the step's AWS access, the user's own data's too.
  string emr_role = 1;
  // Elsewhere: S3A keys for the data plane's bucket alone: accessKeyId, a
  // value or a secret reference, {"secret": NAME}, and secretAccessKey, a
  // secret reference.
  google.protobuf.Struct keys = 2;
}

// FlinkAccess is how the pipeline's Flink job reaches its _flink/ prefix of
// the data plane's store, where its code, checkpoints and savepoints are.
// Unset: with the cluster's own identity.
message FlinkAccess {
  // On EMR: the runtime role each step runs as (ExecutionRoleArn).
  string emr_role = 1;
  // Elsewhere: S3 keys for the data plane's bucket alone, for Flink's
  // Hadoop S3 filesystem: accessKeyId, a value or a secret reference,
  // {"secret": NAME}, and secretAccessKey, a secret reference. A session
  // cluster reads its filesystems' settings at start, so it can't take them.
  google.protobuf.Struct keys = 2;
}

message Transform {
  oneof engine {
    SparkTransform spark = 1;
    FlinkTransform flink = 2;
    SqlTransform sql = 3;
  }
}

// SqlTransform is SQL the engine runs between the source and the
// destination, in a scheduled or a continuous pipeline. Its statements read
// the source's streams and write outputs, which are the destination's
// streams. A stream no statement writes passes through, unless passthrough
// is none.
message SqlTransform {
  // INSERT INTO output SELECT … and CREATE VIEW statements. The text itself:
  // a file the spec names is read by the CLI, which sends its text here.
  string sql = 1;
  Passthrough passthrough = 2;
}

// Which streams that no statement writes reach the destination.
enum Passthrough {
  // All of them.
  PASSTHROUGH_UNSPECIFIED = 0;
  // All of them, as a stream without a transform does.
  PASSTHROUGH_ALL = 1;
  // None: only what statements write.
  PASSTHROUGH_NONE = 2;
}

// SparkTransform runs the user's openetl-spark Transform on each epoch of a
// sync, on a Spark cluster. Its outputs are the destination's streams.
message SparkTransform {
  // A SparkCluster in the same workspace.
  string cluster = 1;
  // A jar's class is the Transform's; a Python file calls openetl_spark.run.
  SparkCode code = 2;
  // Spark properties for the application, over the cluster's.
  map<string, string> conf = 3;
  // Unset: each input stream, under its name and with its settings.
  repeated TransformOutput outputs = 4;
}

// FlinkTransform runs the user's Flink job, built with openetl-flink, between
// a continuous pipeline's source and destination, on a Flink cluster. Its
// checkpoints are the pipeline's.
message FlinkTransform {
  // A FlinkCluster in the same workspace.
  string cluster = 1;
  FlinkCode code = 2;
  // The job's parallelism. Unset: the cluster's default.
  int32 parallelism = 3;
  // Flink configuration for the job, over the cluster's.
  map<string, string> conf = 4;
  // Unset: each input stream, under its name and with its settings.
  repeated TransformOutput outputs = 5;
}

// FlinkCode is a jar, pinned by its digest. The runner checks it and gives
// the cluster its own copy.
message FlinkCode {
  // An s3://, s3a:// or https:// URI the runner can read.
  string jar = 1;
  // The file's SHA-256, in hex.
  string sha256 = 2;
  // The job's main class. Unset: the jar's manifest names it.
  string main_class = 3;
}

// TransformOutput is one of a transform's outputs. Unset settings take those
// of the input stream with its name, if there is one.
message TransformOutput {
  string name = 1;
  repeated string primary_key = 2;
  WriteMode write = 3;
  DeliveryLevel require = 4;
}

// What heal's playbooks may do about the pipeline's incidents.
message Heal {
  HealMode mode = 1;
}

enum HealMode {
  HEAL_MODE_UNSPECIFIED = 0;
  // Open incidents and notify; take no action.
  HEAL_MODE_OFF = 1;
  // Propose actions that hold data back, such as pausing the pipeline,
  // rather than taking them.
  HEAL_MODE_SUGGEST = 2;
  // Apply every playbook's actions. The default.
  HEAL_MODE_AUTO_SAFE = 3;
  // The same as auto_safe.
  HEAL_MODE_AUTO = 4;
}

message PostSyncStep {
  oneof step {
    DbtStep dbt = 1;
    SparkStep spark = 2;
  }
}

// DbtStep runs a dbt project against the pipeline's destination.
message DbtStep {
  // A DbtProject in the same workspace. A sync runs the bundle that was
  // current when it started.
  string project = 1;
  DbtCommand command = 2;
  // dbt's --select and --exclude.
  string select = 3;
  string exclude = 4;
  // The target schema. Unset: the schema the pipeline writes to.
  string schema = 5;
}

// SparkStep runs the user's own Spark application on a Spark cluster.
message SparkStep {
  // A SparkCluster in the same workspace. A sync runs the settings that were
  // current when it started.
  string cluster = 1;
  SparkCode code = 2;
  // The application's arguments.
  repeated string args = 3;
  // Spark properties for this application, over the cluster's.
  map<string, string> conf = 4;
}

// SparkCode is a jar or a Python file, pinned by its digest. The runner checks
// it and gives the cluster its own copy.
message SparkCode {
  // An s3://, s3a:// or https:// URI the runner can read.
  oneof file {
    string jar = 1;
    string python = 2;
  }
  // The file's SHA-256, in hex.
  string sha256 = 3;
  // A jar's main class. Unset: the jar's manifest names it.
  string main_class = 4;
}

enum DbtCommand {
  DBT_COMMAND_UNSPECIFIED = 0;
  // The default.
  DBT_COMMAND_BUILD = 1;
  DBT_COMMAND_RUN = 2;
  DBT_COMMAND_TEST = 3;
}

// How values map to logical types where a pipeline has a choice.
message Types {
  Infinity infinity = 1;
}

// What becomes of infinite dates and timestamps.
enum Infinity {
  INFINITY_UNSPECIFIED = 0;
  // To the type's largest or smallest value. The default.
  INFINITY_CLAMP = 1;
  INFINITY_QUARANTINE = 2;
}

enum PipelineMode {
  PIPELINE_MODE_UNSPECIFIED = 0;
  // Copies in syncs, which start on its schedule.
  PIPELINE_MODE_SCHEDULED = 1;
  // Runs one job that keeps reading, and commits as it goes.
  PIPELINE_MODE_CONTINUOUS = 2;
}

message Schedule {
  oneof trigger {
    // Starts a sync this often, counting from the Unix epoch: 1h starts one
    // on the hour.
    google.protobuf.Duration every = 1;
    // In UTC, unless it starts with CRON_TZ= and a time zone, as in
    // CRON_TZ=Europe/Berlin 0 6 * * *.
    string cron = 2;
  }
  // A random start delay of up to this much.
  google.protobuf.Duration jitter = 3;
}

message PipelineSource {
  // A Source ID in the same workspace.
  string ref = 1;
  repeated PipelineStream streams = 2;
}

message PipelineStream {
  // As the source's catalog names it.
  string name = 1;
  // Unset: the first way the source declares it reads the stream, or in a
  // continuous pipeline the first of those that's cdc or stream.
  SyncMode sync = 2;
  // The column an incremental read goes by. Unset: the source's cursor for
  // the stream, if it names one.
  string cursor = 3;
  // By source column name.
  map<string, PipelineColumn> columns = 4;
  TimestampUnit timestamps = 5;
  // Overrides delivery.require for this stream.
  DeliveryLevel require = 6;
  // Rows with the same content become one row. Only for streams without a
  // primary key. Unset: true for a superset stream whose require is above
  // at least once, otherwise false.
  optional bool collapse = 7;
  // What a value that doesn't fit its type holds back: its row,
  // the default, or only its cell, for a keyed stream into a destination
  // that patches.
  QuarantineScope quarantine = 8;
  // What a held cell shows, for columns the columns map doesn't say.
  Held held = 9;
  // Columns held together, by source name: holding one holds the rest.
  repeated ColumnGroup groups = 10;
  // Overrides destination.type_changes for this stream.
  TypeChanges type_changes = 11;
  // The column that holds a row's event time, for a SQL transform. Unset:
  // a row's time is when the engine read it.
  string event_time = 12;
  // How far event time may run behind before a window closes. Only with
  // event_time.
  Watermark watermark = 13;
}

// Watermark says how late a stream's rows may arrive in event time.
message Watermark {
  // The watermark trails the latest event time seen by this much. Unset:
  // zero.
  google.protobuf.Duration delay = 1;
}

// Whether a destination changes a column's type itself when the stream's
// widens.
enum TypeChanges {
  // Refuse, unless destination.type_changes says otherwise.
  TYPE_CHANGES_UNSPECIFIED = 0;
  // The destination refuses, and the column is held or the stream stops
  // until a person changes the column. The default.
  TYPE_CHANGES_REFUSE = 1;
  // The destination changes the column's type in place, which on a
  // database can rewrite the table under a lock.
  TYPE_CHANGES_ALLOW = 2;
}

enum QuarantineScope {
  QUARANTINE_SCOPE_UNSPECIFIED = 0;
  // The default.
  QUARANTINE_SCOPE_ROW = 1;
  // For a keyed stream into a destination that patches its write mode.
  QUARANTINE_SCOPE_CELL = 2;
}

message Held {
  HeldMode mode = 1;
  // For value, and for last's rows the destination doesn't have: a value
  // of the column's delivered type, as JSON. Empty: null.
  string value = 2;
}

enum HeldMode {
  // null, or value if a value is given.
  HELD_MODE_UNSPECIFIED = 0;
  HELD_MODE_NULL = 1;
  HELD_MODE_VALUE = 2;
  // The destination keeps its value. Merge only.
  HELD_MODE_LAST = 3;
}

message ColumnGroup {
  repeated string columns = 1;
}

// The unit timestamps arrive in. Nanoseconds need a destination that
// keeps them, and hold only 1677-09-21 to 2262-04-11.
enum TimestampUnit {
  TIMESTAMP_UNIT_UNSPECIFIED = 0;
  // The default. Finer values are truncated.
  TIMESTAMP_UNIT_MICROSECOND = 1;
  TIMESTAMP_UNIT_NANOSECOND = 2;
}

message PipelineColumn {
  reserved 1;
  reserved "op";

  // Only for columns the source declares as decimals.
  ColumnType type = 2;
  // What the column's held cells show; unset: the stream's held.
  Held held = 3;
}

// A type a decimal column can arrive as instead.
enum ColumnType {
  COLUMN_TYPE_UNSPECIFIED = 0;
  // The source's text for the value, NaN included.
  COLUMN_TYPE_STRING = 1;
  // A double, so digits can be lost. NaN and infinities are kept.
  COLUMN_TYPE_FLOAT64 = 2;
}

message PipelineDestination {
  // A Destination ID in the same workspace.
  string ref = 1;
  // How every stream is written. Unset, for each stream, where the
  // destination has the mode: overwrite for a full refresh, merge for a
  // keyed stream read with cdc, and append otherwise.
  WriteMode write = 2;
  // A schema or dataset. Unset: the destination's default.
  string namespace = 3;
  Naming naming = 4;
  // How merge applies deletes. Unset: soft.
  DeleteMode deletes = 5;
  // For every stream that doesn't say. Unset: refuse.
  TypeChanges type_changes = 6;
  // Streams' names in the destination, by stream, exactly as written: a
  // table, or what the destination has instead, such as a topic. A stream
  // left out goes by its own name, through naming. Not with a transform,
  // whose outputs name their tables.
  map<string, string> tables = 7;
}

enum DeleteMode {
  DELETE_MODE_UNSPECIFIED = 0;
  // Keep the row, with _openetl_deleted true and its other columns as they
  // were.
  DELETE_MODE_SOFT = 1;
  DELETE_MODE_HARD = 2;
}

enum Naming {
  NAMING_UNSPECIFIED = 0;
  // Lowercase, with anything outside [a-z0-9_] replaced. The default.
  NAMING_NORMALIZED = 1;
  // Source names as they are, quoted.
  NAMING_SOURCE = 2;
}

enum WriteMode {
  WRITE_MODE_UNSPECIFIED = 0;
  // Adds what was read to what the destination has.
  WRITE_MODE_APPEND = 1;
  // Replaces what the destination has with what one sync read, so its
  // streams are read with full_refresh.
  WRITE_MODE_OVERWRITE = 2;
  // Updates each row by its primary key.
  WRITE_MODE_MERGE = 3;
}

enum SchemaPolicy {
  SCHEMA_POLICY_UNSPECIFIED = 0;
  // Adds columns and widens types. A type that changes otherwise goes to a
  // new column, col__v2. The default.
  SCHEMA_POLICY_ALLOW_ALL = 1;
  // As allow_all, but a type that changes otherwise is held, or fails the
  // sync with SCHEMA_DRIFT where the column can't be held.
  SCHEMA_POLICY_ALLOW_COLUMNS = 2;
  // Any change is held, or fails the sync with SCHEMA_DRIFT where the
  // column can't be held.
  SCHEMA_POLICY_BLOCK = 3;
  // Drops new columns, and casts values to the types the columns have;
  // values that don't fit are quarantined.
  SCHEMA_POLICY_IGNORE_NEW = 4;
}

message Delivery {
  reserved 4;
  reserved "dedupe";

  // The plan fails if any stream's guarantee is lower. Unset: exactly once.
  DeliveryLevel require = 1;
  Commit commit = 2;
  // How long a commit waits for a point the source can resume from
  // exactly, before it commits without one where the stream keeps its level
  // anyway. Unset: 1m. Zero: wait forever.
  google.protobuf.Duration resume_point_timeout = 3;
}

enum DeliveryLevel {
  DELIVERY_LEVEL_UNSPECIFIED = 0;
  DELIVERY_LEVEL_AT_LEAST_ONCE = 1;
  DELIVERY_LEVEL_EFFECTIVELY_ONCE = 2;
  DELIVERY_LEVEL_EXACTLY_ONCE = 3;
}

// Commit is when a pipeline commits what it has read.
message Commit {
  // Unset: 5m in a scheduled pipeline; in a continuous one, the
  // destination's own interval, or else 10s.
  google.protobuf.Duration interval = 1;
  // Commit once this many bytes have been read since the last commit.
  // Unset: 256 MB, which grows when commits can't keep up.
  int64 max_bytes = 2;
  // Unset: pipeline where the destination can, otherwise stream.
  CommitScope scope = 3;
}

enum CommitScope {
  COMMIT_SCOPE_UNSPECIFIED = 0;
  // Every stream commits together.
  COMMIT_SCOPE_PIPELINE = 1;
  // Each stream commits on its own.
  COMMIT_SCOPE_STREAM = 2;
}

message GetPipelineRequest {
  string name = 1;
}

message GetPipelineResponse {
  Pipeline pipeline = 1;
}

message ListPipelinesRequest {
  // workspaces/{workspace}
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListPipelinesResponse {
  repeated Pipeline pipelines = 1;
  string next_page_token = 2;
}

message DeletePipelineRequest {
  string name = 1;
  // If set, it must match.
  string etag = 2;
}

message DeletePipelineResponse {}

message PausePipelineRequest {
  string name = 1;
  // As the source's catalog names it; empty: the whole pipeline.
  string stream = 2;
}

message PausePipelineResponse {
  Pipeline pipeline = 1;
}

message ResetPipelineRequest {
  string name = 1;
  // The streams to read again; empty for every stream. A source that reads
  // every stream from one position, such as Postgres CDC after its slot was
  // lost, needs every stream read again.
  repeated string streams = 2;
}

message ResetPipelineResponse {
  Pipeline pipeline = 1;
