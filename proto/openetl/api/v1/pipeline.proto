message ResumePipelineRequest {
  string name = 1;
  // A stream paused on its own; empty: the whole pipeline, which leaves
  // paused streams paused.
  string stream = 2;
}

message ResumePipelineResponse {
  Pipeline pipeline = 1;
}

message RemovePipelineOverrideRequest {
  string name = 1;
  // As PipelineOverride.field.
  string field = 2;
}

message RemovePipelineOverrideResponse {
  Pipeline pipeline = 1;
