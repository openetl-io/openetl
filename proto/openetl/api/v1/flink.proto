syntax = "proto3";

package openetl.api.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/openetl-io/openetl/gen/openetl/api/v1;apiv1";

// FlinkClusterService reads and deletes Flink clusters. ApplyService creates
// and changes them.
service FlinkClusterService {
  rpc GetFlinkCluster(GetFlinkClusterRequest) returns (GetFlinkClusterResponse) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/flinkClusters/*}"};
  }
  rpc ListFlinkClusters(ListFlinkClustersRequest) returns (ListFlinkClustersResponse) {
    option (google.api.http) = {get: "/v1/{parent=workspaces/*}/flinkClusters"};
  }
  // Fails with FAILED_PRECONDITION while a pipeline's current version uses
  // it. Older versions keep the settings they pin.
  rpc DeleteFlinkCluster(DeleteFlinkClusterRequest) returns (DeleteFlinkClusterResponse) {
    option (google.api.http) = {delete: "/v1/{name=workspaces/*/flinkClusters/*}"};
  }
}

// FlinkCluster is where a continuous pipeline's Flink job runs. Runners
// deploy, stop and watch it. Flink 1.20 only.
message FlinkCluster {
  // workspaces/{workspace}/flinkClusters/{cluster}
  string name = 1;
  FlinkClusterSpec spec = 2;
  // The settings' version, which new pipeline versions pin.
  string version = 3;
  string etag = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp update_time = 6;
  // The pipelines whose current versions use it.
  repeated string used_by = 7;
}

message FlinkClusterSpec {
  oneof target {
    FlinkKubernetes kubernetes = 1;
    FlinkRest rest = 2;
    FlinkEmr emr = 3;
  }
  // Flink configuration for every job. A value can be a secret reference,
  // {"secret": NAME}. Options the runner sets can't be set here.
  google.protobuf.Struct conf = 4;
}

// FlinkKubernetes runs each job as a FlinkDeployment of the Flink Kubernetes
// Operator, in application mode, with Kubernetes HA.
message FlinkKubernetes {
  string namespace = 1;
  // A Flink 1.20 image with an S3 filesystem plugin, which reads the job's
  // jar and writes its checkpoints. Unset: flink:1.20.
  string image = 2;
  // The service account Flink's pods run as, which HA needs to edit
  // ConfigMaps. Unset: flink.
  string service_account = 3;
  // A secret reference, {"secret": NAME}, holding a kubeconfig. Unset: the
  // runner's own service account, in the cluster it runs in.
  google.protobuf.Value kubeconfig = 4;
  FlinkResources job_manager = 5;
  FlinkResources task_manager = 6;
}

message FlinkResources {
  // CPUs, such as 0.5 or 2. Unset: 1.
  double cpu = 1;
  // Kubernetes quantity, such as 2048m or 2g. Unset: 2048m.
  string memory = 2;
}

// FlinkRest runs each job on a standalone session cluster, through its REST
// API.
message FlinkRest {
  // The REST API's base URL, such as http://flink:8081.
  string url = 1;
  // A secret reference, {"secret": NAME}, holding a bearer token for a proxy
  // in front of the API. Unset: no token.
  google.protobuf.Value auth = 2;
}

// FlinkEmr runs each job on YARN, as a step of a cluster of EMR on EC2.
message FlinkEmr {
  // One of cluster_id and cluster_name. A name finds the one active cluster
  // of that name at each deployment, for clusters that are replaced.
  string cluster_id = 1;
  string cluster_name = 2;
  string region = 3;
}

message GetFlinkClusterRequest {
  string name = 1;
}

message GetFlinkClusterResponse {
  FlinkCluster flink_cluster = 1;
}

message ListFlinkClustersRequest {
  // workspaces/{workspace}
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListFlinkClustersResponse {
  repeated FlinkCluster flink_clusters = 1;
  string next_page_token = 2;
}

message DeleteFlinkClusterRequest {
  string name = 1;
  // If set, it must match.
  string etag = 2;
}

message DeleteFlinkClusterResponse {}
