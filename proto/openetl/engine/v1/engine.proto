syntax = "proto3";

package openetl.engine.v1;

import "openetl/connector/v1/destination.proto";

option go_package = "github.com/openetl-io/openetl/gen/openetl/engine/v1;enginev1";

// EngineService is the engine's control channel, served on a Unix socket. One
// engine process runs one job. The runner calls StartJob, then connects the
// data edges (frames.proto).
service EngineService {
  rpc StartJob(StartJobRequest) returns (StartJobResponse);
  // For engine sinks that apply in the engine. The runner commits and
  // recovers a Parquet sink from its staged descriptor.
  rpc Recover(RecoverRequest) returns (RecoverResponse);
  // A failed job ends the stream with an openetl.connector.v1.Error in the
  // status details.
  rpc Events(EventsRequest) returns (stream EventsResponse);
  // The epoch's checkpoint is recorded, so an engine sink that applies in the
  // engine makes it visible. Idempotent.
  rpc Commit(CommitRequest) returns (CommitResponse);
  // Ends the job without draining, and the process exits.
  rpc Stop(StopRequest) returns (StopResponse);
  // A job with remote_schemas: the runner opens it once, after StartJob and
  // before it connects the edges.
  rpc Schemas(stream SchemasRequest) returns (stream SchemasResponse);
}

message StartJobRequest {
  string pipeline = 1;
  // The attempt.
  string job = 2;
  uint64 generation = 3;
  // One past the restored epoch.
  uint64 first_epoch = 4;
  repeated StreamPlan streams = 5;
  repeated Edge edges = 6;
  SinkPlan sink = 7;
  Limits limits = 8;
  // Operator state in the restored checkpoint, as EpochReady reported it:
  // each lane's of each stateful operator, which this job's lanes open by
  // their own ranges of key groups.
  repeated StateSnapshot restored_snapshots = 9;
  Naming naming = 10;
  // Where records the engine can't take are kept: file:// and an absolute
  // path, or s3://bucket/prefix with region and endpoint as query
  // parameters. Empty: such a record fails the job. A transform's outputs'
  // are below its _outputs, apart from the streams'.
  string quarantine_url = 11;
  // How changes to a stream's established schema are taken. A stream's
  // schema is established once restored, or once it crosses a barrier.
  SchemaPolicy schema_policy = 12;
  // Infinite dates and timestamps don't fit their type, instead of being
  // clamped to the logical type's limits: they quarantine their row, or are
  // held as cells under the stream's HoldPlan. In typed batches, the largest
  // and smallest values of Date32 and of timestamps in any unit are
  // infinite.
  bool unfit_infinity = 13;
  // Batches reach the sink as they came: not coerced, renamed or given
  // metadata columns. Rows fail the job. For measuring the boundary.
  bool passthrough = 14;
  // Where held values are kept, as quarantine_url: Parquet files
  // at {g}/{N}/{stream}/part-{k}.parquet below it, with the stream's name
  // percent-encoded. Empty: nothing is held.
  string held_url = 15;
  // The attempt's lanes: parallel copies of its path, each with an
  // inbound edge. Zero: one.
  uint32 lanes = 16;
  // Its writer lanes, at most lanes: a writer of the destination each, or a
  // part of an engine sink's files. Zero: one.
  uint32 writer_lanes = 17;
  // The pipeline's key groups, a power of two, at least lanes. Writer lane w
  // owns the w-th of writer_lanes contiguous ranges of them. Each writer
  // lane's range is cut again among the lanes that feed it, a contiguous
  // run of them in lane order: each writer lane gets one lane, and the
  // others go one at a time to the writer lane with the most key groups per
  // lane, the first of those that tie. A stream's rows go from a lane to the
  // writer lane whose range holds the lane's, unless it has an exchange.
  // Zero: 256.
  uint32 key_groups = 18;
  // A transform's outputs, which the destination gets in place of streams.
  // Empty without a transform: the streams are the outputs.
  repeated StreamPlan outputs = 19;
  // Unset: none, and outputs is empty.
  Transform transform = 20;
  // Several engines run the attempt, and each stream's schema has one owner
  // outside them, reached through Schemas: each of the destination's
  // streams', with the columns it holds whole, and each stream a transform
  // reads. A lane that changes a stream's schema, or what it holds, proposes
  // it from the owner's version it had, and goes on with it once the owner
  // takes it; otherwise it shapes its batch again by the owner's. Every
  // stream starts at the owner's version 0: its restored schema, and the
  // holds its HoldPlan starts with. Only the engine whose first_lane is 0
  // patches in released holds.
  bool remote_schemas = 21;
  // The attempt's index of the engine's first lane, where several engines
  // run the attempt: a lane's quarantine files are named by its index in
  // the attempt.
  uint32 first_lane = 22;
  // Where several engines run the attempt, the attempt's index of the
  // engine's first writer lane, and the attempt's writer lanes, 0 being
  // writer_lanes: held files are named by a writer lane's index in the
  // attempt.
  uint32 first_writer_lane = 23;
  uint32 attempt_writer_lanes = 24;
  // Where several engines run the attempt and their exchanges cross them.
  // Unset: a stream's exchange stays inside the engine.
  Mesh mesh = 25;
  // Where stateful operators keep their state, as quarantine_url: each
  // operator's runs below a directory of its own, which StateSnapshot.runs
  // name. A run counts once a record names it. Empty: a job with a
  // stateful operator fails with CONFIG_INVALID.
  string state_url = 26;
  // A redo's job, of one epoch: its stateful operators read the restored
  // snapshots and write nothing, and EpochReady names no state.
  bool state_read_only = 27;
  // Each group window's keyed lanes report the steps of its watermark that
  // their rows met in each epoch (OperatorEpoch.steps), which a redo of a
  // writer lane's part of the epoch replays. After 1,024 steps in an epoch,
  // a keyed lane holds the window's watermark where it is until the
  // barrier: its rows then meet that one, and each split's rows take at
  // most one more step, to it.
  bool record_window_steps = 28;
  // A redo's: the steps of each group window's watermark in the epoch it
  // redoes, as OperatorEpoch.steps gave them. Each row meets the watermark
  // it met there, and the windows close in the order they did. Missing:
  // its rows meet the floor, and the windows close at closes_at.
  repeated WindowSteps window_steps = 29;
  // What an epoch's snapshots on every engine of the attempt carry at most
  // of their lanes' changes (StateSnapshot.pending), in bytes. Unset: 1
  // MiB, or a 64th of limits.memory_bytes where that's less. 0: every
  // barrier that changed something writes a run. For tests of runs; the
  // runner leaves it unset.
  optional uint64 state_pending_bytes = 30;
}

// WindowSteps are a group window's watermark steps in an epoch, on each of
// its keyed lanes.
message WindowSteps {
  string operator = 1;
  repeated LaneSteps lanes = 2;
}

// LaneSteps are the steps of a group window's watermark that one keyed
// lane's rows met in an epoch, by the split they were read from.
message LaneSteps {
  // The keyed lane's.
  KeyGroupRange key_groups = 1;
  repeated SplitSteps splits = 2;
}

// SplitSteps are where a keyed lane's rows of one split met a later
// watermark of the window. A split's places count the rows a lane read of
// it in the epoch, from 0. The rows from places[i] on, before places[i+1],
// met watermarks[i], in microseconds since the Unix epoch, and those before
// places[0] the window's watermark at the epoch's start. Both ascend.
message SplitSteps {
  string split = 1;
  repeated uint64 places = 2;
  repeated int64 watermarks = 3;
}

// Mesh is the attempt's engines, whose lanes send an exchanged stream's rows
// to the writer lanes of any of them. The attempt's writer lane w owns the
// w-th of attempt_writer_lanes contiguous ranges of key groups, and each
// engine cuts its own writer lanes' ranges among its lanes as key_groups
// says one engine does. A lane sends each row of a stream with an exchange
// to the writer lane owning its key group, in whichever engine, and the
// stream's schema changes, watermarks, barriers and end to every writer
// lane of the attempt, which aligns on, and takes its watermark over, every
// lane of the attempt, connected yet or not. Each engine connects to every other once (frames.proto), and the job
// fails, as transient, if an engine isn't reached or doesn't connect in
// time, or a connection breaks before its streams end.
message Mesh {
  // This engine's index in engines. Its lanes and writer lanes are the
  // request's, and first_lane, first_writer_lane and attempt_writer_lanes
  // follow from the engines before it and from all of them.
  uint32 engine = 1;
  repeated MeshEngine engines = 2;
  // Where this engine listens for the others, as host:port; without a
  // host, as :7720, on every address.
  string listen = 3;
  // The attempt's certificate, as DER, which every engine presents and is
  // the only one each trusts, and its private key, as PKCS #8 DER.
  bytes certificate = 4;
  bytes key = 5;
  // What each connection's first frame carries, the attempt's alone.
  bytes secret = 6;
}

message MeshEngine {
  // Where the others reach it, as host:port.
  string address = 1;
  // At least one each: its lanes, which follow those of the engines before
  // it in the attempt's order, and likewise its writer lanes.
  uint32 lanes = 2;
  uint32 writer_lanes = 3;
}

// PeerLost is in the status details of a job that failed only because it
// lost another engine of its mesh, beside its openetl.connector.v1.Error:
// the other engine's own failure, if it had one, says why.
message PeerLost {
  // The other engine's index in Mesh.engines.
  uint32 engine = 1;
}

// Transform is SQL between the normalizer's two halves. Its statements read
// the streams, parsed and typed, under their source names, and write
// outputs, which are named, given metadata columns and held as a stream
// without a transform is. An output no statement writes is the stream of its
// name, passed through.
message Transform {
  // INSERT INTO output SELECT … statements.
  string sql = 1;
  // The outputs the statements write, as planning gave them for the
  // pipeline's version.
  repeated ExpectedOutput expected_outputs = 2;
  // The stateful operators' IDs, as planning gave them for the pipeline's
  // version, and as StateSnapshot.operator names them. A plan with other IDs
  // fails the job with CONFIG_INVALID.
  repeated string operators = 3;
}

message ExpectedOutput {
  string name = 1;
  // An Arrow IPC stream holding only the schema: the statement's columns,
  // with logical types.
  bytes arrow_schema = 2;
  // Empty: it has none, and can only be appended.
  repeated string primary_key = 3;
}

// Exchange sends each of a stream's rows to the writer lane owning the key
// group (openetl.kg.v1) of its values of columns, where the stream's
// partitioning doesn't meet what the writer needs: every row of a primary
// key on one writer lane, as for a keyed stream whose splits don't
// partition it by key. With a mesh, the writer lane may be another
// engine's.
message Exchange {
  // Of the stream's primary key, named as the stream names them: a
  // partitioning by a subset of the key meets the writer's need.
  repeated string columns = 1;
}

enum SchemaPolicy {
  // allow_all.
  SCHEMA_POLICY_UNSPECIFIED = 0;
  // Add columns and widen types. A type that isn't a widening goes to a new
  // column, col__v2.
  SCHEMA_POLICY_ALLOW_ALL = 1;
  // As allow_all, but a type that isn't a widening is held, or fails the job
  // with SCHEMA_DRIFT where the column can't be held (StreamPlan.holds).
  SCHEMA_POLICY_ALLOW_COLUMNS = 2;
  // Any change is held, or fails the job with SCHEMA_DRIFT where the column
  // can't be held.
  SCHEMA_POLICY_BLOCK = 3;
  // New columns are dropped in flight. Values are coerced to the
  // established types, and records whose values don't fit are quarantined.
  SCHEMA_POLICY_IGNORE_NEW = 4;
}

// Naming gives tables and columns their destination names. Names already in
// a restored schema are kept.
message Naming {
  // Keep source names as they are, for destinations that quote identifiers.
  bool keep_source_names = 1;
  // The destination's identifier limit in bytes. Zero: none.
  uint32 max_length = 2;
}

// StreamPlan is a stream the engine reads, or a transform's output. An
// output's arrow_schema, cursor_field and read_start_micros are unset. With a
// transform, the destination's settings, soft_deletes, holds, exchange and
// table, are its outputs', and a stream's are unset.
message StreamPlan {
  string name = 1;
  Lane lane = 2;
  repeated string primary_key = 3;
  // An Arrow IPC stream holding only the schema, if known. Empty: inferred
  // from the rows.
  bytes arrow_schema = 4;
  // The stream's schema in the restored checkpoint, as EpochReady reported
  // it, an output's in output_schemas. Inference continues from it.
  bytes restored_schema = 5;
  // The column whose value orders a record's versions, and becomes its
  // _openetl_seq. Empty: read_start_micros is.
  string cursor_field = 6;
  // When the stream's current read started, in microseconds since the Unix
  // epoch.
  int64 read_start_micros = 7;
  // Timestamps keep nanoseconds instead of being truncated to microseconds,
  // declared ones included. Outside 1677-09-21 to 2262-04-11 they are
  // quarantined, and infinities clamp to those limits.
  bool nanosecond_timestamps = 8;
  // Adds _openetl_deleted, true where _openetl_op is delete: for merge
  // writes that keep deleted rows.
  bool soft_deletes = 9;
  // A changelog stream (CDC): its typed batches carry op and seq control
  // columns (openetl.connector.v1.RecordBatch), and it gets
  // _openetl_unchanged.
  bool changelog = 10;
  // Unset: the stream holds nothing.
  HoldPlan holds = 11;
  // Where its rows are exchanged before the writer; unset: nowhere, and
  // each lane's rows go to its writer lane.
  Exchange exchange = 12;
  // Its name in the destination, exactly as written. Empty: from its own
  // name, by the job's naming.
  string table = 13;
  // Only rows whose key's group is in this range pass: a redo of one writer
  // lane's part of an epoch. A destination's stream with a primary key.
  // Unset: every row.
  KeyGroupRange key_groups = 14;
  // A stream a transform reads whose rows' time is a column's: how its
  // watermarks go. Its edges' Split frames say which split each batch is
  // of. Unset: it has none, and neither do the outputs it feeds.
  EventTime event_time = 15;
  // The destination replaces its table with what each of the stream's reads
  // writes (overwrite). If the stream has a declared schema and no schema
  // when every lane has passed the barrier that ends its read
  // (Barrier.ends_read), as when the read has no rows, the stream takes the
  // schema an empty batch of its declared columns shapes to, in that
  // epoch's EpochReady. Unset with a transform.
  bool overwrite = 16;
}

// EventTime is how a stream's watermarks are made. A split's watermark is
// the latest time it has read less delay_micros, or what its Split frames
// say, whichever is later, and never goes back. A lane's is the least of
// its splits', and a lane without splits holds none back from its first
// barrier on. An output's watermark is the least of the streams it's
// written from, each the least of its lanes'.
message EventTime {
  // Its name in the stream, under source names. Its values are timestamps
  // or dates.
  string column = 1;
  int64 delay_micros = 2;
  // Its rows aren't read in the order of their time, so a split's
  // watermark comes only from its Split frames.
  bool held = 3;
  // The least watermark of the stream's splits as the attempt starts, of
  // every engine's, in microseconds since the Unix epoch: what a lane that
  // takes the stream's outputs from others starts at. Unset: none.
  optional int64 floor = 4;
  // How long after a group window over the stream closes a row may still
  // come, giving the window's row again, in microseconds. A row later than
  // that is quarantined.
  int64 lateness_micros = 5;
  // A redo's (state_read_only): where the stream's watermark past the
  // exchange into a group window's keyed lanes was at the barrier of the
  // epoch it redoes, as EpochReady.window_watermarks gave it. The keyed
  // lanes stay at the floor while the epoch is read again, whatever their
  // senders' watermarks, and close the windows up to this one at the
  // barrier. Unset: they go by their senders'.
  optional int64 closes_at = 6;
  // How long a dedupe that keeps each key's first row remembers a key, in
  // microseconds of event time from that row's; the largest int64 for good.
  // Unset: the stream sets none, and such a dedupe over it is refused.
  optional int64 dedupe_retention_micros = 7;
  // Each sync reads the stream whole, with full_refresh, and each read
  // starts with no state for the statements that read it. A dedupe that
  // keeps each key's latest row then deletes a key its filters drop where
  // its state doesn't know whether the output has the key's row.
  bool full_read = 8;
  // A read of the stream may give a record again, as superset replay does,
  // and rows of one record ID and values are one record: it has a primary
  // key, or collapses. A group window and OVER over it keep each row's ID
  // and a hash of its values while they keep the row, and drop the rows a
  // read gives again. Unset: they keep no rows' IDs, as over a stream
  // replayed exactly.
  bool rereads = 9;
}

// HoldPlan is how a keyed stream holds back a column, or a row's cell, and
// delivers the rest of the row. A column is held when the schema
// policy would stop on its change (allow_columns, block), when the
// destination's limits say it can't take the change, or when the
// destination refused it. Columns are named by their destination names,
// except where the field says source names.
message HoldPlan {
  // A value that doesn't fit its type holds its cell, instead of
  // quarantining its row.
  bool cells = 1;
  // What a held cell shows, and per column by source name.
  Held held = 2;
  map<string, Held> columns = 3;
  // Columns held together, by source name.
  repeated ColumnGroup groups = 4;
  // Column holds in force: the restored record's, and the destination's
  // refusals.
  repeated ColumnHold holding = 5;
  // Columns whose holds were discarded, left out from now on.
  repeated string discarded = 6;
  // What the destination's table can't take, from its last ApplySchema.
  openetl.connector.v1.TableLimits limits = 7;
  // Held values to patch in; unset for none.
  Replay replay = 8;
}

message Held {
  HeldMode mode = 1;
  // For value, and for last's rows the target doesn't have: a JSON value of
  // the column's delivered type. Empty: null.
  string value = 2;
}

enum HeldMode {
  // null.
  HELD_MODE_UNSPECIFIED = 0;
  HELD_MODE_NULL = 1;
  HELD_MODE_VALUE = 2;
  // The target keeps its value. Merge only.
  HELD_MODE_LAST = 3;
}

message ColumnGroup {
  repeated string columns = 1;
}

message ColumnHold {
  string column = 1;
  // An Arrow IPC stream holding only a schema with the column's field as the
  // destination has it. Empty: the destination doesn't have it.
  bytes delivered = 2;
  string reason = 3;
  HoldCause cause = 4;
}

// HoldCause is why a column is held whole.
message HoldCause {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // The schema policy doesn't take the change.
    KIND_POLICY = 1;
    // The destination refused the change.
    KIND_REFUSED = 2;
    // The destination can't change the column's type.
    KIND_FIXED = 3;
    // The destination takes no more columns.
    KIND_COLUMN_LIMIT = 4;
    // Held with another column.
    KIND_GROUP = 5;
  }
  Kind kind = 1;
  // KIND_POLICY's schema policy.
  string policy = 2;
  // KIND_GROUP's column, by its destination name.
  string with = 3;
  // Set by the engine when it reports a hold: the column's source name, and
  // its logical type as the destination has it and in the stream now. from
  // is empty for a column the destination doesn't have.
  string source = 4;
  string from = 5;
  string to = 6;
}

// Replay patches held values in: a chunk after each of the stream's
// barriers, so each lands in the next epoch.
message Replay {
  // The held files to read, below held_url, in order.
  repeated string files = 1;
  // Where an earlier attempt's replay got.
  ReplayProgress from = 2;
  // The columns whose held values are delivered: cells that fit their
  // column's type now, and column holds' values at its type now. Others'
  // values are skipped.
  repeated string columns = 3;
  // Zero: a default.
  uint64 chunk_rows = 4;
  // Released column holds, of those columns, whose values go to a new
  // version of the column, col__v2, as allow_all's do: from the hold's
  // start, and from now on. The column keeps the type the destination has.
  // Once the stream's schema has that version, it is the one.
  repeated ColumnHold versioned = 5;
  // By column, the index in files of the first file its values held whole
  // are read from, and the first its held cells are. What the files before
  // hold of it belongs to a hold of that kind that has ended, and is
  // skipped. A column without one is read from the first file.
  map<string, uint32> first = 6;
  map<string, uint32> first_cells = 7;
}

message ReplayProgress {
  // The next row to read: its file's index in Replay.files, and its row.
  uint32 file = 1;
  uint64 row = 2;
  // Every file is read.
  bool done = 3;
  // Cells read that still don't fit, which stay held; cumulative.
  uint64 still_held = 4;
}

enum Lane {
  LANE_UNSPECIFIED = 0;
  LANE_ROWS = 1;
  LANE_ARROW = 2;
}

message Edge {
  string id = 1;
  EdgeDirection direction = 2;
  // A frame's stream index points into this list. An edge from the engine
  // carries the destination's streams: a transform's outputs.
  repeated string streams = 3;
  // Inbound, its lane; outbound, its writer lane. Every lane passes every
  // stream's barriers.
  uint32 lane = 4;
}

enum EdgeDirection {
  EDGE_DIRECTION_UNSPECIFIED = 0;
  EDGE_DIRECTION_TO_ENGINE = 1;
  EDGE_DIRECTION_FROM_ENGINE = 2;
}

message SinkPlan {
  oneof sink {
    RunnerSink runner = 1;
    ParquetSink parquet = 2;
    DiscardSink discard = 3;
    StagedSink staged = 4;
  }
}

// RunnerSink is a Go sink in the runner, fed by the FROM_ENGINE edges, one
// per writer lane.
message RunnerSink {
  reserved 1;
}

// ParquetSink stages each epoch as Parquet files under url, and reports them
// in EpochReady.staged. The files' paths and names have
// StartJobRequest.pipeline in them, so pipelines can share a url and a
// table.
message ParquetSink {
  // file:// and an absolute path.
  string url = 1;
}

// StagedSink stages each epoch as Parquet files below url, for a destination
// connector that loads them (DELIVERY_STAGED), at
// {g}/{N}/{stream}/part-{k}.parquet with the stream's name percent-encoded,
// or {g}/{N}/{dir}/{stream}/part-{k}.parquet with a dir. A writer lane's
// n-th file of a stream in an epoch is k = n * writer_lanes + lane, so one
// lane's are 0, 1, 2 and so on. EpochReady.files lists them.
message StagedSink {
  // As quarantine_url.
  string url = 1;
  // One path segment; empty for none.
  string dir = 2;
}

// DiscardSink drops every batch and reports each epoch ready with nothing
// staged. For benchmarks and tests.
message DiscardSink {}

message Limits {
  // What the engine's allocations may hold. Reaching it ends the engine with
  // exit code 75. Zero: no limit.
  uint64 memory_bytes = 1;
  // A directory on local disk that is the engine's alone, for caches of
  // what's durable elsewhere: the engine empties it as it starts, and
  // nothing in it outlives the job. Empty: none, and no disk cache.
  string scratch_dir = 2;
  // What the job may keep in scratch_dir, of which the state's disk cache
  // takes half. Zero, with a directory: no disk cache.
  uint64 scratch_bytes = 3;
}

message StartJobResponse {}

message RecoverRequest {
  openetl.connector.v1.Epoch epoch = 1;
  // As openetl.connector.v1.WriteRecover's.
  repeated bytes staged = 2;
}

message RecoverResponse {
  openetl.connector.v1.Recovery recovery = 1;
}

message EventsRequest {}

message EventsResponse {
  oneof event {
    EpochReady epoch_ready = 1;
    Metrics metrics = 2;
  }
}

// EpochReady says the engine's part of the epoch is durable. Its staged
// files, holds and delivered schemas are the destination's streams': with a
// transform, its outputs'.
message EpochReady {
  openetl.connector.v1.Epoch epoch = 1;
  // An engine sink's committables, one per writer lane; empty with a runner
  // sink.
  repeated bytes staged = 2;
  repeated StateSnapshot snapshots = 3;
  // Each stream's schema at its barrier, as an Arrow IPC stream holding only
  // the schema. Streams without one yet are missing (see
  // StreamPlan.overwrite). With a transform, a stream's is as its statements
  // read it: source names and logical types, without metadata columns.
  map<string, bytes> schemas = 4;
  // Records quarantined in the epoch, one file per stream that had any.
  repeated QuarantineFile quarantine = 5;
  // A staged sink's files, by stream and writer lane, with paths below its
  // URL. Streams without rows in the epoch are missing.
  repeated StagedStream files = 6;
  // By stream, for streams with a HoldPlan that hold anything or replay.
  map<string, StreamHolds> holds = 7;
  // The schema the destination gets, for streams where it isn't the
  // stream's because columns are held: those stay at the type the
  // destination took, or are left out if it took none.
  map<string, bytes> delivered = 8;
  // A transform's outputs' schemas at their barriers, as a stream's is
  // without a transform: destination names and metadata columns. Empty
  // without a transform.
  map<string, bytes> output_schemas = 9;
  // The watermarks of the splits of each stream with event time, by
  // stream, each at its lane's barrier: every split a lane has, complete
  // ones included.
  map<string, SplitWatermarks> watermarks = 10;
  // Each stateful operator's part of the epoch on this engine's lanes.
  // Every engine of an attempt reports its own, which add up.
  repeated OperatorEpoch operators = 11;
  // Each stream a group window reads: its watermark past the exchange into
  // the window's keyed lanes at their barrier, the least of every sender's
  // of the attempt and never below the floor, which the windows closed up
  // to; the least int64 where it has none.
  map<string, int64> window_watermarks = 12;
}

// OperatorEpoch is what an engine's lanes of one stateful operator did in
// an epoch, and what they held at their barriers.
message OperatorEpoch {
  string operator = 1;
  // Rows of the statement's stream that reached its lanes.
  uint64 rows_in = 2;
  // The output's rows it wrote, by op: those the output quarantined aren't
  // counted.
  uint64 inserts = 3;
  uint64 updates = 4;
  uint64 deletes = 5;
  // Rows it quarantined as late, past their windows' allowed lateness.
  uint64 late = 6;
  // Windows, or sessions, whose state it began keeping, and stopped
  // keeping: closed past their lateness, or merged into another session.
  // A dedupe's keys it began keeping, and forgot past their retention.
  uint64 windows_opened = 7;
  uint64 windows_dropped = 8;
  // The least of its lanes' watermarks at their barriers, in microseconds
  // since the Unix epoch; the largest int64 is the end of input. Unset: a
  // lane has none yet.
  optional int64 watermark = 9;
  // What its lanes' state held in memory as their barriers began, the
  // epoch's changes included, and its block cache when the epoch was ready.
  uint64 memory_bytes = 10;
  // The runs its lanes' snapshots name, below the job's state URL, with
  // their bytes: the same run from several lanes or engines is one.
  map<string, uint64> runs = 11;
  // The runs its lanes wrote at their barriers of the epoch, and their
  // bytes: early flushes' under memory pressure before a barrier among
  // them.
  StateRequests barrier = 12;
  // Its reads of blocks and of runs' indexes and filters since the
  // engine's last ready epoch: one made near a barrier can count in the
  // epoch next to it, and every one counts once.
  StateRequests lookup = 13;
  StateRequests restore = 14;
  // The outputs of its lanes' merges that their barriers of the epoch
  // wrote, and their bytes.
  StateRequests merge_write = 15;
  // Its merges' reads of the runs they merge, counted as lookups are.
  StateRequests merge_read = 16;
  // With record_window_steps, a group window's: the steps of its
  // watermark that each of its keyed lanes' rows met in the epoch, for
  // lanes whose rows met one past the watermark at the epoch's start.
  repeated LaneSteps steps = 17;
  // Reads of blocks and of runs' indexes and filters that the disk cache
  // answered, counted as lookups are.
  DiskReads disk = 18;
  // A dedupe's rows it didn't write: repeats of a key it keeps, and for one
  // that keeps each key's latest row, rows no later than the key's. A group
  // window's and OVER's rows it took once already, as a read gave them
  // again: of one record ID and one hash of their stream's row.
  uint64 repeats = 19;
}

// DiskReads are reads of state that the engine's disk cache answered in
// place of object storage, which aren't requests to it, and their bytes.
message DiskReads {
  uint64 count = 1;
  uint64 bytes = 2;
}

// StateRequests are requests of one kind to object storage, and their
// bytes.
message StateRequests {
  uint64 count = 1;
  uint64 bytes = 2;
}

message SplitWatermarks {
  // By split ID, in microseconds since the Unix epoch; the largest int64 is
  // the end of its input. A split without one is missing.
  map<string, int64> splits = 1;
}

// StreamHolds is a stream's holds at its barrier.
message StreamHolds {
  // Column holds in force.
  repeated ColumnHold holding = 1;
  // Cells held in the epoch, by column.
  map<string, CellHolds> cells = 2;
  // The held values written in the epoch, with paths below held_url.
  repeated openetl.connector.v1.StagedFile files = 3;
  // How far the replay got by the barrier; unset without one.
  ReplayProgress replayed = 4;
}

message CellHolds {
  uint64 cells = 1;
  // The first cell's.
  string reason = 2;
}

message StagedStream {
  string stream = 1;
  repeated openetl.connector.v1.StagedFile files = 2;
  // The writer lane that staged them.
  uint32 lane = 3;
}

// QuarantineFile holds JSON lines, one per record: the stream, the cause's
// code, column and why the record's value wasn't held where they apply, the
// reason and the record as received.
message QuarantineFile {
  string stream = 1;
  string url = 2;
  uint64 rows = 3;
  // stream is one of a transform's outputs.
  bool output = 4;
  // Its rows by cause, each cause once.
  repeated QuarantineCause causes = 5;
}

// QuarantineCause is how many of a file's rows were quarantined for one
// cause. It never holds a value.
message QuarantineCause {
  // One of json, object, type, range, precision, nan, statement, unsent,
  // late, event_time and aggregate.
  string code = 1;
  // The column that caused it; empty where no one column did.
  string column = 2;
  // Set where the stream holds cells: why the rows weren't held. One of
  // key, cursor, destination, not_null, held_value, record and transform.
  string not_held = 3;
  uint64 rows = 4;
}

// StateSnapshot is a stateful operator's state on one lane at a barrier,
// for the lane's range of key groups, which names it, never the lane: a
// lane of any later job opens the part of it that its own range holds. An
// operator's snapshots in an epoch hold every key group between them.
message StateSnapshot {
  string operator = 1;
  KeyGroupRange key_groups = 2;
  // The layout of the state's keys.
  uint32 layout = 3;
  // The sections of runs it reads, which only the engine reads.
  bytes data = 4;
  // The runs it names, below state_url: what retention keeps.
  repeated string runs = 5;
  // The lane's changes since it last wrote a run, newer than all the runs
  // hold, which only the engine reads: the record carries them in place of
  // a run while they're small. An epoch's snapshots on every engine of an
  // attempt carry at most StartJobRequest.state_pending_bytes of them,
  // shared evenly by the stateful operators, and by each operator's lanes
  // as their key groups are of the pipeline's. At a barrier where a lane's
  // would pass its share, it writes them as a run. Empty: none.
  bytes pending = 6;
}

// KeyGroupRange is key groups first to last, inclusive.
message KeyGroupRange {
  uint32 first = 1;
  uint32 last = 2;
}

// Metrics are cumulative since the job started.
message Metrics {
  repeated StreamMetrics streams = 1;
  // What the engine's allocations hold now.
  uint64 memory_bytes = 2;
  // Each lane's, in lane order.
  repeated LaneMetrics lanes = 3;
}

// LaneMetrics is where a lane's time went: working, waiting
// for its writer lanes to take what it made, or waiting for its edge.
message LaneMetrics {
  uint64 busy_nanos = 1;
  uint64 backpressured_nanos = 2;
  uint64 idle_nanos = 3;
  uint64 rows_in = 4;
}

message StreamMetrics {
  string stream = 1;
  uint64 rows_in = 2;
  uint64 bytes_in = 3;
  uint64 rows_out = 4;
  uint64 bytes_out = 5;
  uint64 rows_quarantined = 6;
  uint64 cells_held = 7;
  // A stream with event time: the least of its lanes' watermarks, in
  // microseconds since the Unix epoch; for an output, the least of its
  // writer lanes'. Unset: it has none yet.
  optional int64 watermark = 8;
}

message CommitRequest {
  openetl.connector.v1.Epoch epoch = 1;
  // Every writer lane's committable, by lane.
  repeated bytes staged = 2;
}

message CommitResponse {}

message StopRequest {}

message StopResponse {}

// SchemasRequest is the owner's schema of one of the job's streams: in
// answer to a proposal of the engine's, taken or not, or another engine's
// change. Versions of a stream come in order, and the engine shapes by the
// newest.
message SchemasRequest {
  // An index into the destination's streams: StartJobRequest.outputs with
  // a transform, and its streams without; with input, into its streams, a
  // transform's inputs, whose versions are apart.
  uint32 stream = 1;
  uint64 version = 2;
  // An Arrow IPC stream holding only the schema, as EpochReady.schemas, or
  // a transform's input's as it reads it.
  bytes arrow_schema = 3;
  bool input = 4;
  // One of the destination's streams that holds: the columns it holds
  // whole, as StreamHolds.holding.
  repeated ColumnHold holding = 5;
  // One of the destination's streams that the owner has sealed: every lane
  // of the engine shapes by this version and every later one under the
  // schema policy, whether or not the engine's lanes have had rows of the
  // stream. The owner seals a stream in a version of its own, with the same
  // schema, as it takes the shares of the first epoch at which the stream
  // has columns. Unset: the policy applies once the engine's lanes have
  // passed a barrier with the stream's columns, or from the start where the
  // job restored them.
  bool sealed = 6;
}

// SchemasResponse proposes a lane's change to a stream's schema, or to what
// it holds, made from the owner's version base. The engine sends one
// proposal of a stream at a time, and waits for a newer version. The owner
// takes the change only if base is its newest version, and otherwise
// answers with that version, which the lane shapes its batch again by.
message SchemasResponse {
  // As SchemasRequest's.
  uint32 stream = 1;
  uint64 base = 2;
  bytes arrow_schema = 3;
  bool input = 4;
  repeated ColumnHold holding = 5;
  // Where columns are held whole, the schema the destination gets, as
  // EpochReady.delivered; empty where it's arrow_schema.
  bytes delivered = 6;
}
