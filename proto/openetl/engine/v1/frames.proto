syntax = "proto3";

package openetl.engine.v1;

import "openetl/connector/v1/destination.proto";

option go_package = "github.com/openetl-io/openetl/gen/openetl/engine/v1;enginev1";

// Each Edge is one connection to the engine's data socket. A frame is a
// 12-byte header and a payload. The header is the kind (1 byte), 3 zero
// bytes, the stream (uint32 LE, an index into Edge.streams), and the payload
// length (uint32 LE).
//
// A BATCH payload is an Arrow IPC stream: the schema, any dictionaries, one
// record batch. Every other payload is the message named after its kind.
//
// Engines of one attempt (StartJobRequest.mesh) send each other the same
// frames over TLS 1.3, on a connection from each engine to each other:
// MESH_HELLO each way first, then the dialing engine's lanes' frames to the
// listening engine's writer lanes and keyed lanes, each after the ROUTE it
// goes by. Every
// engine presents the attempt's certificate and trusts no other.
enum FrameKind {
  FRAME_KIND_UNSPECIFIED = 0;
  // The first frame on every connection to the data socket, from the
  // runner.
  FRAME_KIND_HELLO = 1;
  FRAME_KIND_BATCH = 2;
  // To the engine only.
  FRAME_KIND_ROWS = 3;
  FRAME_KIND_BARRIER = 4;
  FRAME_KIND_SCHEMA_CHANGE = 5;
  reserved 6;
  reserved "FRAME_KIND_STAGED_FILES";
  FRAME_KIND_END_OF_STREAM = 7;
  // From the engine only: a BATCH of patches, as
  // openetl.connector.v1.WriteBatch.patch describes.
  FRAME_KIND_PATCH = 8;
  // To the engine only, for a stream with event time (StreamPlan.event_time).
  FRAME_KIND_SPLIT = 9;
  // Between a lane and the lanes it sends to, in one engine or another's: a
  // sender's watermark of the stream, in order with what it sends.
  FRAME_KIND_WATERMARK = 10;
  // Between engines only: the first frame each way on a connection.
  FRAME_KIND_MESH_HELLO = 11;
  // Between engines only: where the frames after it go, until the next
  // ROUTE.
  FRAME_KIND_ROUTE = 12;
  // Between engines only: a BATCH of held values, to the writer lane their
  // rows went to.
  FRAME_KIND_HELD = 13;
}

message Hello {
  string edge = 1;
}

message Rows {
  // One JSON object each.
  repeated bytes rows = 1;
}

// Barrier ends the epoch on one stream.
message Barrier {
  openetl.connector.v1.Epoch epoch = 1;
  // To the engine only: the stream's read ends in this epoch. Set on at
  // least the last of the stream's lanes' barriers of that epoch.
  bool ends_read = 2;
}

// SchemaChange comes before the first batch with the new schema.
message SchemaChange {
  // An Arrow IPC stream holding only the schema.
  bytes arrow_schema = 1;
}

message EndOfStream {}

// Split is about one of the stream's splits on the edge. The stream's ROWS
// and BATCH frames after it on the edge are the split's, until the next
// Split of the stream. The first Split of a split on the edge joins it to the
// lane; the edge carries every split of the lane's from the start of the
// read, and a split it adds after it joins the lane of the split it came
// from.
message Split {
  string id = 1;
  // The split's watermark from here is at least this, in microseconds since
  // the Unix epoch: as the restored record has it, on its first Split, or
  // an advance the runner makes, as when it's idle. The largest int64 is
  // the end of its input. Unset: unchanged.
  optional int64 watermark = 2;
}

// Watermark says no row of the stream the sender sends after it is earlier
// than micros, but a late one. A sender's never goes back.
message Watermark {
  // Microseconds since the Unix epoch; the largest int64 is the end of its
  // input.
  int64 micros = 1;
}

// MeshHello opens a connection from one engine of an attempt to another,
// which carries the dialing engine's lanes' frames to the other's writer
// lanes and keyed lanes. The dialer's says which engine it is and carries the attempt's
// secret. The listener answers with its own, without the secret, once it
// takes the connection; or with refused set, and closes it. It refuses a
// connection of another attempt or generation, with another secret, of an
// engine that isn't another of the attempt's, or of one already connected.
message MeshHello {
  // StartJobRequest.job and generation.
  string attempt = 1;
  uint64 generation = 2;
  // Its index in Mesh.engines.
  uint32 engine = 3;
  bytes secret = 4;
  // Why the listener refused the connection; empty: it took it.
  string refused = 5;
}

// Route is where the frames after it on a connection between engines go:
// from one of the dialer's lanes to one of the listener's writer lanes,
// each by its index in the attempt. Only frames of streams with an exchange
// follow, their stream an index into the destination's streams: BATCH,
// SCHEMA_CHANGE, BARRIER, WATERMARK and END_OF_STREAM. With keyed_lane,
// they go to the listener's keyed lane of that lane of the attempt, which
// runs the group windows, and their stream is a window's statement, by its
// index in the transform: BATCH (the columns the statement reads, then two
// strings a row, the column and the reason of a cell the stream holds,
// which the statement can't read), BARRIER, WATERMARK and END_OF_STREAM. The
// dialer closes the connection once each of its lanes has ended every such
// stream on each of the listener's writer lanes, and every window's
// statement on each of its keyed lanes; closed before, it fails the job.
message Route {
  uint32 lane = 1;
  uint32 writer_lane = 2;
  optional uint32 keyed_lane = 3;
}
