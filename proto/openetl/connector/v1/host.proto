syntax = "proto3";

package openetl.connector.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "openetl/connector/v1/errors.proto";

option go_package = "github.com/unsuitable001/openetl/sdk/go/protocol/v1;protocolv1";

// HostService is how connectors reach the outside world. Fields ending in
// _secret hold secret names; the host injects the values.
service HostService {
  // Retries within the budget, rate limits, auth injection and the SSRF
  // guard. Streams a head, then the body in chunks. A request that got no
  // response fails the RPC with a classified Error.
  rpc HTTP(HTTPRequest) returns (stream HTTPResponse);
  rpc Sign(SignRequest) returns (SignResponse);
  // Only for connectors on the proxy and raw egress tiers.
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc Log(LogRequest) returns (LogResponse);
  // KVGet and KVPut are scoped to the connector instance.
  rpc KVGet(KVGetRequest) returns (KVGetResponse);
  rpc KVPut(KVPutRequest) returns (KVPutResponse);
  rpc Now(NowRequest) returns (NowResponse);
}

message HTTPRequest {
  string method = 1;
  // Absolute.
  string url = 2;
  repeated Header headers = 3;
  bytes body = 4;
  HTTPAuth auth = 5;
  // Covers retries. Unset: the host's default.
  google.protobuf.Duration budget = 6;
  // Allows retrying a non-idempotent method, such as a POST with an
  // idempotency key.
  bool idempotent = 7;
  // Empty: the URL's host.
  string rate_limit_key = 8;
}

message Header {
  string name = 1;
  string value = 2;
}

message HTTPAuth {
  oneof scheme {
    BearerAuth bearer = 1;
    BasicAuth basic = 2;
    APIKeyAuth api_key = 3;
    OAuth2Auth oauth2 = 4;
    AWSSigV4Auth aws_sigv4 = 5;
  }
}

message BearerAuth {
  string token_secret = 1;
}

message BasicAuth {
  string username = 1;
  string password_secret = 2;
}

message APIKeyAuth {
  string key_secret = 1;
  oneof location {
    string header = 2;
    string query_param = 3;
  }
  // Prepended to the key, such as "Token ".
  string prefix = 4;
}

message OAuth2Auth {
  // Holds the client, the token URL and the refresh token.
  string credential_secret = 1;
}

message AWSSigV4Auth {
  // Holds the access key ID, the secret key and an optional session token.
  string credentials_secret = 1;
  string region = 2;
  string service = 3;
}

message HTTPResponse {
  oneof part {
    // First.
    HTTPResponseHead head = 1;
    bytes body = 2;
  }
}

message HTTPResponseHead {
  int32 status = 1;
  repeated Header headers = 2;
  // The host's classification of a final status of 400 or more. The body
  // that follows is truncated.
  Error error = 3;
}

message SignRequest {
  string key_secret = 1;
  oneof method {
    HMACSign hmac = 2;
    JWTSign jwt = 3;
  }
}

message HMACSign {
  HashAlgorithm hash = 1;
  bytes message = 2;
}

enum HashAlgorithm {
  HASH_ALGORITHM_UNSPECIFIED = 0;
  HASH_ALGORITHM_SHA1 = 1;
  HASH_ALGORITHM_SHA256 = 2;
  HASH_ALGORITHM_SHA512 = 3;
}

message JWTSign {
  JWTAlgorithm algorithm = 1;
  // A JSON object.
  bytes claims = 2;
  // Extra header fields, as a JSON object. The host sets alg and typ.
  bytes header = 3;
}

enum JWTAlgorithm {
  JWT_ALGORITHM_UNSPECIFIED = 0;
  JWT_ALGORITHM_HS256 = 1;
  JWT_ALGORITHM_RS256 = 2;
  JWT_ALGORITHM_ES256 = 3;
}

message SignResponse {
  // HMAC: the raw MAC. JWT: the compact JWS.
  bytes signature = 1;
}

message GetSecretRequest {
  string name = 1;
}

message GetSecretResponse {
  bytes value = 1;
}

message LogRequest {
  repeated LogEntry entries = 1;
}

message LogEntry {
  google.protobuf.Timestamp time = 1;
  LogLevel level = 2;
  string message = 3;
  map<string, string> attrs = 4;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARN = 3;
  LOG_LEVEL_ERROR = 4;
}

message LogResponse {}

message KVGetRequest {
  string key = 1;
}

message KVGetResponse {
  // Unset if the key is missing or expired.
  optional bytes value = 1;
}

message KVPutRequest {
  string key = 1;
  bytes value = 2;
  // Unset: never expires.
  google.protobuf.Duration ttl = 3;
}

message KVPutResponse {}

message NowRequest {}

message NowResponse {
  google.protobuf.Timestamp now = 1;
}
