syntax = "proto3";

package openetl.connector.v1;

import "openetl/connector/v1/destination.proto";
import "openetl/connector/v1/errors.proto";
import "openetl/connector/v1/source.proto";

option go_package = "github.com/openetl-io/openetl/sdk/go/protocol/v1;protocolv1";

// ConnectorService is served by every connector, next to SourceService or
// DestinationService. Configs are JSON objects matching the config schema;
// secret fields hold secret names, not values.
service ConnectorService {
  rpc Spec(SpecRequest) returns (SpecResponse);
  // A failed check is reported in CheckResponse, not as an RPC error.
  rpc Check(CheckRequest) returns (CheckResponse);
  // Setup and Teardown must be idempotent. They're called only when
  // SpecResponse.setup is set: Setup before each attempt that reads or
  // writes for a pipeline, and Teardown once the pipeline is deleted, to
  // remove what the connector keeps for it.
  rpc Setup(SetupRequest) returns (SetupResponse);
  rpc Teardown(TeardownRequest) returns (TeardownResponse);
}

message SpecRequest {
  // The platform calling; unset from a platform before the alpha.
  Host host = 1;
}

// Host is the runner, or the tool, that started the connector.
message Host {
  // Its release, such as 0.1.0; "dev" for a build from source.
  string version = 1;
  // "v1".
  string protocol = 2;
  // Additions to v1 after the alpha that it has. Everything in v1 at the
  // alpha is the baseline, with no name.
  repeated string features = 3;
}

message SpecResponse {
  // "v1".
  string protocol_version = 1;
  ConnectorKind kind = 2;
  // A JSON Schema. Fields marked "x-secret": true hold secret names. The
  // x- keywords a form reads, such as x-group and x-when, are in
  // docs/build-connectors.
  bytes config_schema = 3;
  Egress egress = 4;
  bool setup = 5;
  SourceCapabilities source = 6;
  DestinationCapabilities destination = 7;
  // Features the connector can't run without; a host without one refuses
  // it.
  repeated string required_features = 8;
}

enum ConnectorKind {
  CONNECTOR_KIND_UNSPECIFIED = 0;
  CONNECTOR_KIND_SOURCE = 1;
  CONNECTOR_KIND_DESTINATION = 2;
}

message Egress {
  EgressTier tier = 1;
  // Hosts for the proxy tier, host:port pairs for the raw tier.
  repeated string allow = 2;
}

enum EgressTier {
  EGRESS_TIER_UNSPECIFIED = 0;
  EGRESS_TIER_HOST = 1;
  EGRESS_TIER_PROXY = 2;
  EGRESS_TIER_RAW = 3;
}

message CheckRequest {
  bytes config = 1;
}

message CheckResponse {
  // Unset when the check passed. With items, the first failed item's error.
  Error error = 1;
  // What the check looked at, one item each, in the order it ran: a
  // pre-flight that can say which permission or which stream failed, and
  // what passed. Empty from a connector that reports only error.
  repeated CheckItem items = 2;
}

// CheckItem is one thing a check looked at, such as reaching the service,
// a permission, or one stream. Its text never holds secrets or records.
message CheckItem {
  // Unique within the response and the same from one check to the next,
  // such as stream.clicks.read, so a client can follow an item.
  string name = 1;
  // What was checked, for people: "Read stream clicks".
  string title = 2;
  CheckStatus status = 3;
  // What it found. For a failure, what failed.
  string message = 4;
  // When failed: the classified error.
  Error error = 5;
  // For a failure or a warning: what to do about it, such as the IAM
  // action to allow.
  string fix = 6;
  // The config field it concerns, as a dotted path such as
  // consumer.name; empty if none.
  string field = 7;
}

enum CheckStatus {
  CHECK_STATUS_UNSPECIFIED = 0;
  CHECK_STATUS_PASSED = 1;
  // Works, but not as configured or not as well as it could: a pipeline can
  // still run.
  CHECK_STATUS_WARNING = 2;
  CHECK_STATUS_FAILED = 3;
  // Not checked: an earlier item failed, or it can't be checked without
  // changing something, such as writing a record.
  CHECK_STATUS_SKIPPED = 4;
}

message SetupRequest {
  bytes config = 1;
  string pipeline = 2;
}

message SetupResponse {}

message TeardownRequest {
  bytes config = 1;
  string pipeline = 2;
}

message TeardownResponse {}
