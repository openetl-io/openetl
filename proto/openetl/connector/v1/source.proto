syntax = "proto3";

package openetl.connector.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/openetl-io/openetl/sdk/go/protocol/v1;protocolv1";

// SourceService is served by source connectors. The platform commits only at
// the resume points a source emits.
//
// A stream's read is a set of splits: resumable slices, such as
// key ranges, partitions or shards, which a source may read concurrently.
// The whole stream is the split with the empty ID, and a stream is read as
// that one split unless the platform asks Splits for others.
service SourceService {
  rpc Discover(DiscoverRequest) returns (DiscoverResponse);
  // For a bounded read, the response stream ends once every stream is
  // complete.
  rpc Read(ReadRequest) returns (stream ReadResponse);
  // Runs concurrently with Read. Called only when
  // SourceCapabilities.acknowledges is set.
  rpc Committed(CommittedRequest) returns (CommittedResponse);
  // A stream's splits for a read that starts. Called only when
  // SourceCapabilities.splits is set.
  rpc Splits(SplitsRequest) returns (SplitsResponse);
  // Asks for a split being read to have its remainder split in two. Runs
  // concurrently with Read. Called only when SourceCapabilities.resplit is
  // set.
  rpc Resplit(ResplitRequest) returns (ResplitResponse);
}

message SourceCapabilities {
  bool acknowledges = 1;
  // The source divides streams into splits, through Splits.
  bool splits = 2;
  // The source splits a running split's remainder, through Resplit.
  bool resplit = 3;
}

message DiscoverRequest {
  bytes config = 1;
}

message DiscoverResponse {
  Catalog catalog = 1;
}

message Catalog {
  repeated CatalogStream streams = 1;
}

message CatalogStream {
  string name = 1;
  // For raw-lane streams: a JSON Schema for one record.
  bytes json_schema = 2;
  // Declared logical types, by field name, as an Arrow IPC stream with no
  // batches; empty: inferred from the records. Rows on either lane may carry
  // a declared field as text, which the platform parses. A stream the
  // source can read with cdc also declares its op and seq control columns
  // here, marked as in its batches, since the platform needs seq's type
  // before the stream's first batch.
  bytes arrow_schema = 3;
  repeated string primary_key = 4;
  // How the source can read the stream, the way it reads it first; empty if
  // it doesn't say. A full refresh is written with overwrite by default.
  repeated SyncMode sync_modes = 5;
  string default_cursor = 6;
  bool source_defined_cursor = 7;
  Replay replay = 8;
  // Where the stream is split, every record of a key is in one split, so
  // its splits partition it by its primary key.
  bool splits_by_key = 9;
}

enum SyncMode {
  SYNC_MODE_UNSPECIFIED = 0;
  SYNC_MODE_FULL_REFRESH = 1;
  SYNC_MODE_INCREMENTAL = 2;
  SYNC_MODE_CDC = 3;
  SYNC_MODE_STREAM = 4;
}

enum Replay {
  // Counted as superset.
  REPLAY_UNSPECIFIED = 0;
  // Resuming yields exactly the records after the resume point.
  REPLAY_EXACT = 1;
  // Records can repeat after a resume.
  REPLAY_SUPERSET = 2;
}

message ReadRequest {
  bytes config = 1;
  repeated ConfiguredStream streams = 2;
  // The pipeline reading, which names what a source keeps for it upstream,
  // such as a replication slot.
  string pipeline = 3;
  // The read never ends: streams read with cdc or stream follow their
  // source until the read is cancelled. Otherwise they complete once
  // they've caught up with where their source was when the read started.
  bool continuous = 4;
  // How many of its splits the read may read at a time, a whole
  // stream counting as one, more if they share a connection. Zero: one.
  uint32 lanes = 5;
}

message ConfiguredStream {
  string name = 1;
  SyncMode sync_mode = 2;
  string cursor = 3;
  // The whole stream's state, without splits. Unset: start from the
  // beginning.
  optional bytes state = 4;
  // The splits to read, with their states; empty: the whole stream, from
  // state.
  repeated Split splits = 5;
}

// Split is one of a stream's splits. The whole stream has the empty ID. IDs
// are the source's, and must stay unique within the stream for as long as
// its read lasts.
message Split {
  string id = 1;
  // Unset: from its beginning.
  optional bytes state = 2;
}

message ReadResponse {
  oneof msg {
    RecordBatch batch = 1;
    ResumePoint resume_point = 2;
    StreamComplete complete = 3;
    Progress progress = 4;
  }
}

// RecordBatch carries records. A changelog stream's Arrow batches (read
// with SYNC_MODE_CDC) also carry control columns, which aren't records'
// fields: columns whose field metadata has openetl.control set to
//   - op: utf8, insert, update or delete, for _openetl_op; null is insert.
//   - seq: the record version's position, which orders a key's versions,
//     for _openetl_seq. Any type the platform can compare.
//   - unchanged: optional, a list of utf8: the columns an update didn't
//     send (Postgres's unchanged TOAST values), whose values are null. Merge
//     keeps what the destination has for them.
// Every batch of a changelog stream carries op and seq. Their names don't
// matter, and may be the same as a record field's.
message RecordBatch {
  string stream = 1;
  oneof records {
    // An Arrow IPC stream: the schema, any dictionaries, one record batch.
    bytes arrow = 2;
    JSONRows rows = 3;
  }
  // The split read; empty for the whole stream.
  string split = 4;
}

message JSONRows {
  // One JSON object each.
  repeated bytes rows = 1;
}

// ResumePoint says the split can restart from state after everything
// emitted for it so far.
message ResumePoint {
  string stream = 1;
  bytes state = 2;
  string split = 3;
  // Splits the stream gains from here on, with their states: a re-split's
  // remainder, which state no longer covers, or a shard whose parents are
  // read.
  repeated Split added = 4;
}

// StreamComplete ends a split of a bounded stream, and the stream once
// every split has ended. Like a resume point, it covers everything emitted
// for the split. A retry within the same sync doesn't read the split again.
message StreamComplete {
  string stream = 1;
  // Where the split's next sync starts. Unset: from the beginning, as a
  // full refresh does.
  optional bytes next = 2;
  string split = 3;
  // As ResumePoint.added.
  repeated Split added = 4;
}

// Progress says how far a read is behind its source, and how much longer the
// source keeps what the read hasn't acknowledged, for metrics. Send it every
// few seconds at most. Unset fields are unknown.
message Progress {
  // Empty: the whole read, such as a replication slot's.
  string stream = 1;
  // What the source holds that the read hasn't acknowledged: a replication
  // slot's bytes, a Kafka consumer group's offsets.
  optional uint64 lag_bytes = 2;
  optional uint64 lag_records = 3;
  // How far behind in time: the age of the change being read, or Kinesis's
  // MillisBehindLatest. Zero once the read has caught up.
  google.protobuf.Duration lag = 4;
  // How much more the source can take, or how long it waits, before it
  // discards what the read hasn't acknowledged.
  optional uint64 retention_left_bytes = 5;
  google.protobuf.Duration retention_left = 6;
}

message CommittedRequest {
  // Per-stream states of one checkpoint, for streams read whole. Everything
  // before them can be discarded upstream.
  map<string, bytes> states = 1;
  // The read's config, for when no read is running.
  bytes config = 2;
  // As states, by stream, for streams read in splits.
  map<string, Splits> splits = 3;
}

message Splits {
  repeated Split splits = 1;
}

message CommittedResponse {}

message SplitsRequest {
  bytes config = 1;
  // The stream as Read gets it, without its state.
  ConfiguredStream stream = 2;
  // Where each of its last read's splits ended, as StreamComplete.next;
  // empty for a stream never read. The new read's splits start from them.
  repeated Split ended = 3;
}

message SplitsResponse {
  // At least one. The whole stream alone: it isn't split.
  repeated Split splits = 1;
}

message ResplitRequest {
  bytes config = 1;
  string stream = 2;
  string split = 3;
}

message ResplitResponse {
  // The source splits the split's remainder at its next resume point, which
  // adds the new split. False: too little of it is left.
  bool accepted = 1;
}
