syntax = "proto3";

package openetl.connector.v1;

option go_package = "github.com/unsuitable001/openetl/sdk/go/protocol/v1;protocolv1";

// SourceService is served by source connectors. The platform commits only at
// the resume points a source emits.
service SourceService {
  rpc Discover(DiscoverRequest) returns (DiscoverResponse);
  // For a bounded read, the response stream ends once every stream is
  // complete.
  rpc Read(ReadRequest) returns (stream ReadResponse);
  // Runs concurrently with Read. Called only when
  // SourceCapabilities.acknowledges is set.
  rpc Committed(CommittedRequest) returns (CommittedResponse);
}

message SourceCapabilities {
  bool acknowledges = 1;
}

message DiscoverRequest {
  bytes config = 1;
}

message DiscoverResponse {
  Catalog catalog = 1;
}

message Catalog {
  repeated CatalogStream streams = 1;
}

message CatalogStream {
  string name = 1;
  // For raw-lane streams: a JSON Schema for one record.
  bytes json_schema = 2;
  // Declared logical types, by field name, as an Arrow IPC stream with no
  // batches; empty: inferred from the records. Rows on either lane may carry
  // a declared field as text, which the platform parses.
  bytes arrow_schema = 3;
  repeated string primary_key = 4;
  // How the source can read the stream, the way it reads it first; empty if
  // it doesn't say. A full refresh is written with overwrite by default.
  repeated SyncMode sync_modes = 5;
  string default_cursor = 6;
  bool source_defined_cursor = 7;
  Replay replay = 8;
}

enum SyncMode {
  SYNC_MODE_UNSPECIFIED = 0;
  SYNC_MODE_FULL_REFRESH = 1;
  SYNC_MODE_INCREMENTAL = 2;
  SYNC_MODE_CDC = 3;
  SYNC_MODE_STREAM = 4;
}

enum Replay {
  // Counted as superset.
  REPLAY_UNSPECIFIED = 0;
  // Resuming yields exactly the records after the resume point.
  REPLAY_EXACT = 1;
  // Records can repeat after a resume.
  REPLAY_SUPERSET = 2;
}

message ReadRequest {
  bytes config = 1;
  repeated ConfiguredStream streams = 2;
}

message ConfiguredStream {
  string name = 1;
  SyncMode sync_mode = 2;
  string cursor = 3;
  // Unset: start from the beginning.
  optional bytes state = 4;
}

message ReadResponse {
  oneof msg {
    RecordBatch batch = 1;
    ResumePoint resume_point = 2;
    StreamComplete complete = 3;
  }
}

message RecordBatch {
  string stream = 1;
  oneof records {
    // An Arrow IPC stream: the schema, any dictionaries, one record batch.
    bytes arrow = 2;
    JSONRows rows = 3;
  }
}

message JSONRows {
  // One JSON object each.
  repeated bytes rows = 1;
}

// ResumePoint says the stream can restart from state after everything
// emitted for it so far.
message ResumePoint {
  string stream = 1;
  bytes state = 2;
}

// StreamComplete ends a bounded stream. Like a resume point, it covers
// everything emitted for the stream. A retry within the same sync doesn't
// read the stream again.
message StreamComplete {
  string stream = 1;
  // Where the stream's next sync starts. Unset: from the beginning, as a
  // full refresh does.
  optional bytes next = 2;
}

message CommittedRequest {
  // Per-stream states of one checkpoint. Everything before them can be
  // discarded upstream.
  map<string, bytes> states = 1;
  // The read's config, for when no read is running.
  bytes config = 2;
}

message CommittedResponse {}
