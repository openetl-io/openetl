syntax = "proto3";

package openetl.connector.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/openetl-io/openetl/sdk/go/protocol/v1;protocolv1";

// ErrorCode is the error taxonomy. internal/platform/errs and the
// openetl-proto crate mirror it.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_TRANSIENT = 1;
  ERROR_CODE_RATE_LIMITED = 2;
  ERROR_CODE_AUTH_EXPIRED = 3;
  ERROR_CODE_AUTH_INVALID = 4;
  ERROR_CODE_PERMISSION_DENIED = 5;
  ERROR_CODE_CONFIG_INVALID = 6;
  ERROR_CODE_SCHEMA_DRIFT = 7;
  ERROR_CODE_CONTRACT_CHANGED = 8;
  ERROR_CODE_DATA_INVALID = 9;
  ERROR_CODE_DESTINATION_UNAVAILABLE = 10;
  ERROR_CODE_DESTINATION_QUOTA = 11;
  ERROR_CODE_RESOURCE_EXHAUSTED = 12;
  ERROR_CODE_INTERNAL = 13;
  // A newer attempt owns the pipeline.
  ERROR_CODE_FENCED = 14;
  // The runner is shutting down. The attempt stopped at a checkpoint, and
  // restarting it elsewhere doesn't count as a retry.
  ERROR_CODE_DRAINING = 15;
  // The source no longer has the position a stream resumes from, such as a
  // replication slot lost in a failover. Only a new read from the start,
  // such as a re-snapshot, carries on.
  ERROR_CODE_POSITION_LOST = 16;
}

// Error is a classified failure. A failed RPC carries it in the
// google.rpc.Status details.
message Error {
  ErrorCode code = 1;
  // Never contains secrets or record contents.
  string message = 2;
  google.protobuf.Duration retry_after = 3;
}
