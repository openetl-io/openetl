syntax = "proto3";

package openetl.connector.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "openetl/connector/v1/errors.proto";

option go_package = "github.com/unsuitable001/openetl/sdk/go/protocol/v1;protocolv1";

// DestinationService is served by destination connectors.
service DestinationService {
  // One stream per attempt's writer. The platform sends open, then recover,
  // then start_reads, batches, end_reads, pre-commits, schemas and commits,
  // and closes its side to close the writer. The connector answers open,
  // recover, each pre-commit, each schema and each commit.
  //
  // Batches for epoch N+1 can arrive before pre-commit N. Schemas and commits
  // run concurrently with later batches and pre-commits, but never with each
  // other. A failed schema or commit is answered with its error; any other
  // failure ends the stream.
  rpc Write(stream WriteRequest) returns (stream WriteResponse);
}

message DestinationCapabilities {
  SinkClass sink_class = 1;
  repeated CommitScope scopes = 2;
  // The sink can skip append and overwrite rows whose _openetl_id is already
  // in the target.
  bool dedupe_at_apply = 3;
  google.protobuf.Duration default_commit_interval = 4;
  google.protobuf.Duration min_commit_interval = 5;
  // Timestamps keep nanoseconds; otherwise only microseconds.
  bool nanosecond_timestamps = 6;
  // The longest table or column name, in bytes; 0 for no limit.
  uint32 max_identifier_length = 7;
  // Empty: append only.
  repeated WriteMode write_modes = 8;
  // Unset: no maximum.
  google.protobuf.Duration max_commit_interval = 9;
}

enum SinkClass {
  SINK_CLASS_UNSPECIFIED = 0;
  SINK_CLASS_STAGE_AND_APPLY = 1;
  SINK_CLASS_TRANSACTIONAL_STREAM = 2;
  SINK_CLASS_DELIVER_AND_ACK = 3;
}

enum CommitScope {
  COMMIT_SCOPE_UNSPECIFIED = 0;
  COMMIT_SCOPE_PIPELINE = 1;
  COMMIT_SCOPE_STREAM = 2;
}

enum WriteMode {
  WRITE_MODE_UNSPECIFIED = 0;
  WRITE_MODE_APPEND = 1;
  WRITE_MODE_OVERWRITE = 2;
  // Upsert on the primary key.
  WRITE_MODE_MERGE = 3;
}

enum Recovery {
  RECOVERY_UNSPECIFIED = 0;
  RECOVERY_APPLIED = 1;
  RECOVERY_REDONE = 2;
  RECOVERY_LOST = 3;
}

// Epoch is checkpoint N within the generation that wrote it. N is 0 when
// there is no checkpoint yet.
message Epoch {
  uint64 generation = 1;
  uint64 n = 2;
}

message WriteRequest {
  oneof msg {
    WriteOpen open = 1;
    WriteRecover recover = 2;
    WriteBatch batch = 3;
    WritePreCommit pre_commit = 4;
    WriteCommit commit = 5;
    WriteApplySchema apply_schema = 6;
    WriteStartReads start_reads = 7;
    WriteEndRead end_read = 8;
  }
}

message WriteOpen {
  // Secret fields hold secret names.
  bytes config = 1;
  string pipeline = 2;
  string namespace = 3;
  uint64 generation = 4;
  CommitScope scope = 5;
  repeated WriteStream streams = 6;
  // How often the platform commits, for sinks whose transactions must outlast
  // an epoch.
  google.protobuf.Duration commit_interval = 7;
}

message WriteStream {
  string name = 1;
  WriteMode mode = 2;
  repeated string primary_key = 3;
  // Only for sinks with dedupe_at_apply.
  Dedupe dedupe = 4;
  // Merge only.
  DeleteMode deletes = 5;
}

// DeleteMode is how merge applies a record whose _openetl_op is delete.
enum DeleteMode {
  // Soft.
  DELETE_MODE_UNSPECIFIED = 0;
  // Keep the row, with _openetl_deleted true and its other columns as they
  // were.
  DELETE_MODE_SOFT = 1;
  // Delete the row.
  DELETE_MODE_HARD = 2;
}

// Dedupe is which append and overwrite rows an apply skips by _openetl_id.
enum Dedupe {
  // None: every staged row is inserted.
  DEDUPE_UNSPECIFIED = 0;
  // One row per ID in the epoch, and only IDs the target doesn't have yet.
  DEDUPE_TARGET = 1;
  // One row per ID in the epoch.
  DEDUPE_EPOCH = 2;
}

// WriteRecover raises the destination fence to the writer's generation, then
// recovers epoch. With no epoch, it only raises the fence and reports
// applied. Otherwise it may then drop whatever earlier generations staged,
// since none of it can be applied any more.
message WriteRecover {
  Epoch epoch = 1;
  bytes staged = 2;
}

message WriteBatch {
  Epoch epoch = 1;
  string stream = 2;
  // An Arrow IPC stream: the schema, any dictionaries, one record batch.
  bytes arrow = 3;
}

// WriteStartReads comes after recover and before the first batch, with when
// each stream the attempt reads started its read. A read an earlier attempt
// began keeps its start, so a stream whose start changed began a new read.
// Unanswered, like batches.
message WriteStartReads {
  map<string, google.protobuf.Timestamp> starts = 1;
}

// WriteEndRead says the stream's read ended in epoch: its last batch came
// before this. Overwrite writes replace the table with what the read wrote
// when the epoch commits. Unanswered, like batches.
message WriteEndRead {
  Epoch epoch = 1;
  string stream = 2;
}

// WritePreCommit stages the epoch durably but invisibly.
message WritePreCommit {
  Epoch epoch = 1;
}

// WriteCommit makes the epoch visible, with a marker per stream, behind the
// fence. Idempotent.
message WriteCommit {
  Epoch epoch = 1;
  bytes staged = 2;
}

// WriteApplySchema makes each stream's table hold its schema: it creates
// tables, adds columns and widens types, and never drops or narrows them.
// Idempotent, and not fenced. Only sent to destinations that have a schema.
message WriteApplySchema {
  repeated StreamSchema streams = 1;
}

message StreamSchema {
  string name = 1;
  // An Arrow IPC stream with no batches, metadata columns included.
  bytes arrow_schema = 2;
}

message WriteResponse {
  oneof msg {
    WriteRecovered recovered = 1;
    WriteStaged staged = 2;
    WriteCommitted committed = 3;
    WriteOpened opened = 4;
    WriteSchemaApplied schema_applied = 5;
  }
}

message WriteOpened {
  // The writer changes schemas, so the platform sends apply_schema.
  bool applies_schema = 1;
}

message WriteSchemaApplied {
  // Set if applying failed. The stream stays open, and the schemas can be
  // sent again.
  Error error = 1;
}

message WriteRecovered {
  Recovery recovery = 1;
}

message WriteStaged {
  Epoch epoch = 1;
  // Stored in the epoch's checkpoint record and passed back to commit and
  // recover. Keep it to a few KB.
  bytes staged = 2;
}

message WriteCommitted {
  Epoch epoch = 1;
  // Set if the commit failed. The stream stays open, and the commit can be
  // sent again.
  Error error = 2;
  // By stream: staged rows the apply didn't insert, because of dedupe.
  map<string, uint64> collapsed_rows = 3;
}
