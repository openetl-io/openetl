version: "2"

run:
  build-tags: [integration]

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^http\.(DefaultClient|DefaultTransport|Transport|Get|Head|Post|PostForm)$
          pkg: ^net/http$
          msg: outbound HTTP goes through internal/netguard, the SSRF guard
    # Package boundary rules, each with its reason.
    depguard:
      rules:
        connectors-use-only-the-sdk:
          files: ["**/connectors/**"]
          deny:
            - pkg: github.com/openetl-io/openetl/internal
              desc: connectors may import only sdk/go and third-party packages
            - pkg: github.com/openetl-io/openetl/gen
              desc: connectors may import only sdk/go and third-party packages
        sdk-is-standalone:
          files: ["**/sdk/go/**"]
          deny:
            - pkg: github.com/openetl-io/openetl/internal
              desc: the SDK must not depend on the platform
            - pkg: github.com/openetl-io/openetl/gen
              desc: the SDK must not depend on the platform
        data-path-has-no-control-plane:
          files: ["**/internal/runner/**", "**/internal/connectorhost/**"]
          deny:
            - pkg: github.com/openetl-io/openetl/internal/orchestration/workflows
              desc: the data path must not depend on workflow code
            - pkg: github.com/openetl-io/openetl/internal/api
              desc: the data path must not depend on the API server
        only-the-temporal-backend-imports-temporal:
          files: ["$all", "!**/internal/orchestration/temporalbackend/**", "!**/internal/platform/temporalx/**", "!**/test/e2e/**", "!**/internal/orchestration/workflows/*_test.go"]
          deny:
            - pkg: go.temporal.io
              desc: workflows are written against internal/orchestration, and runners reach only the API
        only-the-dbos-backend-imports-dbos:
          files: ["$all", "!**/internal/orchestration/dbosbackend/**", "!**/test/e2e/**", "!**/internal/orchestration/workflows/*_test.go"]
          deny:
            - pkg: github.com/dbos-inc/dbos-transact-golang
              desc: workflows are written against internal/orchestration, and runners reach only the API
        workflows-are-deterministic:
          files: ["**/internal/orchestration/workflows/**", "!**/*_test.go"]
          deny:
            - pkg: net/http
              desc: workflow code must not do I/O; use a step
            - pkg: database/sql
              desc: workflow code must not do I/O; use a step
            - pkg: os
              desc: workflow code must not do I/O; use a step
            - pkg: math/rand
              desc: workflow code must be deterministic
            - pkg: crypto/rand
              desc: workflow code must be deterministic
            - pkg: sync
              desc: workflow code must be deterministic
        only-engineclient-talks-to-the-engine:
          files: ["$all", "!**/internal/engineclient/**"]
          deny:
            - pkg: github.com/openetl-io/openetl/gen/openetl/engine
              desc: only internal/engineclient may use the engine protocol
        only-llm-imports-llm-sdks:
          files: ["$all", "!**/internal/llm/**"]
          deny:
            - pkg: github.com/anthropics/anthropic-sdk-go
              desc: LLM access goes through internal/llm
        only-gitsync-imports-go-git:
          files: ["$all", "!**/internal/gitsync/**"]
          deny:
            - pkg: github.com/go-git/go-git
              desc: git access goes through internal/gitsync
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx, forbidigo]
      - path: internal/netguard/
        linters: [forbidigo]
      # The CLI talks to openetld's API, whose address the user gives.
      - path: cmd/openetl/
        linters: [forbidigo]
      # Staged files come from URLs the runner signed for one object each,
      # which connectors fetch themselves on every egress tier.
      - path: sdk/go/staging/
        linters: [forbidigo]
      # Starting the executables an operator or a connector's author names
      # (connectors, the engine, dbt, spark-submit, docker) is what openetl
      # does. They get their arguments as argv, never through a shell from
      # data, and G204 flags every one.
      - linters: [gosec]
        text: "G204:"
      # G101 matches names such as token and secret. What it flags here are
      # names, prefixes and usage text: no credential is written in code.
      - linters: [gosec]
        text: "G101:"
      # Generated rows are the same for the same seed, so faker needs a
      # seeded generator, not crypto/rand.
      - path: connectors/native/faker/
        linters: [gosec]
        text: "G404:"
      # HMAC-SHA1 is one of the signing methods connectors may ask for, as
      # some APIs require it.
      - path: internal/connectorhost/hostservices/sign\.go
        linters: [gosec]
        text: "G505:"
      # The session cookie is Secure whenever the console is served over
      # https; over http, browsers would drop it.
      - path: internal/api/signin\.go
        linters: [gosec]
        text: "G124:"
      # The kit's container runs as another user, which may map to any host
      # uid, so the socket it's given must be open to everyone.
      - path: sdk/go/conformance/container\.go
        linters: [gosec]
        text: "G302:"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/openetl-io/openetl
